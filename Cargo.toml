[package]
name = "holon"
version = "0.63.0"
edition = "2021"
default-run = "holon"
authors = ["Holon Contributors"]
description = "A headless, event-driven runtime for long-lived agents"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://holon.run"
repository = "https://github.com/holon-run/holon"
documentation = "https://holon.run"
publish = false

[dependencies]
holon-runtime = { version = "0.1.0", path = "crates/holon-runtime" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
holon-context = { version = "0.1.0", path = "crates/holon-context" }
holon-http-api = { version = "0.1.0", path = "crates/holon-http-api" }
holon-server = { version = "0.1.0", path = "crates/holon-server" }
holon-tui = { version = "0.1.0", path = "crates/holon-tui" }
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "gzip", "json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.14"
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[features]
default = []
local-onnx = ["holon-runtime/local-onnx"]
recovery-acceptance = ["holon-runtime/recovery-acceptance"]

[dev-dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
flate2 = "1.0"
fs2 = "0.4"
futures-util = "0.3"
holon-memory-index = { version = "0.1.0", path = "crates/holon-memory-index" }
holon-tools = { version = "0.1.0", path = "crates/holon-tools" }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks", "trace"] }
tar = "0.4"
tokio = { version = "1.43", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux daemons use jemalloc so freed pages are purged back to the OS instead
# of accumulating per-arena high-watermark RSS (#2931).
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[lib]
name = "holon"
path = "src/lib.rs"

[[bin]]
name = "holon"
path = "src/main.rs"

[[example]]
name = "avatar_probe"
path = "src/avatar/probe.rs"

[[bench]]
name = "avatar_render"
path = "src/avatar/bench.rs"
harness = false

[[bench]]
name = "runtime_db"
harness = false

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "http_control"
harness = false

[[bench]]
name = "memory_lifecycle"
harness = false

[[bench]]
name = "performance_attribution"
harness = false

[[bench]]
name = "observability_overhead"
harness = false

[[bench]]
name = "conversation_read"
harness = false

[[bench]]
name = "context_snapshot"
harness = false

[[bench]]
name = "agent_state_workload"
harness = false

[[bench]]
name = "state_http"
harness = false

[[bench]]
name = "task_history_scale"
harness = false

[package]
name = "holon"
version = "0.60.0"
edition = "2021"
default-run = "holon"
authors = ["Holon Contributors"]
description = "A headless, event-driven runtime for long-lived agents"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://holon.run"
repository = "https://github.com/holon-run/holon"
documentation = "https://holon.run"

# crates.io caps package uploads at 10 MB. Ship only what is required to build
# and use the crate; keep monorepo-only assets (docs site, benchmarks, macOS
# app, bot service, SDK packages, raw models.dev data) out of the tarball.
exclude = [
    ".codex",
    ".github",
    "apps",
    "benchmark",
    "benchmarks",
    "docs",
    "holonbot",
    "models.dev/artifact.json",
    "models.dev/refresh-summary.md",
    "models.dev/snapshot.json",
    "packages",
    "scripts",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
clap = { version = "4.5", features = ["derive", "env"] }
decision-core = { version = "0.1.0", path = "crates/decision-core" }
decision-clef = { version = "0.1.0", path = "crates/decision-clef" }
decision-jev = { version = "0.1.0", path = "crates/decision-jev" }
decision-openai = { version = "0.1.0", path = "crates/decision-openai" }
decision-openai-decisions = { version = "0.1.0", path = "crates/decision-openai-decisions" }
futures-util = "0.3"
decision-local-onnx = { version = "0.1.0", path = "crates/decision-local-onnx", optional = true }
holon-agent-templates = { version = "0.1.0", path = "crates/holon-agent-templates" }
holon-client = { version = "0.1.0", path = "crates/holon-client" }
holon-config = { version = "0.1.0", path = "crates/holon-config" }
holon-context = { version = "0.1.0", path = "crates/holon-context" }
holon-domain = { version = "0.1.0", path = "crates/holon-domain", features = ["error-sanitization"] }
holon-github = { version = "0.1.0", path = "crates/holon-github" }
holon-memory-index = { version = "0.1.0", path = "crates/holon-memory-index" }
holon-model-catalog = { version = "0.1.0", path = "crates/holon-model-catalog" }
holon-observability = { version = "0.1.0", path = "crates/holon-observability" }
holon-provider = { version = "0.1.0", path = "crates/holon-provider" }
holon-server = { version = "0.1.0", path = "crates/holon-server" }
holon-storage = { version = "0.1.0", path = "crates/holon-storage" }
holon-system = { version = "0.1.0", path = "crates/holon-system" }
holon-tools = { version = "0.1.0", path = "crates/holon-tools" }
holon-tui = { version = "0.1.0", path = "crates/holon-tui" }
holon-web-retrieval = { version = "0.1.0", path = "crates/holon-web-retrieval" }
flate2 = "1.0"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "gzip", "json", "rustls-tls", "stream"], default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45.1", default-features = false }
rpassword = "7.3"
rust-embed = "8.11"
rusqlite = { version = "0.31", features = ["bundled", "hooks", "trace"] }
percent-encoding = "2.3"
mime_guess = "2.0"
schemars = { version = "0.9", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.14"
toml = "1.0"
sha2 = "0.10"
jsonwebtoken = { version = ">=10.3.0, <11", features = ["rust_crypto"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-casefold = "0.2"
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v4"] }
aide = { version = "0.15.1", features = ["axum"] }

[features]
default = []
local-onnx = ["dep:decision-local-onnx", "decision-local-onnx/onnx"]
recovery-acceptance = []

[dev-dependencies]
holon-agent-templates = { version = "0.1.0", path = "crates/holon-agent-templates", features = ["test-support"] }
holon-memory-index = { version = "0.1.0", path = "crates/holon-memory-index", features = ["test-support"] }
holon-tui = { version = "0.1.0", path = "crates/holon-tui", features = ["test-support"] }
holon-model-catalog = { version = "0.1.0", path = "crates/holon-model-catalog", features = ["test-support"] }
holon-provider = { version = "0.1.0", path = "crates/holon-provider", features = ["runtime-tests"] }
holon-storage = { version = "0.1.0", path = "crates/holon-storage", features = ["test-support"] }
proptest = "1.6"
rusqlite = { version = "0.31", features = ["hooks", "trace"] }
tokio = { version = "1.43", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux daemons use jemalloc so freed pages are purged back to the OS instead
# of accumulating per-arena high-watermark RSS (#2931).
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[lib]
name = "holon"
path = "src/lib.rs"

[[bin]]
name = "holon"
path = "src/main.rs"

[[example]]
name = "avatar_probe"
path = "src/avatar/probe.rs"

[[bench]]
name = "avatar_render"
path = "src/avatar/bench.rs"
harness = false

[[bench]]
name = "runtime_db"
harness = false

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "http_control"
harness = false

[[bench]]
name = "memory_lifecycle"
harness = false

[[bench]]
name = "performance_attribution"
harness = false

[[bench]]
name = "observability_overhead"
harness = false

[[bench]]
name = "conversation_read"
harness = false

[[bench]]
name = "context_snapshot"
harness = false

[[bench]]
name = "agent_state_workload"
harness = false

[[bench]]
name = "state_http"
harness = false

[[bench]]
name = "task_history_scale"
harness = false

org.gradle.caching=true
org.gradle.configuration-cache=true
# D8 dex merging and R8 run in-process in the Gradle build JVM (AGP's
# DexMergingTask uses no-isolation workers), so this heap covers them; 2g
# OOM'd dex merging on CI (#4351).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true

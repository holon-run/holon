[package]
name = "holon-config"
version = "0.1.0"
edition = "2021"
description = "Persisted configuration and model routing for Holon"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"
homepage = "https://holon.run"

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
holon-domain = { version = "0.1.0", path = "../holon-domain" }
holon-model-catalog = { version = "0.1.0", path = "../holon-model-catalog" }
holon-provider = { version = "0.1.0", path = "../holon-provider" }
holon-storage = { version = "0.1.0", path = "../holon-storage" }
holon-system = { version = "0.1.0", path = "../holon-system" }
http = "1.0"
schemars = { version = "0.9", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
holon-model-catalog = { version = "0.1.0", path = "../holon-model-catalog", features = ["test-support"] }
toml = "1.0"

[package]
name = "holon-github"
version = "0.1.0"
edition = "2021"
description = "GitHub repository clients and bounded archive fetching for Holon"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"

[features]
test-support = []

[dependencies]
anyhow = "1.0"
chrono = "0.4"
flate2 = "1.0"
holon-domain = { version = "0.1.0", path = "../holon-domain", features = ["error-sanitization"] }
reqwest = { version = "0.12", features = ["blocking", "gzip", "json", "rustls-tls", "stream"], default-features = false }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.14"
tokio = { version = "1.43", features = ["io-util", "process", "rt", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros"] }

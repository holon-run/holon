[package]
name = "holon-acp"
version = "0.1.0"
edition = "2021"
description = "Agent Client Protocol (wire v1) client and external harness profiles for Holon"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"
readme = "README.md"
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[package]
name = "holon-observability"
version = "0.1.0"
edition = "2021"
description = "Bounded metrics, traces, and diagnostics export for Holon"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
holon-domain = { version = "0.1.0", path = "../holon-domain" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.43", features = ["macros", "rt", "sync"] }
uuid = { version = "1.11", features = ["v4"] }

[package]
name = "decision-core"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic contracts for typed decision providers"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

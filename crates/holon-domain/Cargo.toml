[package]
name = "holon-domain"
version = "0.1.0"
edition = "2021"
description = "Shared domain types for the Holon runtime"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
schemars = { version = "0.9", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

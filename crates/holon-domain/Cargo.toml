[package]
name = "holon-domain"
version = "0.1.0"
edition = "2021"
description = "Shared domain types for the Holon runtime"
license = "Apache-2.0"
repository = "https://github.com/holon-run/holon"
readme = "README.md"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", default-features = false, features = ["derive", "std"] }
cron = "0.17"
schemars = { version = "0.9", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
unicode-casefold = "0.2"
uuid = { version = "1.11", features = ["v4"] }

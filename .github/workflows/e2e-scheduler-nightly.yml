name: E2E Scheduler Nightly

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Real model route for E2E.
        required: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  changes:
    name: Detect scheduler code changes
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.detect.outputs.should-run }}
    steps:
      - name: Compare with previous scheduled run
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("should-run", "true");
              core.summary.addRaw("Manual dispatch: running scheduler E2E.\n");
              await core.summary.write();
              return;
            }
            try {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "e2e-scheduler-nightly.yml",
                  event: "schedule",
                  per_page: 100,
                }
              );
              const previous = runs.find(
                run => run.id !== context.runId && run.status === "completed"
              );
              if (!previous) {
                core.setOutput("should-run", "true");
                core.summary.addRaw("No previous scheduled run: running scheduler E2E.\n");
                await core.summary.write();
                return;
              }
              if (previous.head_sha === context.sha) {
                core.setOutput("should-run", "false");
                core.summary.addRaw(
                  `No commits since scheduled run ${previous.id}; skipping scheduler E2E.\n`
                );
                await core.summary.write();
                return;
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${previous.head_sha}...${context.sha}`,
                per_page: 100,
              });
              const files = comparison.data.files || [];
              const truncated =
                comparison.data.truncation === true || files.length >= 300;
              const exact = new Set([
                ".dockerignore",
                "Cargo.toml",
                "Cargo.lock",
                "Dockerfile",
                "Makefile",
                "build.rs",
                "scripts/docker-e2e.py",
                ".github/workflows/e2e-scheduler-nightly.yml",
                ".github/workflows/release-e2e.yml",
              ]);
              const prefixes = [
                "src/",
                "tests/",
                "agent_templates/",
                "builtin_templates/",
                "scripts/docker_e2e/",
              ];
              const changed = files.filter(
                file => exact.has(file.filename)
                  || prefixes.some(prefix => file.filename.startsWith(prefix))
              );
              const shouldRun = truncated || changed.length > 0;
              core.setOutput("should-run", shouldRun ? "true" : "false");
              core.summary.addRaw(
                truncated
                  ? `Commit comparison since run ${previous.id} was truncated; running E2E.\n`
                  : shouldRun
                  ? `Scheduler-relevant changes found since run ${previous.id}; running E2E.\n`
                  : `Only non-code changes found since run ${previous.id}; skipping E2E.\n`
              );
              await core.summary.write();
            } catch (error) {
              core.warning(`Unable to detect scheduler code changes: ${error.message}`);
              core.setOutput("should-run", "true");
              core.summary.addRaw(
                "Unable to detect scheduler code changes; running E2E.\n"
              );
              await core.summary.write();
            }

  nightly:
    name: Scheduler E2E Nightly
    needs: changes
    if: needs.changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLON_E2E_MODEL: ${{ inputs.model || vars.HOLON_E2E_SCHEDULER_MODEL || 'dashscope-token-plan/qwen-3.7' }}
      HOLON_E2E_CREDENTIAL_ENV: ${{ vars.HOLON_E2E_SCHEDULER_CREDENTIAL_ENV || 'DASHSCOPE_TOKEN_PLAN_API_KEY' }}
      HOLON_E2E_CREDENTIAL: ${{ secrets.HOLON_E2E_SCHEDULER_CREDENTIAL || secrets.DASHSCOPE_TOKEN_PLAN_API_KEY || secrets.DEEPSEEK_API_KEY }}
      HOLON_E2E_CONFIG_JSON: ${{ vars.HOLON_E2E_SCHEDULER_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:nightly
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Run deterministic scheduler matrix
        run: |
          set -euo pipefail
          python3 scripts/docker-e2e.py \
            --image holon:nightly \
            --skip-build \
            --profile scheduler-required \
            --scheduler-matrix \
            --timeout 120 \
            --evidence-dir target/docker-e2e/scheduler-required

      - name: Prepare provider configuration
        id: provider-env
        continue-on-error: true
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: |
          set -euo pipefail
          test -n "${HOLON_E2E_CREDENTIAL}"
          [[ "${HOLON_E2E_CREDENTIAL_ENV}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]
          umask 077
          printf '%s=%s\n' \
            "${HOLON_E2E_CREDENTIAL_ENV}" \
            "${HOLON_E2E_CREDENTIAL}" > "${HOLON_E2E_PROVIDER_ENV_FILE}"
          chmod 0600 "${HOLON_E2E_PROVIDER_ENV_FILE}"
          if [ -n "${HOLON_E2E_CONFIG_JSON}" ]; then
            printf '%s' "${HOLON_E2E_CONFIG_JSON}" > "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
            python3 -m json.tool "${HOLON_E2E_PROVIDER_CONFIG_FILE}" >/dev/null
            chmod 0600 "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
          fi

      - name: Run scheduler live canary
        id: live-canary
        if: steps.provider-env.outcome == 'success'
        continue-on-error: true
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
        run: |
          set -euo pipefail
          config_file=/tmp/holon-e2e-config.json
          args=(
            --image holon:nightly
            --skip-build
            --profile scheduler-live-canary
            --scheduler-matrix
            --env-file "${HOLON_E2E_PROVIDER_ENV_FILE}"
            --timeout 120
            --evidence-dir target/docker-e2e/scheduler-live-canary
          )
          if [ -s "${config_file}" ]; then
            args+=(--config-file "${config_file}")
          fi
          python3 scripts/docker-e2e.py "${args[@]}"

      - name: Publish run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = json.loads(
              Path("target/docker-e2e/scheduler-required/summary.json").read_text()
          )
          canary_path = Path(
              "target/docker-e2e/scheduler-live-canary/"
              "scheduler-live-canary-report.json"
          )
          canary = json.loads(canary_path.read_text()) if canary_path.is_file() else None
          lines = [
              "# Scheduler E2E Nightly",
              "",
              f"- Deterministic gate: **{required['status']}**",
              f"- Live canary: **{canary['status'] if canary else 'missing'}**",
              f"- Live model: `{canary['model_route'] if canary else 'unknown'}`",
              f"- Live provider retries: `{canary['provider_retries'] if canary else 'unknown'}`",
              "",
              "| Deterministic case | Result | Duration |",
              "| --- | --- | ---: |",
          ]
          for case in required["case_results"]:
              lines.append(
                  f"| `{case['id']}` | {case['status']} | {case['duration_seconds']}s |"
              )
          if canary:
              lines.extend([
                  "",
                  f"- Live tool counts: `{json.dumps(canary['cases'][0]['tool_counts'], sort_keys=True)}`",
                  f"- Live behavioral variance: `{json.dumps(canary['behavioral_variances'], sort_keys=True)}`",
              ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

      - name: Require dispatched live canary success
        if: github.event_name == 'workflow_dispatch'
        env:
          PROVIDER_ENV_OUTCOME: ${{ steps.provider-env.outcome }}
          LIVE_CANARY_OUTCOME: ${{ steps.live-canary.outcome }}
        run: |
          test "${PROVIDER_ENV_OUTCOME}" = success
          test "${LIVE_CANARY_OUTCOME}" = success

      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-e2e-nightly
          path: |
            target/docker-e2e/scheduler-required
            target/docker-e2e/scheduler-live-canary

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const issueParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduler E2E Nightly Failure (${new Date().toISOString().slice(0,10)})`,
              body: `The nightly scheduler E2E suite failed. See [the run](${runUrl}).`
            };
            try {
              await github.rest.issues.create({...issueParams, labels: ["e2e-failure", "scheduler"]});
            } catch (labelError) {
              // Labels may not exist in the repo; retry without them so the
              // failure notification is never silently lost.
              core.warning(`Could not apply labels: ${labelError.message}`);
              await github.rest.issues.create(issueParams);
            }

      - name: Remove provider configuration
        if: always()
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: rm -f "${HOLON_E2E_PROVIDER_ENV_FILE}" "${HOLON_E2E_PROVIDER_CONFIG_FILE}"

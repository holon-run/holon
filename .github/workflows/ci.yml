name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - "apps/android/**"
      - "packages/client-wire-kotlin/**"
      - "packages/conversation-sdk/**"
      - "agent_templates/**"
      - "builtin_templates/**"
      - "docs/website/reference/openapi.json"
      - "docs/website/reference/model-tool-schema-inventory.json"
      - "web-gui/**"
      - "Makefile"
      - "build.rs"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-e2e.py"
      - "scripts/docker-live-acceptance.py"
      - "scripts/docker_e2e/**"
      - ".github/workflows/e2e-scheduler-nightly.yml"
      - ".github/workflows/release-e2e.yml"
      - "tests/e2e/scheduler/**"
      - "apps/macos/**"
      - "scripts/create-macos-dmg.sh"
      - "scripts/package-macos-menu-app.sh"
      - "scripts/verify-macos-menu-app.sh"
      - "scripts/ci_timing.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - "apps/android/**"
      - "packages/client-wire-kotlin/**"
      - "packages/conversation-sdk/**"
      - "agent_templates/**"
      - "builtin_templates/**"
      - "docs/website/reference/openapi.json"
      - "docs/website/reference/model-tool-schema-inventory.json"
      - "web-gui/**"
      - "Makefile"
      - "build.rs"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-e2e.py"
      - "scripts/docker-live-acceptance.py"
      - "scripts/docker_e2e/**"
      - ".github/workflows/e2e-scheduler-nightly.yml"
      - ".github/workflows/release-e2e.yml"
      - "tests/e2e/scheduler/**"
      - "apps/macos/**"
      - "scripts/create-macos-dmg.sh"
      - "scripts/package-macos-menu-app.sh"
      - "scripts/verify-macos-menu-app.sh"
      - "scripts/ci_timing.py"
  workflow_dispatch:
  schedule:
    # Nightly full-sweep safety net: path-tiered main pushes skip
    # Coverage/macOS, so every tier still runs once a day.
    - cron: "40 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Full sweep = workflow_dispatch or schedule: every tier runs and
      # path filters are ignored (the filter step is skipped).
      full_sweep: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
      docker: ${{ steps.filter.outputs.docker }}
      rust: ${{ steps.filter.outputs.rust }}
      conversation_sdk: ${{ steps.filter.outputs.conversation_sdk }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      macos_app: ${{ steps.filter.outputs.macos_app }}
      macos_rust_check: ${{ steps.filter.outputs.macos_rust_check }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            docker:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'build.rs'
              - 'scripts/docker-smoke.sh'
              - 'scripts/docker-e2e.py'
              - 'scripts/docker-live-acceptance.py'
              - 'scripts/docker_e2e/**'
              - '.github/workflows/e2e-scheduler-nightly.yml'
              - '.github/workflows/release-e2e.yml'
            rust:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'tests/**'
              - 'crates/**'
              - 'scripts/ci_test_shards.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'Makefile'
              - 'agent_templates/**'
              - 'builtin_templates/**'
              - 'docs/website/reference/openapi.json'
              - 'scripts/ci_timing.py'
            conversation_sdk:
              - 'packages/conversation-sdk/**'
              - '.github/workflows/ci.yml'
            web:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/fixtures/client-wire/**'
              - 'web-gui/**'
              - 'packages/client-wire-kotlin/**'
              - '.github/workflows/ci.yml'
              - 'docs/website/reference/openapi.json'
            android:
              - 'apps/android/**'
              - 'packages/client-wire-kotlin/**'
              - '.github/workflows/ci.yml'
            macos_app:
              - '.github/workflows/ci.yml'
              - 'apps/macos/**'
              - 'scripts/create-macos-dmg.sh'
              - 'scripts/package-macos-menu-app.sh'
              - 'scripts/verify-macos-menu-app.sh'
            macos_rust_check:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-gui/app/package-lock.json
            web-gui/openapi-tools/package-lock.json
            packages/conversation-sdk/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build web GUI
        run: make web-ci

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test SDK and build APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon :sdk:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

  conversation-sdk:
    name: Conversation SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.conversation_sdk == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/conversation-sdk/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-conversation-sdk
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test conversation SDK protocol
        run: make conversation-sdk-ci

  macos-rust-check:
    name: Rust darwin check
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    # PR-level darwin compile gate: `cargo check` both macOS targets so Rust
    # changes catch darwin-only breakage without paying for the full menu app
    # build. Main pushes skip it (PRs and nightly/dispatch sweeps cover it).
    if: needs.changes.outputs.full_sweep == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.macos_rust_check == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-macos-check
          workspaces: |
            . -> target/macos-aarch64
            . -> target/macos-x86_64
          cache-bin: false
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}

      - name: Check Apple Silicon Holon runtime
        env:
          CARGO_TARGET_DIR: target/macos-aarch64
        run: cargo check --locked --target aarch64-apple-darwin

      - name: Check Intel Holon runtime
        env:
          CARGO_TARGET_DIR: target/macos-x86_64
        run: cargo check --locked --target x86_64-apple-darwin

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    timeout-minutes: 45
    needs: changes
    # Main pushes run this only for macOS-specific changes; rust-tier main
    # pushes skip it (PRs and nightly/dispatch full sweeps cover it).
    if: needs.changes.outputs.full_sweep == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.macos_app == 'true') || (github.event_name == 'push' && needs.changes.outputs.macos_app == 'true' && needs.changes.outputs.rust != 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-macos-release
          workspaces: |
            . -> target/macos-aarch64
            . -> target/macos-x86_64
          cache-bin: false
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}

      - name: Build Apple Silicon Holon runtime
        env:
          CARGO_TARGET_DIR: target/macos-aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build Intel Holon runtime
        env:
          CARGO_TARGET_DIR: target/macos-x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/macos-aarch64/aarch64-apple-darwin/release/holon \
            target/macos-x86_64/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package unsigned macOS app and DMG
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Upload macOS app build
        uses: actions/upload-artifact@v4
        with:
          name: ci-holon-macos-app
          path: |
            dist/Holon.app
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
          if-no-files-found: error

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.docker == 'true' || (github.event_name == 'push' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:ci
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Smoke test image
        run: scripts/docker-smoke.sh holon:ci

      - name: Validate Docker E2E runner
        run: make docker-e2e-validate

      - name: Export image for downstream E2E jobs
        if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
        run: |
          mkdir -p target
          docker image save --output target/holon-ci.tar holon:ci

      - name: Upload image for downstream E2E jobs
        if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-holon-docker-image
          path: target/holon-ci.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish latest image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker tag holon:ci "${repository}:latest"
          docker push "${repository}:latest"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-rust
          env-vars: RUSTFLAGS
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        if: needs.changes.outputs.full_sweep != 'true' && needs.changes.outputs.conversation_sdk != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/conversation-sdk/package-lock.json

      - name: Test conversation SDK protocol
        if: needs.changes.outputs.full_sweep != 'true' && needs.changes.outputs.conversation_sdk != 'true'
        run: make conversation-sdk-ci

      - name: Check formatting
        run: make fmt-check

      - name: Check decision crate formatting
        run: |
          cargo fmt --manifest-path crates/decision-core/Cargo.toml -- --check
          cargo fmt --manifest-path crates/decision-jev/Cargo.toml -- --check
          cargo fmt --manifest-path crates/decision-openai/Cargo.toml -- --check

      - name: Audit test temp resources
        run: make test-resource-lint

      - name: Test CI timing tooling
        run: python3 -m unittest tests.test_ci_timing tests.test_ci_test_shards

      - name: Clippy
        run: make lint
        env:
          RUSTFLAGS: ""

      - name: Build all targets, including benchmarks
        run: make build

      - name: Test decision crates
        run: |
          cargo test --manifest-path crates/decision-core/Cargo.toml --locked
          cargo test --manifest-path crates/decision-jev/Cargo.toml --locked
          cargo test --manifest-path crates/decision-openai/Cargo.toml --locked

      - name: Package check
        run: |
          if grep -q 'decision-core = {.*path = "crates/decision-core"' Cargo.toml; then
            echo "::notice::Skipping crates.io package dry-run because holon depends on unpublished local decision crates."
          else
            cargo publish --dry-run --locked
          fi

      - name: Check generated snapshots
        run: make snapshots-check

  rust-test:
    name: Rust Test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [lib, control, cli, misc]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore test shard build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-rust
          env-vars: RUSTFLAGS
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run test shard
        run: |
          set -o pipefail
          mkdir -p target/ci-timing
          make test-shard SHARD=${{ matrix.shard }} 2>&1 | tee target/ci-timing/rust-test.log

      - name: Summarize Rust test targets
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ci_timing.py parse-test-log \
            --input target/ci-timing/rust-test.log \
            --output target/ci-timing/rust-test-targets.json

      - name: Upload Rust test timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rust-test-timing-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/ci-timing/rust-test-targets.json
          if-no-files-found: warn

  rust-concurrent:
    name: Rust Concurrent
    needs: changes
    if: needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore concurrent test build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-concurrent
          env-vars: RUSTFLAGS
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test concurrent runtime lifecycles
        run: make test-concurrent

      - name: Repeat core lifecycle tests on main
        if: github.event_name == 'push'
        run: make test-concurrent-repeat CONCURRENT_REPEATS=2

  coverage:
    name: Coverage
    needs: changes
    # Coverage runs only in nightly and manual full sweeps: the lcov
    # artifact has no downstream gate, so PRs and path-tiered main
    # pushes no longer spend a Linux runner slot (~23m) on it.
    if: needs.changes.outputs.full_sweep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/llvm-cov
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-gui/app/package-lock.json
            packages/conversation-sdk/package-lock.json

      - name: Build web GUI
        if: needs.changes.outputs.web == 'true'
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Restore coverage build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ci-coverage
          env-vars: CARGO_TARGET_DIR
          workspaces: . -> target/llvm-cov
          cache-bin: false
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clear stale coverage profiles
        run: |
          if [ -d "${CARGO_TARGET_DIR}" ]; then
            find "${CARGO_TARGET_DIR}" -type f \
              \( -name '*.profraw' -o -name '*.profdata' \) -delete
          fi

      - name: Generate coverage
        run: cargo llvm-cov --no-clean --lib --bins --tests --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  e2e-scheduler:
    name: Scheduler Live Canary (optional)
    needs:
      - changes
      - docker
    if: always() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true') && contains(github.event.pull_request.labels.*.name, 'e2e-scheduler')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    env:
      HOLON_E2E_MODEL: ${{ vars.HOLON_E2E_SCHEDULER_MODEL || 'dashscope-token-plan/qwen-3.7' }}
      HOLON_E2E_CREDENTIAL_ENV: ${{ vars.HOLON_E2E_SCHEDULER_CREDENTIAL_ENV || 'DASHSCOPE_TOKEN_PLAN_API_KEY' }}
      HOLON_E2E_CREDENTIAL: ${{ secrets.HOLON_E2E_SCHEDULER_CREDENTIAL || secrets.DASHSCOPE_TOKEN_PLAN_API_KEY || secrets.DEEPSEEK_API_KEY }}
      HOLON_E2E_CONFIG_JSON: ${{ vars.HOLON_E2E_SCHEDULER_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Download shared image
        if: needs.docker.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ci-holon-docker-image
          path: target

      - name: Load shared image
        if: needs.docker.result == 'success'
        run: |
          docker image load --input target/holon-ci.tar
          docker image tag holon:ci holon:e2e

      - name: Set up Docker Buildx
        if: needs.docker.result == 'skipped'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.docker.result == 'skipped'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:e2e
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Prepare provider configuration
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: |
          set -euo pipefail
          test -n "${HOLON_E2E_CREDENTIAL}"
          [[ "${HOLON_E2E_CREDENTIAL_ENV}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]
          umask 077
          printf '%s=%s\n' \
            "${HOLON_E2E_CREDENTIAL_ENV}" \
            "${HOLON_E2E_CREDENTIAL}" > "${HOLON_E2E_PROVIDER_ENV_FILE}"
          chmod 0600 "${HOLON_E2E_PROVIDER_ENV_FILE}"
          if [ -n "${HOLON_E2E_CONFIG_JSON}" ]; then
            printf '%s' "${HOLON_E2E_CONFIG_JSON}" > "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
            python3 -m json.tool "${HOLON_E2E_PROVIDER_CONFIG_FILE}" >/dev/null
            chmod 0600 "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
          fi

      - name: Run scheduler live canary
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
        run: |
          set -euo pipefail
          config_file=/tmp/holon-e2e-config.json
          args=(
            --image holon:e2e
            --skip-build
            --profile scheduler-live-canary
            --scheduler-matrix
            --env-file "${HOLON_E2E_PROVIDER_ENV_FILE}"
            --timeout 120
            --evidence-dir target/docker-e2e/scheduler-live-canary
          )
          if [ -s "${config_file}" ]; then
            args+=(--config-file "${config_file}")
          fi
          python3 scripts/docker-e2e.py "${args[@]}"

      - name: Publish live canary summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path(
              "target/docker-e2e/scheduler-live-canary/"
              "scheduler-live-canary-report.json"
          )
          if not report_path.is_file():
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          lines = [
              "# Scheduler Live Canary",
              "",
              f"- Status: **{report['status']}**",
              f"- Model: `{report['model_route']}`",
              f"- Provider retries: `{report['provider_retries']}`",
              f"- Tool counts: `{json.dumps(report['cases'][0]['tool_counts'], sort_keys=True)}`",
              f"- Behavioral variance: `{json.dumps(report['behavioral_variances'], sort_keys=True)}`",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

      - name: Upload live canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-live-canary
          path: target/docker-e2e/scheduler-live-canary

      - name: Remove provider configuration
        if: always()
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: rm -f "${HOLON_E2E_PROVIDER_ENV_FILE}" "${HOLON_E2E_PROVIDER_CONFIG_FILE}"

  scheduler-e2e-required:
    name: Scheduler E2E Required
    needs:
      - changes
      - docker
    if: always() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && (needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download shared image
        if: needs.docker.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ci-holon-docker-image
          path: target

      - name: Load shared image
        if: needs.docker.result == 'success'
        run: |
          docker image load --input target/holon-ci.tar
          docker image tag holon:ci holon:scheduler-required

      - name: Set up Docker Buildx
        if: needs.docker.result == 'skipped'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.docker.result == 'skipped'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:scheduler-required
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Run deterministic scheduler E2E
        run: |
          set -euo pipefail
          python3 scripts/docker-e2e.py \
            --image holon:scheduler-required \
            --skip-build \
            --profile scheduler-required \
            --scheduler-matrix \
            --timeout 120 \
            --evidence-dir target/docker-e2e/scheduler-required

      - name: Verify required reports
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("target/docker-e2e/scheduler-required")
          for name in (
              "summary.json",
              "scheduler-acceptance-report.json",
              "scheduler-coverage-report.json",
          ):
              report = json.loads((root / name).read_text())
              if report["status"] != "pass":
                  raise SystemExit(f"{name} did not pass: {report['status']}")
          PY

      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-e2e-required
          path: target/docker-e2e/scheduler-required

  timing:
    name: CI Timing
    needs:
      - changes
      - web
      - macos-app
      - macos-rust-check
      - docker
      - rust
      - rust-test
      - rust-concurrent
      - coverage
      - e2e-scheduler
      - scheduler-e2e-required
    if: always() && (needs.changes.outputs.full_sweep == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust test timing
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-rust-test-timing-*
          path: target/ci-timing

      - name: Collect workflow timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/ci-timing/history
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > target/ci-timing/current-jobs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=success&event=${GITHUB_EVENT_NAME}&per_page=10" \
            --jq '.workflow_runs[].id' \
            > target/ci-timing/history-run-ids.txt
          export GITHUB_REPOSITORY GH_TOKEN
          # shellcheck disable=SC2016
          xargs -r -P 10 -I {} sh -c '
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/{}/jobs?per_page=100" \
              > "target/ci-timing/history/{}.json"
          ' < target/ci-timing/history-run-ids.txt
          python3 scripts/ci_timing.py summarize \
            --current-jobs target/ci-timing/current-jobs.json \
            --history-dir target/ci-timing/history \
            --rust-test-targets target/ci-timing/*/rust-test-targets.json \
            --output target/ci-timing/summary.json \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --cache-status not-configured

      - name: Upload CI timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.run_attempt }}
          path: |
            target/ci-timing/summary.json
            target/ci-timing/rust-test-targets.json
          if-no-files-found: warn

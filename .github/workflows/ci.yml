name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - "agent_templates/**"
      - "builtin_templates/**"
      - "docs/website/reference/openapi.json"
      - "docs/website/reference/model-tool-schema-inventory.json"
      - "web-gui/**"
      - "Makefile"
      - "build.rs"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-e2e.py"
      - "scripts/docker-live-acceptance.py"
      - "scripts/docker_e2e/**"
      - ".github/workflows/e2e-scheduler-nightly.yml"
      - "tests/e2e/scheduler/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - "agent_templates/**"
      - "builtin_templates/**"
      - "docs/website/reference/openapi.json"
      - "docs/website/reference/model-tool-schema-inventory.json"
      - "web-gui/**"
      - "Makefile"
      - "build.rs"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-e2e.py"
      - "scripts/docker-live-acceptance.py"
      - "scripts/docker_e2e/**"
      - ".github/workflows/e2e-scheduler-nightly.yml"
      - "tests/e2e/scheduler/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'build.rs'
              - 'scripts/docker-smoke.sh'
              - 'scripts/docker-e2e.py'
              - 'scripts/docker-live-acceptance.py'
              - 'scripts/docker_e2e/**'
            rust:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'Makefile'
              - 'agent_templates/**'
              - 'builtin_templates/**'
              - 'web-gui/**'
            web:
              - 'web-gui/**'
              - '.github/workflows/ci.yml'

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:ci
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Smoke test image
        run: scripts/docker-smoke.sh holon:ci

      - name: Validate Docker E2E runner
        run: make docker-e2e-validate

      - name: Publish latest image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker tag holon:ci "${repository}:latest"
          docker push "${repository}:latest"

  rust:
    name: Rust
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-gui/app/package-lock.json
            web-gui/openapi-tools/package-lock.json

      - name: Test and build web GUI
        if: needs.changes.outputs.web == 'true'
        run: make web-ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Check generated snapshots
        run: make snapshots-check

      - name: Audit test temp resources
        run: make test-resource-lint

      - name: Test
        run: make test

      - name: Clippy
        run: make lint
        env:
          RUSTFLAGS: ""

  rust-concurrent:
    name: Rust Concurrent
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test concurrent runtime lifecycles
        run: make test-concurrent

      - name: Repeat core lifecycle tests on main
        if: github.event_name == 'push'
        run: make test-concurrent-repeat CONCURRENT_REPEATS=2

  coverage:
    name: Coverage
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-gui/app/package-lock.json

      - name: Build web GUI
        if: needs.changes.outputs.web == 'true'
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  e2e-scheduler:
    name: E2E Scheduler Live (optional)
    needs: changes
    if: contains(github.event.pull_request.labels.*.name, 'e2e-scheduler')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    env:
      HOLON_E2E_MODEL: ${{ vars.HOLON_E2E_SCHEDULER_MODEL || 'deepseek/deepseek-v4-flash' }}
      HOLON_E2E_DOCKER_ENV_FILE: /tmp/holon-e2e.env
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:e2e
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Prepare provider environment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY}"
          umask 077
          printf 'DEEPSEEK_API_KEY=%s\n' "${DEEPSEEK_API_KEY}" > "${HOLON_E2E_DOCKER_ENV_FILE}"
          chmod 0600 "${HOLON_E2E_DOCKER_ENV_FILE}"

      - name: Run scheduler Tier-1 E2E
        run: |
          set -euo pipefail
          python3 scripts/docker-e2e.py \
            --image holon:e2e \
            --skip-build \
            --scheduler-matrix \
            --suite extended \
            --tag e2e-tier-1 \
            --env-file "${HOLON_E2E_DOCKER_ENV_FILE}" \
            --timeout 600

      - name: Remove provider environment
        if: always()
        run: rm -f "${HOLON_E2E_DOCKER_ENV_FILE}"

  scheduler-e2e-required:
    name: Scheduler E2E Required
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: holon:scheduler-required
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

      - name: Run deterministic scheduler E2E
        run: |
          set -euo pipefail
          python3 scripts/docker-e2e.py \
            --image holon:scheduler-required \
            --skip-build \
            --profile scheduler-required \
            --scheduler-matrix \
            --timeout 600 \
            --evidence-dir target/docker-e2e/scheduler-required

      - name: Verify required reports
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("target/docker-e2e/scheduler-required")
          for name in (
              "summary.json",
              "scheduler-acceptance-report.json",
              "scheduler-coverage-report.json",
          ):
              report = json.loads((root / name).read_text())
              if report["status"] != "pass":
                  raise SystemExit(f"{name} did not pass: {report['status']}")
          PY

      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-e2e-required
          path: target/docker-e2e/scheduler-required

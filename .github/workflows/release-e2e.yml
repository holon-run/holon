name: Release E2E

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Git ref or full commit SHA to build and test.
        required: true
      release_tag:
        description: Intended release tag, for example v0.14.0.
        required: true
      previous_image:
        description: Previous release image used by upgrade cases.
        required: false
      model:
        description: Real model route.
        required: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build candidate image
    runs-on: ubuntu-latest
    environment: release-e2e
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.ref }}
      sha: ${{ steps.image.outputs.commit }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Resolve candidate identity
        id: image
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${repository}:candidate-${commit}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            OCI_VERSION=${{ inputs.release_tag }}
            OCI_REVISION=${{ steps.image.outputs.commit }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=holon-docker
          cache-to: type=gha,mode=max,scope=holon-docker

  core:
    name: Real LLM core suite
    needs: candidate
    runs-on: ubuntu-latest
    environment: release-e2e
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE_IMAGE: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
      HOLON_E2E_MODEL: ${{ inputs.model || vars.HOLON_E2E_SCHEDULER_MODEL || 'dashscope-token-plan/qwen-3.7' }}
      HOLON_E2E_CREDENTIAL_ENV: ${{ vars.HOLON_E2E_SCHEDULER_CREDENTIAL_ENV || 'DASHSCOPE_TOKEN_PLAN_API_KEY' }}
      HOLON_E2E_CREDENTIAL: ${{ secrets.HOLON_E2E_SCHEDULER_CREDENTIAL || secrets.DASHSCOPE_TOKEN_PLAN_API_KEY || secrets.DEEPSEEK_API_KEY }}
      HOLON_E2E_CONFIG_JSON: ${{ vars.HOLON_E2E_SCHEDULER_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare protected provider configuration
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: |
          set -euo pipefail
          test -n "${HOLON_E2E_CREDENTIAL}"
          [[ "${HOLON_E2E_CREDENTIAL_ENV}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]
          umask 077
          printf '%s=%s\n' \
            "${HOLON_E2E_CREDENTIAL_ENV}" \
            "${HOLON_E2E_CREDENTIAL}" > "${HOLON_E2E_PROVIDER_ENV_FILE}"
          chmod 0600 "${HOLON_E2E_PROVIDER_ENV_FILE}"
          if [ -n "${HOLON_E2E_CONFIG_JSON}" ]; then
            printf '%s' "${HOLON_E2E_CONFIG_JSON}" > "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
            python3 -m json.tool "${HOLON_E2E_PROVIDER_CONFIG_FILE}" >/dev/null
            chmod 0600 "${HOLON_E2E_PROVIDER_CONFIG_FILE}"
          fi

      - name: Pull and smoke candidate digest
        run: |
          set -euo pipefail
          docker pull "${CANDIDATE_IMAGE}"
          scripts/docker-smoke.sh "${CANDIDATE_IMAGE}"

      - name: Run release core E2E
        env:
          HOLON_E2E_PREVIOUS_IMAGE: ${{ inputs.previous_image || 'ghcr.io/holon-run/holon:v0.30.0' }}
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
        run: |
          set -euo pipefail
          config_file=/tmp/holon-e2e-config.json
          args=(
            --image-digest "${CANDIDATE_IMAGE}"
            --skip-build
            --suite core
            --env-file "${HOLON_E2E_PROVIDER_ENV_FILE}"
            --evidence-dir target/docker-e2e/release-core
          )
          if [ -s "${config_file}" ]; then
            args+=(--config-file "${config_file}")
          fi
          if [ -n "${HOLON_E2E_PREVIOUS_IMAGE}" ]; then
            args+=(--previous-image "${HOLON_E2E_PREVIOUS_IMAGE}")
          fi
          python3 scripts/docker-e2e.py "${args[@]}"

      - name: Run deterministic scheduler release gate
        run: |
          set -euo pipefail
          python3 scripts/docker-e2e.py \
            --image-digest "${CANDIDATE_IMAGE}" \
            --skip-build \
            --profile scheduler-required \
            --scheduler-matrix \
            --timeout 120 \
            --evidence-dir target/docker-e2e/scheduler-required

      - name: Run scheduler live canary
        continue-on-error: true
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
        run: |
          set -euo pipefail
          config_file=/tmp/holon-e2e-config.json
          args=(
            --image-digest "${CANDIDATE_IMAGE}"
            --skip-build
            --profile scheduler-live-canary
            --scheduler-matrix
            --env-file "${HOLON_E2E_PROVIDER_ENV_FILE}"
            --timeout 120
            --evidence-dir target/docker-e2e/scheduler-live-canary
          )
          if [ -s "${config_file}" ]; then
            args+=(--config-file "${config_file}")
          fi
          python3 scripts/docker-e2e.py "${args[@]}"

      - name: Publish run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("target/docker-e2e/release-core/summary.json").read_text()
          )
          scheduler_report = json.loads(
              Path(
                  "target/docker-e2e/scheduler-required/"
                  "scheduler-acceptance-report.json"
              ).read_text()
          )
          canary_path = Path(
              "target/docker-e2e/scheduler-live-canary/"
              "scheduler-live-canary-report.json"
          )
          canary = json.loads(canary_path.read_text()) if canary_path.is_file() else None
          lines = [
              "# Release Docker E2E",
              "",
              f"- Status: **{summary['status']}**",
              f"- Candidate: `{summary['image']['ref']}`",
              f"- Git SHA: `{summary['git_sha']}`",
              f"- Deterministic scheduler gate: **{scheduler_report['status']}**",
              f"- Scheduler live canary: **{canary['status'] if canary else 'missing'}**",
              f"- Runtime schema revision: `{scheduler_report['runtime_schema_revision']}`",
              f"- Fixture corpus: `{scheduler_report['fixture_corpus_revision']}`",
              f"- Core model: `{summary['model_route']}`",
              f"- Canary provider retries: `{canary['provider_retries'] if canary else 'unknown'}`",
              f"- Canary tool counts: `{json.dumps(canary['cases'][0]['tool_counts'], sort_keys=True) if canary else 'unknown'}`",
              f"- Canary behavioral variance: `{json.dumps(canary['behavioral_variances'], sort_keys=True) if canary else 'unknown'}`",
              f"- Duration: `{summary['duration_seconds']}s`",
              "",
              "| Case | Result | Duration |",
              "| --- | --- | ---: |",
          ]
          for case in summary["case_results"]:
              lines.append(
                  f"| `{case['id']}` | {case['status']} | {case['duration_seconds']}s |"
              )
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Write release E2E attestation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("target/docker-e2e/release-core/summary.json")
          summary = json.loads(summary_path.read_text())
          if summary["status"] != "pass":
              raise SystemExit(f"Release E2E did not pass: {summary['status']}")
          scheduler_root = Path("target/docker-e2e/scheduler-required")
          scheduler_report_path = scheduler_root / "scheduler-acceptance-report.json"
          scheduler_report = json.loads(scheduler_report_path.read_text())
          coverage_report_path = scheduler_root / "scheduler-coverage-report.json"
          coverage_report = json.loads(coverage_report_path.read_text())
          canary_report_path = Path(
              "target/docker-e2e/scheduler-live-canary/"
              "scheduler-live-canary-report.json"
          )
          canary_report = (
              json.loads(canary_report_path.read_text())
              if canary_report_path.is_file()
              else None
          )
          if scheduler_report["status"] != "pass":
              raise SystemExit(
                  f"Scheduler acceptance did not pass: {scheduler_report['status']}"
              )
          if coverage_report["status"] != "pass":
              raise SystemExit(
                  f"Scheduler coverage did not pass: {coverage_report['status']}"
              )
          if scheduler_report["git_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("Scheduler acceptance Git SHA does not match candidate")
          if scheduler_report["image_digest"] != summary["image_digest"]:
              raise SystemExit("Scheduler acceptance image digest does not match summary")
          if coverage_report["git_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("Scheduler coverage Git SHA does not match candidate")
          if coverage_report["image_digest"] != summary["image_digest"]:
              raise SystemExit("Scheduler coverage image digest does not match summary")
          if coverage_report["profile"] != "scheduler-required":
              raise SystemExit("Scheduler coverage profile is not scheduler-required")
          attestation = {
              "schema_version": 1,
              "release_tag": os.environ["RELEASE_TAG"],
              "candidate_ref": os.environ["CANDIDATE_REF"],
              "git_sha": os.environ["CANDIDATE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "status": summary["status"],
              "model_route": summary["model_route"],
              "image": summary["image"],
              "image_digest": summary["image_digest"],
              "scheduler_acceptance": scheduler_report,
              "scheduler_coverage": coverage_report,
              "scheduler_live_canary": canary_report,
              "summary_path": str(summary_path),
              "scheduler_acceptance_path": str(scheduler_report_path),
              "scheduler_coverage_path": str(coverage_report_path),
              "scheduler_live_canary_path": (
                  str(canary_report_path) if canary_report is not None else None
              ),
          }
          Path("target/release-e2e-attestation").mkdir(parents=True, exist_ok=True)
          Path("target/release-e2e-attestation/release-e2e-attestation.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n"
          )
          PY
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Prepare safe evidence upload
        if: always()
        run: |
          set -euo pipefail
          rm -rf target/docker-e2e-upload
          mkdir -p target/docker-e2e-upload
          python3 - <<'PY'
          import shutil
          import json
          from pathlib import Path

          evidence_roots = [
              path
              for path in (
                  Path("target/docker-e2e/release-core"),
                  Path("target/docker-e2e/scheduler-required"),
                  Path("target/docker-e2e/scheduler-live-canary"),
              )
              if (path / "summary.json").is_file()
          ]
          if not evidence_roots:
              Path("target/docker-e2e-upload/upload-blocked.txt").write_text(
                  "Raw evidence upload blocked because no secret-scan.json was produced.\n"
              )
              raise SystemExit(0)
          for evidence in evidence_roots:
              destination = Path("target/docker-e2e-upload") / evidence.name
              scan_path = evidence / "secret-scan.json"
              if not scan_path.is_file():
                  destination.mkdir(parents=True, exist_ok=True)
                  (destination / "raw-evidence-blocked.txt").write_text(
                      f"Raw evidence upload blocked because {scan_path} is missing.\n"
                  )
                  continue
              scan = json.loads(scan_path.read_text())
              if scan.get("status") != "pass":
                  destination.mkdir(parents=True, exist_ok=True)
                  for name in ("secret-scan.json", "summary.json", "junit.xml"):
                      source = evidence / name
                      if source.is_file():
                          shutil.copy2(source, destination / name)
                  (destination / "raw-evidence-blocked.txt").write_text(
                      "Raw evidence upload blocked because the secret scan failed. "
                      "Only metadata was uploaded.\n"
                  )
                  continue
              shutil.copytree(evidence, destination)
          PY

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ needs.candidate.outputs.sha }}
          path: target/docker-e2e-upload/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-attestation-${{ needs.candidate.outputs.sha }}-${{ inputs.release_tag }}
          path: target/release-e2e-attestation/release-e2e-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove provider configuration
        if: always()
        env:
          HOLON_E2E_PROVIDER_ENV_FILE: /tmp/holon-e2e.env
          HOLON_E2E_PROVIDER_CONFIG_FILE: /tmp/holon-e2e-config.json
        run: rm -f "${HOLON_E2E_PROVIDER_ENV_FILE}" "${HOLON_E2E_PROVIDER_CONFIG_FILE}"

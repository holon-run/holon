name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'action.yml'
      - 'scripts/beta_train_ci_gate*.sh'
      - 'scripts/gradle_flake_retry*.sh'
  push:
    paths:
      - '.github/workflows/**'
      - 'action.yml'
      - 'scripts/beta_train_ci_gate*.sh'
      - 'scripts/gradle_flake_retry*.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.9
        with:
          args: -shellcheck=

  beta-train-ci-gate:
    name: beta-train CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run beta-train CI gate tests
        run: bash scripts/beta_train_ci_gate_test.sh

  gradle-flake-retry:
    name: Gradle flake retry tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gradle flake retry tests
        run: bash scripts/gradle_flake_retry_test.sh

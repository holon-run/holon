name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release converges task-result settlement on terminal turns with atomic finalization of poisoned interrupted-replay pairs, settles cancelled-timer dependent waits and restores supervised child settlements by their original invocation, gives agents created without an initial message a default bootstrap initialization turn, and makes subagent conversation entries visible with in-app navigation. RuntimeDb reads move onto bounded read-only connection pools with batched agents-list projection, standalone daemon logs are bounded with complete stdio capture, and provider HTTP phase timeouts now separate from long-stream budgets. The web GUI gains silent cached-session validation, markdown image and link fidelity fixes, and cross-tab auth-rejection loop protection; Android reconciles offline outbox messages with stale-send fencing and a transient-failure tracker; iOS adds an identity-bound in-app browser with unified App-link semantics and a two-phase connect login. Visual tools gain per-call media model selection with bounded image delivery, the reviewed model catalog is refreshed with endpoint-specific capabilities, and inference credentials are omitted from public catalogs. Agent templates get dedicated bilingual detail pages, a new email assistant template ships, and the security review template gains audit skills and a GitHub Security workflow.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Runtime and task lifecycle
          - Task-result settlement converges on terminal turns with bounded recovery reentry ([#3625](https://github.com/holon-run/holon/pull/3625)), poisoned interrupted replay pairs are finalized and settlement invariant failures quarantined ([#3612](https://github.com/holon-run/holon/pull/3612), [#3613](https://github.com/holon-run/holon/pull/3613)).
          - Interrupted turn kind persists on runtime abort ([#3631](https://github.com/holon-run/holon/pull/3631)), turn-start commits atomically and continues historical sequence numbers after reincarnation ([#3615](https://github.com/holon-run/holon/pull/3615)), and completed turns no longer emit no-brief fallback notices ([#3630](https://github.com/holon-run/holon/pull/3630)).
          - Cancelled-timer dependent waits settle atomically instead of leaking registered waits ([#3642](https://github.com/holon-run/holon/pull/3642)), suppressed timer fires and starved queue heads surface explicitly ([#3613](https://github.com/holon-run/holon/pull/3613)), and supervised child settlements restore by their original invocation after recovery ([#3594](https://github.com/holon-run/holon/pull/3594)).
          - Same-turn consumption of supervised task results is recognized ([#3681](https://github.com/holon-run/holon/pull/3681)), reply routing accepts legal agent messages that inherit operator instructions ([#3602](https://github.com/holon-run/holon/pull/3602)), and agent deletion retires focus and execution atomically ([#3589](https://github.com/holon-run/holon/pull/3589)).
          - Idle-input recovery rejection reports concrete predicates and replay-reference classification ([#3592](https://github.com/holon-run/holon/pull/3592)), and the final report stage wraps softly under a uniform tool-round limit ([#3674](https://github.com/holon-run/holon/pull/3674)).

          ### Bootstrap, agents, and templates
          - Agents created without an initial message get a default bootstrap initialization turn ([#3685](https://github.com/holon-run/holon/pull/3685)).
          - Background agent bootstrap is crash-safe with atomic template materialization ([#3677](https://github.com/holon-run/holon/pull/3677)).
          - Subagent conversation entries become visible with in-app navigation ([#3684](https://github.com/holon-run/holon/pull/3684)).
          - An email assistant template and workflow ships ([#3623](https://github.com/holon-run/holon/pull/3623)); the security review template gains audit skills and a GitHub Security workflow ([#3673](https://github.com/holon-run/holon/pull/3673)); agent templates get dedicated bilingual detail pages ([e888f2c7](https://github.com/holon-run/holon/commit/e888f2c70debcde57e6129b9589bc917c5f84daa)).
          - Local App hosting becomes generic with an optional manifest ([#3636](https://github.com/holon-run/holon/pull/3636)).

          ### Storage, performance, and daemon
          - RuntimeDb reuses bounded read-only connections ([#3662](https://github.com/holon-run/holon/pull/3662)) and moves the remaining pure reads onto the bounded read pool ([#3668](https://github.com/holon-run/holon/pull/3668)).
          - The agents list batches posture projection ([#3649](https://github.com/holon-run/holon/pull/3649)) and unread work is isolated from roster assembly ([#3591](https://github.com/holon-run/holon/pull/3591)).
          - Startup-phase observability lands with serial recovery characterization ([#3635](https://github.com/holon-run/holon/pull/3635)).
          - Standalone daemon logs are bounded with complete stdio capture ([#3661](https://github.com/holon-run/holon/pull/3661)).
          - Vulnerable Rust TLS dependencies are patched ([#3640](https://github.com/holon-run/holon/pull/3640)), toolchain dependencies are refreshed ([#3658](https://github.com/holon-run/holon/pull/3658), [#3659](https://github.com/holon-run/holon/pull/3659)), and Node runtimes pin the October security releases ([#3675](https://github.com/holon-run/holon/pull/3675)).

          ### Web GUI
          - Cached sessions validate silently and can send explicitly ([#3629](https://github.com/holon-run/holon/pull/3629)); cached first-screen bootstrap retries are gated correctly ([#3610](https://github.com/holon-run/holon/pull/3610)).
          - Markdown web links are distinguished from host file references ([#3599](https://github.com/holon-run/holon/pull/3599)) and markdown image components survive re-renders ([#3647](https://github.com/holon-run/holon/pull/3647)).
          - Turn boundaries are separated from task receipt details ([#3624](https://github.com/holon-run/holon/pull/3624)), and session source icons and turn titles are unified ([#3627](https://github.com/holon-run/holon/pull/3627)).
          - Cross-tab auth rejection no longer causes reload loops ([#3682](https://github.com/holon-run/holon/pull/3682)).
          - First-run setup explains next steps and empty API keys ([#3676](https://github.com/holon-run/holon/pull/3676)).

          ### Mobile clients
          - Android reconciles received outbox messages and fences stale sends ([#3671](https://github.com/holon-run/holon/pull/3671)), adds a transient network failure tracker with debounce tests ([#3652](https://github.com/holon-run/holon/pull/3652)), shows the target network cache before revalidation ([#3600](https://github.com/holon-run/holon/pull/3600)), aligns session turn presentation with per-source details ([#3637](https://github.com/holon-run/holon/pull/3637)), and polishes the home list with offline debounce and fewer retry banners ([#3651](https://github.com/holon-run/holon/pull/3651)).
          - iOS gains an identity-bound in-app browser with unified App-link semantics ([#3616](https://github.com/holon-run/holon/pull/3616)), a two-phase single-screen connect login ([#3628](https://github.com/holon-run/holon/pull/3628)), readable cached rosters during network verification ([#3604](https://github.com/holon-run/holon/pull/3604)), host-named AI data recipients in sharing disclosures ([#3655](https://github.com/holon-run/holon/pull/3655)), and bounded UI-test waits with tiered CI jobs ([#3679](https://github.com/holon-run/holon/pull/3679)), and offline status with in-place recovery stabilized across the SSE stream lifecycle ([#3688](https://github.com/holon-run/holon/pull/3688)).

          ### Models, providers, and media
          - Visual tools support per-call media model selection with bounded image delivery ([#3664](https://github.com/holon-run/holon/pull/3664)).
          - The reviewed model catalog is refreshed with endpoint-specific capabilities ([#3593](https://github.com/holon-run/holon/pull/3593), [#3617](https://github.com/holon-run/holon/pull/3617), [#3683](https://github.com/holon-run/holon/pull/3683)) plus Xiaomi, Go, and MiniMax metadata ([#3686](https://github.com/holon-run/holon/pull/3686)), and inference credentials are omitted from public catalogs ([#3619](https://github.com/holon-run/holon/pull/3619)).
          - Provider HTTP phase timeouts separate from long-stream budgets ([#3626](https://github.com/holon-run/holon/pull/3626)), and media default guidance is stable in system prompts ([#3666](https://github.com/holon-run/holon/pull/3666)).

          ### Website and docs
          - The website adopts AI-assistant positioning copy ([#3633](https://github.com/holon-run/holon/pull/3633)), regenerated and polished bilingual lite papers ([a182d7d7](https://github.com/holon-run/holon/commit/a182d7d70677967ad7742f7d8d8f1de9f2852749), [1d8250dc](https://github.com/holon-run/holon/commit/1d8250dc1948e88b78a29cfd4fe2ca7319fc0a7e), [33e39dc3](https://github.com/holon-run/holon/commit/33e39dc3c799b41f7dd57e2b648265c76863b5cb)), a raised install entry ([ee283cfd](https://github.com/holon-run/holon/commit/ee283cfd5990a570700c341d2f36c045d55e9e27)), mobile beta links ([#3639](https://github.com/holon-run/holon/pull/3639)), and iOS App Store screenshots ([f1a64bee](https://github.com/holon-run/holon/commit/f1a64beebe8b6d611193b0c2dd39834df39fb9b9), [95e7896c](https://github.com/holon-run/holon/commit/95e7896c876919fff9abbc58e3ee917dd4fa7cc0)).
          - A private vulnerability reporting policy is defined ([c7401c2d](https://github.com/holon-run/holon/commit/c7401c2d484bea09c9adf342244701c25fd17af6)), and mdorigin upgrades to 0.7.0 ([040e0696](https://github.com/holon-run/holon/commit/040e069634adb177134462e0b4ac0ce1dcda3ff1)).

          ### Tests and tooling
          - Concurrent test waits and post-stop entry rebuild races are fixed ([#3680](https://github.com/holon-run/holon/pull/3680)), Update-to-Complete legal completions and invalidation fences are characterized ([#3645](https://github.com/holon-run/holon/pull/3645)), and macOS verify scripts fail explicitly under stock bash ([#3663](https://github.com/holon-run/holon/pull/3663)), and docker e2e waits for the default bootstrap turn to settle before the first prompt ([#3689](https://github.com/holon-run/holon/pull/3689), fixing the release-blocking regression tracked by [#3687](https://github.com/holon-run/holon/issues/3687)).

          ## Pull requests

          - [#3689](https://github.com/holon-run/holon/pull/3689) fix: docker e2e waits for the default bootstrap turn before the first prompt
          - [#3688](https://github.com/holon-run/holon/pull/3688) fix: stabilize iOS offline status and in-place recovery across SSE stream lifecycle
          - [#3686](https://github.com/holon-run/holon/pull/3686) fix: 刷新模型目录并补齐小米、Go 与 MiniMax 元数据
          - [#3685](https://github.com/holon-run/holon/pull/3685) feat: default bootstrap initialization turn for agents created without initial_message
          - [#3684](https://github.com/holon-run/holon/pull/3684) feat: make subagent conversation entry visible with in-app navigation
          - [#3683](https://github.com/holon-run/holon/pull/3683) fix: update reviewed provider catalog and subscription routes
          - [#3682](https://github.com/holon-run/holon/pull/3682) fix: prevent cross-tab auth rejection reload loops
          - [#3681](https://github.com/holon-run/holon/pull/3681) fix: 识别监督调用的同轮任务结果消费
          - [#3680](https://github.com/holon-run/holon/pull/3680) fix: 修复并发测试等待与停止后入口重建竞态
          - [#3679](https://github.com/holon-run/holon/pull/3679) fix(ios): UI 测试有界等待修复与 CI iOS job 分层
          - [#3677](https://github.com/holon-run/holon/pull/3677) fix: background agent bootstrap and crash-safe template materialization (#3672)
          - [#3676](https://github.com/holon-run/holon/pull/3676) fix: 完善首次配置引导与 Holon Bot 创建流程
          - [#3675](https://github.com/holon-run/holon/pull/3675) fix: pin Node runtimes to October security releases
          - [#3674](https://github.com/holon-run/holon/pull/3674) fix(runtime): 将最终报告改为软收尾提示

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          # release-e2e.yml dispatches run against a harness_ref checkout (#4357),
          # so run head_sha is the harness branch SHA, not the release candidate
          # SHA. The attestation artifact name already embeds the candidate SHA and
          # tag, so discover it by exact artifact name, then bind it back to a
          # successful workflow_dispatch run of release-e2e.yml.
          artifacts_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/artifacts?name=${artifact_name}&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg name "${artifact_name}" \
            '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id != null) | .workflow_run.id' <<<"${artifacts_json}"); do
            run_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}")"
            if jq -e \
              '(.path == ".github/workflows/release-e2e.yml")
               and (.event == "workflow_dispatch")
               and (.conclusion == "success")' <<<"${run_json}" >/dev/null; then
              artifact_url="$(jq -r --arg name "${artifact_name}" --argjson run_id "${run_id}" \
                '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            unexpired_count="$(jq -r --arg name "${artifact_name}" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"${artifacts_json}")"
            if [ "${unexpired_count}" -gt 0 ]; then
              echo "Release E2E attestation artifact ${artifact_name} exists for ${sha}, but none of its owning runs passed validation (expected workflow=.github/workflows/release-e2e.yml, event=workflow_dispatch, conclusion=success)." >&2
            else
              echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            fi
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release widens the tool and provider surface around a hardened runtime
          core. WebFetch gains shared remote routing, provider discovery, and source
          receipts, with Tavily Extract, Exa Contents, and Firecrawl Scrape v2 available
          as remote extraction providers; web search defaults to a keyless fallback chain
          and adds explicit OpenAI and OpenAI Codex native server-side search providers;
          GitHub Copilot Responses routing returns with an approved OAuth app; and agent
          model sets preserve, pass through, and clear reasoning-effort and service-tier
          overrides while the model catalog records the Qianfan and Moonshot K2
          retirement boundaries. Runtime correctness work unblocks the v94
          episode-continuity migration on real long-chain data by truncating super-deep
          references instead of crash-looping startup, merges same-batch-restored wait
          notifications out of the restart path, gives agent message chains a shared
          delivery quota, caps Enqueue self-continuation authority, preserves structured
          rejection reasons, and keeps upgrade history readable. Timers gain native
          pause and resume, and the serve command honors PORT as its listen default.
          Internally, independent HTTP code consolidates into holon-server, standalone
          daemon lifecycle moves into holon-daemon, Agent registry persistence lands in
          holon-storage, and the Holon runtime crate is extracted.

          ## Summary

          ### WebFetch remote extraction and web search

          WebFetch can now route fetches through shared remote provider selection with
          provider discovery and source receipts
          ([#4356](https://github.com/holon-run/holon/pull/4356)), adding Tavily
          Extract ([#4359](https://github.com/holon-run/holon/pull/4359)), Exa Contents
          ([#4361](https://github.com/holon-run/holon/pull/4361)), and Firecrawl Scrape
          v2 ([#4362](https://github.com/holon-run/holon/pull/4362)) as remote
          extraction providers. Web search defaults to a keyless fallback chain
          ([#4343](https://github.com/holon-run/holon/pull/4343)) and gains explicit
          OpenAI and OpenAI Codex native server-side search providers bound through
          model routes ([#4334](https://github.com/holon-run/holon/pull/4334)).
          The keyless DuckDuckGo Lite parser now distinguishes anti-bot challenges
          and filters duplicate result links
          ([#4392](https://github.com/holon-run/holon/pull/4392)), XSearch routes
          pure-keyword queries into retrieval instead of chat
          ([#4395](https://github.com/holon-run/holon/pull/4395)), and Google
          Programmable Search joins the selectable providers
          ([#4394](https://github.com/holon-run/holon/pull/4394)).

          ### Provider routing and the model catalog

          GitHub Copilot Responses API routing is restored with the approved OAuth app
          ([#4344](https://github.com/holon-run/holon/pull/4344)). Agent model sets now
          preserve, pass through, and clear reasoning-effort and service-tier values
          ([#4364](https://github.com/holon-run/holon/pull/4364)), and the model catalog
          refreshes with the Qianfan and Moonshot K2 retirement boundaries recorded
          ([#4366](https://github.com/holon-run/holon/pull/4366)).

          ### Runtime correctness and safety

          The v94 episode-continuity migration no longer fails on real long-chain data:
          super-deep continuity references are truncated instead of leaving upgraded
          nodes crash-looping at startup
          ([#4387](https://github.com/holon-run/holon/pull/4387)). Same-batch-restored
          agent message wait notifications are merged so restart recovery no longer
          floods the conversation view
          ([#4386](https://github.com/holon-run/holon/pull/4386)). Startup
          recovery now accepts attempts presettled by offline scheduler
          recovery, so upgrading from v0.60.0 past an interrupted schema 47
          migration no longer exits fatally at startup
          ([#4399](https://github.com/holon-run/holon/pull/4399)). Agent message chains
          carry a shared delivery quota to stop mutually-referencing agents from
          triggering unbounded wake storms
          ([#4338](https://github.com/holon-run/holon/pull/4338)), Enqueue
          self-continuation no longer inherits operator-grade authority from the calling
          turn ([#4335](https://github.com/holon-run/holon/pull/4335)),
          lifecycle-protection rejections keep structured reasons
          ([#4339](https://github.com/holon-run/holon/pull/4339)), and upgrade history
          reads stay readable without asserting settled Results
          ([#4341](https://github.com/holon-run/holon/pull/4341)).

          ### Timers, serving defaults, and clients

          Timers support native pause and resume with persisted state, HTTP, and UI
          surfaces ([#4340](https://github.com/holon-run/holon/pull/4340)). The serve
          command honors the PORT environment variable as its listen default
          ([#4375](https://github.com/holon-run/holon/pull/4375)). The web GUI tour
          fixture carries its incarnation so agent detail pages load
          ([#4382](https://github.com/holon-run/holon/pull/4382)), and store and GUI
          screenshots are refreshed for the current UI
          ([#4374](https://github.com/holon-run/holon/pull/4374),
          [#4378](https://github.com/holon-run/holon/pull/4378),
          [#4380](https://github.com/holon-run/holon/pull/4380)).

          ### Runtime structure refactors

          Independent HTTP code consolidates into holon-server
          ([#4336](https://github.com/holon-run/holon/pull/4336)), standalone daemon
          lifecycle extraction lands in holon-daemon
          ([#4342](https://github.com/holon-run/holon/pull/4342)), Agent registry
          persistence moves into holon-storage
          ([#4345](https://github.com/holon-run/holon/pull/4345)), and the Holon
          runtime crate is extracted
          ([#4371](https://github.com/holon-run/holon/pull/4371)).

          ### Tests, CI, and documentation

          Release E2E gates bind tighter to the candidate: identity gates follow the
          harness checkout SHA
          ([#4357](https://github.com/holon-run/holon/pull/4357)), the docker smoke
          checks an explicit expected version
          ([#4358](https://github.com/holon-run/holon/pull/4358)), report_before and
          apply error allowances cover only candidate-added tables
          ([#4360](https://github.com/holon-run/holon/pull/4360),
          [#4365](https://github.com/holon-run/holon/pull/4365)), and scheduler
          acceptance pins its git_sha to the candidate
          ([#4368](https://github.com/holon-run/holon/pull/4368)). Flaky tests are
          retired ([#4370](https://github.com/holon-run/holon/pull/4370),
          [#4377](https://github.com/holon-run/holon/pull/4377)), application and
          runtime test selection and compilation are split
          ([#4379](https://github.com/holon-run/holon/pull/4379),
          [#4381](https://github.com/holon-run/holon/pull/4381)), and documentation is
          refreshed ([#4372](https://github.com/holon-run/holon/pull/4372) plus direct
          positioning-copy commits below).

          ## Pull requests

          - [#4399](https://github.com/holon-run/holon/pull/4399) fix(runtime): accept offline presettled attempts in startup recovery
          - [#4395](https://github.com/holon-run/holon/pull/4395) fix(runtime): 引导 x_search 纯关键词 query 触发检索
          - [#4394](https://github.com/holon-run/holon/pull/4394) feat(web-search): add Google Programmable Search provider
          - [#4393](https://github.com/holon-run/holon/pull/4393) ci: run application unit tests together
          - [#4392](https://github.com/holon-run/holon/pull/4392) fix: 区分 DuckDuckGo Lite 反爬挑战并过滤重复搜索结果
          - [#4388](https://github.com/holon-run/holon/pull/4388) ci: deduplicate runtime and snapshot validation
          - [#4387](https://github.com/holon-run/holon/pull/4387) fix(runtime): 截断 v94 continuity 的超深引用
          - [#4386](https://github.com/holon-run/holon/pull/4386) fix(runtime): 合并同批恢复的 agent message wait 通知
          - [#4382](https://github.com/holon-run/holon/pull/4382) fix(web-gui): 为 tour fixture 补齐 incarnation
          - [#4381](https://github.com/holon-run/holon/pull/4381) ci: split runtime database transaction test compilation
          - [#4380](https://github.com/holon-run/holon/pull/4380) docs: refresh iOS App Store screenshots for current main UI
          - [#4379](https://github.com/holon-run/holon/pull/4379) ci: select application and runtime tests independently
          - [#4378](https://github.com/holon-run/holon/pull/4378) docs: refresh lite paper GUI screenshots for the redesigned workbench
          - [#4377](https://github.com/holon-run/holon/pull/4377) test: cover serve preflight stale run-file self-healing
          - [#4375](https://github.com/holon-run/holon/pull/4375) feat: honor PORT env as serve listen default
          - [#4374](https://github.com/holon-run/holon/pull/4374) docs(android): refresh en-US store screenshots for the current UI
          - [#4372](https://github.com/holon-run/holon/pull/4372) docs: update documentation for v0.60.0 release
          - [#4371](https://github.com/holon-run/holon/pull/4371) refactor: extract the Holon runtime crate
          - [#4370](https://github.com/holon-run/holon/pull/4370) test: 消除 reader pool 诊断生命周期测试的偶发失败
          - [#4368](https://github.com/holon-run/holon/pull/4368) fix(ci): bind release-e2e scheduler acceptance git_sha to the candidate
          - [#4366](https://github.com/holon-run/holon/pull/4366) chore: 登记千帆与 Moonshot K2 退役边界并刷新模型目录
          - [#4365](https://github.com/holon-run/holon/pull/4365) fix(ci): allow release-e2e apply errors only for candidate-added tables
          - [#4364](https://github.com/holon-run/holon/pull/4364) fix: agent model set 保留/透传/清除 reasoning-effort 与 service-tier
          - [#4362](https://github.com/holon-run/holon/pull/4362) feat: WebFetch 接入 Firecrawl Scrape v2
          - [#4361](https://github.com/holon-run/holon/pull/4361) feat: WebFetch 接入 Exa Contents
          - [#4360](https://github.com/holon-run/holon/pull/4360) fix(ci): allow release-e2e report_before errors only for candidate-added tables
          - [#4359](https://github.com/holon-run/holon/pull/4359) feat: WebFetch 接入 Tavily Extract 远程提取
          - [#4358](https://github.com/holon-run/holon/pull/4358) fix(ci): pass explicit expected version to release-e2e docker smoke
          - [#4357](https://github.com/holon-run/holon/pull/4357) fix(ci): align release E2E identity gates with harness checkout SHA
          - [#4356](https://github.com/holon-run/holon/pull/4356) feat: WebFetch 共享远程选路、提供方发现与来源回执
          - [#4345](https://github.com/holon-run/holon/pull/4345) refactor: move Agent registry persistence into holon-storage
          - [#4344](https://github.com/holon-run/holon/pull/4344) feat: restore GitHub Copilot Responses API routing with approved OAuth app
          - [#4343](https://github.com/holon-run/holon/pull/4343) feat: default web search to keyless fallback chain
          - [#4342](https://github.com/holon-run/holon/pull/4342) refactor: extract standalone daemon lifecycle into holon-daemon
          - [#4341](https://github.com/holon-run/holon/pull/4341) fix: require readable upgrade history without asserting settled Results

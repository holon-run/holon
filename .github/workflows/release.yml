name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish; must match the dispatch ref (daily beta train handoff).'
        required: false
        default: ''
      reason:
        description: 'Dispatch reason (recorded for the operator).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Validate dispatch handoff
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # The train dispatches this workflow on the tag ref, so the
          # checkout/GITHUB_REF_NAME/GITHUB_SHA identity comes from the tag.
          # Refuse a handoff whose tag input disagrees with that ref.
          if [ -n "$DISPATCH_TAG" ] && [ "$DISPATCH_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::dispatch tag '${DISPATCH_TAG}' does not match the dispatch ref '${GITHUB_REF_NAME}'; refusing to publish" >&2
            exit 1
          fi

      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          # release-e2e.yml dispatches run against a harness_ref checkout (#4357),
          # so run head_sha is the harness branch SHA, not the release candidate
          # SHA. The attestation artifact name already embeds the candidate SHA and
          # tag, so discover it by exact artifact name, then bind it back to a
          # successful workflow_dispatch run of release-e2e.yml.
          artifacts_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/artifacts?name=${artifact_name}&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg name "${artifact_name}" \
            '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id != null) | .workflow_run.id' <<<"${artifacts_json}"); do
            run_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}")"
            if jq -e \
              '(.path == ".github/workflows/release-e2e.yml")
               and (.event == "workflow_dispatch")
               and (.conclusion == "success")' <<<"${run_json}" >/dev/null; then
              artifact_url="$(jq -r --arg name "${artifact_name}" --argjson run_id "${run_id}" \
                '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            unexpired_count="$(jq -r --arg name "${artifact_name}" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"${artifacts_json}")"
            if [ "${unexpired_count}" -gt 0 ]; then
              echo "Release E2E attestation artifact ${artifact_name} exists for ${sha}, but none of its owning runs passed validation (expected workflow=.github/workflows/release-e2e.yml, event=workflow_dispatch, conclusion=success)." >&2
            else
              echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            fi
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          # Report the full release identity (including beta date suffixes)
          # in `holon --version`; stable tags match Cargo.toml exactly.
          HOLON_PKG_VERSION_OVERRIDE: ${{ github.ref_name }}
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    # Daily beta trains ship the CLI binaries only; signed desktop/mobile
    # apps and their appcast stay on the stable channel.
    if: ${{ !contains(github.ref_name, '-beta.') }}
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    if: ${{ !contains(github.ref_name, '-beta.') }}
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    # Beta trains skip the signed macOS/Android app jobs above; a skipped
    # `needs` job would normally skip this one too, so re-gate explicitly.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.e2e-gate.result == 'success' && (contains(github.ref_name, '-beta.') || (needs.macos-app.result == 'success' && needs.android-app.result == 'success')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Validate beta tag format
        if: ${{ contains(github.ref_name, '-beta.') }}
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          case "$tag_version" in
            "$crate_version"-beta.*) ;;
            *)
              echo "Beta tag $tag_version must be v${crate_version}-beta.<date> (Cargo.toml declares $crate_version)." >&2
              exit 1
              ;;
          esac

      - name: Prepare checksums and Homebrew formula
        env:
          IS_BETA: ${{ contains(github.ref_name, '-beta.') }}
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shopt -s nullglob
            files=(./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No release artifacts found to checksum." >&2
              exit 1
            fi
            shasum -a 256 "${files[@]}" | sort -k2 > checksums.txt
          )
          if [ "$IS_BETA" = "true" ]; then
            echo "Beta train: keep the Homebrew tap on the latest stable only."
          else
            bash scripts/generate-homebrew-formula.sh \
              "$GITHUB_REF_NAME" \
              dist-artifacts/checksums.txt \
              homebrew-tap/Formula/holon.rb
          fi

      - name: Upload Homebrew formula artifact
        if: ${{ !contains(github.ref_name, '-beta.') }}
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release lands the runtime-reliability milestone. The serialized shared writer is systematically unloaded: pure reads for prompt assembly, idle inputs, live input recovery, deferred-tool probes, and recent-tool qualification move off the writer queue or onto indexed, bounded paths; events pagination decodes by kind with bounded continuation; task re-preparation and live-input preparation skip work they do not need; and per-round provider tool-call and payload admission is bounded. Startup and recovery gain deterministic ordering with dispatch gated until recovery completes, safely rollback-able agent startup faults are isolated, and storage migrations converge legacy state forward (v113 pause records and WorkExecution fingerprints, the v115 Current alias fingerprint, retiring persisted needs_repair outcomes and the WorkItem NeedsRepair state). Cross-task shared system-prompt prefixes make provider prefix caches effective. The provider catalog adds GitHub Copilot OAuth login and per-provider request headers with refreshed endpoint capacities; clients unify agent status projection, avatars, and update delivery across web, iOS, and Android; and a dedicated reorganization moves roughly a hundred test suites into dedicated crate files while long-standing flakes get deterministic settling. Late in the release window, provider failure classification and operator-error evidence fidelity are hardened, over-budget inline images degrade to path references instead of failing the round, self-enqueue follow-ups keep their subsystem attribution in the model projection, read-only external-trigger diagnostic endpoints arrive, and the web roster goes live on the global hint stream. Final freeze additions keep the charged task-result recovery root replay ahead of older queued lineages, make cross-agent memory reads evidence-only (MemoryGet by message id plus a MemorySearch agent_ids scope), make WebSearch routing provider-addressable with a read-only provider listing, move the HTTP transport into a dedicated holon-server crate, derive agent-delivery authority as its own RuntimeInstruction instead of inheriting the calling turn, refresh the model catalog (Gemini 4 Neon in, retired MiniMax routes out), and let CI select Rust tests by changed-crate dependency impact.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Shared-writer contention and read-path performance
          - Idle-input pure reads leave the shared writer queue ([#4294](https://github.com/holon-run/holon/pull/4294)), and live input recovery loads execution protocol state once instead of re-scanning full history inside the writer ([#4288](https://github.com/holon-run/holon/pull/4288), addressing [#4269](https://github.com/holon-run/holon/issues/4269)).
          - Deferred-report probes are scoped to the tool_executions agent/turn index instead of scanning tool history inside the shared writer ([#4285](https://github.com/holon-run/holon/pull/4285), fixing [#4268](https://github.com/holon-run/holon/issues/4268)).
          - Events pagination decodes by kind with bounded continuation pages ([#4246](https://github.com/holon-run/holon/pull/4246), addressing [#4190](https://github.com/holon-run/holon/issues/4190)), and display-level event filtering becomes a client-side behavior ([#4239](https://github.com/holon-run/holon/pull/4239), addressing [#4231](https://github.com/holon-run/holon/issues/4231)).
          - Task re-preparation moves off the shared writer with incremental finalization ([#4228](https://github.com/holon-run/holon/pull/4228)), ordinary live inputs skip unnecessary task preparation ([#4247](https://github.com/holon-run/holon/pull/4247), addressing [#4043](https://github.com/holon-run/holon/issues/4043)), and prompt assembly gains a stable cross-task shared system-prompt prefix so provider prefix caches hit ([#4223](https://github.com/holon-run/holon/pull/4223), addressing [#4214](https://github.com/holon-run/holon/issues/4214)).
          - Per-round provider tool-call and payload admission is bounded ([#4205](https://github.com/holon-run/holon/pull/4205), fixing [#4192](https://github.com/holon-run/holon/issues/4192)).
          - State reads drop the sub-agent summary fan-out ([#4057](https://github.com/holon-run/holon/pull/4057)), per-agent message counts move into SQLite ([#4049](https://github.com/holon-run/holon/pull/4049)), recent-tools qualification becomes eligibility-key driven without linear history scans ([#4179](https://github.com/holon-run/holon/pull/4179), fixing [#4165](https://github.com/holon-run/holon/issues/4165)), and input closure preparation attributes slow reads by family and source ([#4221](https://github.com/holon-run/holon/pull/4221), fixing [#4191](https://github.com/holon-run/holon/issues/4191)).

          ### Startup, recovery, and migration correctness
          - Runtime dispatch is retained through daemon startup and deferred until startup recovery completes (commits [c6b26f33](https://github.com/holon-run/holon/commit/c6b26f33d04efb0d18d58cce38dd113ad80be90b) and [4f9bfc4d](https://github.com/holon-run/holon/commit/4f9bfc4df5a7cb2e6a265279fe62360def03b82d)), startup recovery history lookups are bounded ([#4113](https://github.com/holon-run/holon/pull/4113), addressing [#4070](https://github.com/holon-run/holon/issues/4070)), and stale Current reads are released with bounded recovery scans ([#4118](https://github.com/holon-run/holon/pull/4118)).
          - Safely rollback-able agent startup faults are isolated ([#4282](https://github.com/holon-run/holon/pull/4282), addressing [#4250](https://github.com/holon-run/holon/issues/4250)), and startup queue reentry resolves through canonical Turn attachment ([#3985](https://github.com/holon-run/holon/pull/3985)).
          - Storage migrations converge legacy state forward: v113 WorkExecution pause records and qualification fingerprints ([#4279](https://github.com/holon-run/holon/pull/4279), addressing [#4270](https://github.com/holon-run/holon/issues/4270)), the v115 Current alias fingerprint no longer writes a frozen digest ([#4277](https://github.com/holon-run/holon/pull/4277), fixing the [#4264](https://github.com/holon-run/holon/issues/4264) upgrade crash-loop), and persisted needs_repair outcomes are retired with converged reads ([#4258](https://github.com/holon-run/holon/pull/4258), fixing [#4254](https://github.com/holon-run/holon/issues/4254)); the WorkItem NeedsRepair execution state is retired with bounded readmission and deterministic multi-wait adjudication ([#4230](https://github.com/holon-run/holon/pull/4230), fixing [#4217](https://github.com/holon-run/holon/issues/4217)).

          ### Task lifecycle and scheduling correctness
          - Charged task-result recovery roots keep their replay ahead of older queued lineages, so an exhausted recovery root cannot be starved by newer interleaved entries ([#4330](https://github.com/holon-run/holon/pull/4330)).
          - Tool-result settlement interruption is attributed to shutdown instead of an unconfirmed settlement ([#4257](https://github.com/holon-run/holon/pull/4257)), and work-execution writes acknowledge timer cancellation ([#4164](https://github.com/holon-run/holon/pull/4164)).
          - Timer wakes matching multiple active waits deterministically select one instead of being quarantined and permanently retired ([#4173](https://github.com/holon-run/holon/pull/4173), fixing [#3914](https://github.com/holon-run/holon/issues/3914)).
          - Operator abort becomes a precise terminal cancellation for the exact input ([#4148](https://github.com/holon-run/holon/pull/4148)), and residual terminal pointers are admitted by the dispatch binding guard ([#4155](https://github.com/holon-run/holon/pull/4155), fixing [#4154](https://github.com/holon-run/holon/issues/4154)).
          - Continuation resume stays canonical when clearing a retained wait ([#4253](https://github.com/holon-run/holon/pull/4253)), pending reply attribution and non-model disposal are unified ([#4182](https://github.com/holon-run/holon/pull/4182)), task status settlement mismatches are classified ([#3987](https://github.com/holon-run/holon/pull/3987)), and task reader re-preparation is classified as deferred instead of a write failure ([#4245](https://github.com/holon-run/holon/pull/4245), addressing [#4232](https://github.com/holon-run/holon/issues/4232)).

          ### Provider catalog, models, and auth
          - The model catalog adds Gemini 4 Neon and retires the retired MiniMax routes ([#4332](https://github.com/holon-run/holon/pull/4332)).
          - Provider failure classification and error evidence harden: empty OpenAI responses classify as retryable provider failures ([#4302](https://github.com/holon-run/holon/pull/4302), fixing [#4295](https://github.com/holon-run/holon/issues/4295)), credential-scope denials explain the scope instead of tripping a local safety check ([#4303](https://github.com/holon-run/holon/pull/4303)), and provider operator errors keep typed code and budget evidence ([#4311](https://github.com/holon-run/holon/pull/4311), fixing [#4304](https://github.com/holon-run/holon/issues/4304)).
          - Over-budget required markdown images degrade to path references instead of failing the whole round ([#4314](https://github.com/holon-run/holon/pull/4314), fixing [#4305](https://github.com/holon-run/holon/issues/4305)).
          - GitHub Copilot OAuth login arrives as an optional provider ([#4208](https://github.com/holon-run/holon/pull/4208)) with a built-in default OAuth app for Copilot login ([#4238](https://github.com/holon-run/holon/pull/4238)), alongside per-provider request headers, trusted Go sessions, and the Messages standard entry ([#4116](https://github.com/holon-run/holon/pull/4116), addressing [#4072](https://github.com/holon-run/holon/issues/4072)).
          - Provider dispatch is admitted atomically after request construction ([#4200](https://github.com/holon-run/holon/pull/4200)), settled exhausted recovery epochs are parked ([#4210](https://github.com/holon-run/holon/pull/4210)), and Gemini content refusals fail closed ([#4054](https://github.com/holon-run/holon/pull/4054), addressing [#3896](https://github.com/holon-run/holon/issues/3896)).
          - The daily model catalog refreshes endpoint capacities, retires exactly-retired routes, and adds new model IDs across multiple updates ([#4242](https://github.com/holon-run/holon/pull/4242), [#4211](https://github.com/holon-run/holon/pull/4211), [#4085](https://github.com/holon-run/holon/pull/4085), [#4002](https://github.com/holon-run/holon/pull/4002), [#3971](https://github.com/holon-run/holon/pull/3971), [#3945](https://github.com/holon-run/holon/pull/3945), [#3935](https://github.com/holon-run/holon/pull/3935), [#3926](https://github.com/holon-run/holon/pull/3926)).
          - OIDC accepts http loopback redirect URIs ([#3969](https://github.com/holon-run/holon/pull/3969), fixing [#3871](https://github.com/holon-run/holon/issues/3871)) and classifies client-caused callback failures as 4xx ([#3970](https://github.com/holon-run/holon/pull/3970), fixing [#3882](https://github.com/holon-run/holon/issues/3882)); agent state reads report pending reconciliation ([#4012](https://github.com/holon-run/holon/pull/4012)).
          - Anthropic stream consumption ends on message_stop ([#3967](https://github.com/holon-run/holon/pull/3967)), and Token Plan DeepSeek 1017 routes get cache-friendly defaults ([#3966](https://github.com/holon-run/holon/pull/3966), fixing [#3925](https://github.com/holon-run/holon/issues/3925)).

          ### Clients: web, iOS, and Android
          - The web client subscribes to the global roster hint stream so roster status and unread counts refresh in real time ([#4312](https://github.com/holon-run/holon/pull/4312), fixing [#4310](https://github.com/holon-run/holon/issues/4310)).
          - Agent status projection and avatar presentation unify across web, iOS, and Android ([#3974](https://github.com/holon-run/holon/pull/3974), [#3952](https://github.com/holon-run/holon/pull/3952), [#3968](https://github.com/holon-run/holon/pull/3968), [#3958](https://github.com/holon-run/holon/pull/3958), [#3957](https://github.com/holon-run/holon/pull/3957)), with authenticated avatar caching on Android ([#4237](https://github.com/holon-run/holon/pull/4237)) and a stable avatar cache plus conversation layout on iOS ([#4263](https://github.com/holon-run/holon/pull/4263)).
          - The web composer accepts pasted files as attachments ([#4181](https://github.com/holon-run/holon/pull/4181)), the file browser opens in a floating window ([#4170](https://github.com/holon-run/holon/pull/4170)) and restores selections while reads are pending ([#4176](https://github.com/holon-run/holon/pull/4176)), bare host file paths autolink in markdown prose ([#4167](https://github.com/holon-run/holon/pull/4167)), and Android wraps long lines inside fenced code blocks ([#4292](https://github.com/holon-run/holon/pull/4292)).

          ### Runtime APIs, tools, and workspace
          - Cross-agent memory reads arrive as evidence-only: MemoryGet reads another agent's messages by id with audit marks ([#4321](https://github.com/holon-run/holon/pull/4321), fixing [#4318](https://github.com/holon-run/holon/issues/4318)), and MemorySearch accepts an optional agent_ids scope whose hits are marked as cross-agent evidence ([#4331](https://github.com/holon-run/holon/pull/4331), fixing [#4319](https://github.com/holon-run/holon/issues/4319)).
          - WebSearch routing becomes provider-addressable: a single provider field selects auto, aggregate, or a specific provider id ([#4328](https://github.com/holon-run/holon/pull/4328), fixing [#4322](https://github.com/holon-run/holon/issues/4322)), and a read-only ListWebSearchProviders endpoint lists the addressable providers ([#4333](https://github.com/holon-run/holon/pull/4333), fixing [#4323](https://github.com/holon-run/holon/issues/4323)).
          - The HTTP transport moves into a dedicated holon-server crate ([#4327](https://github.com/holon-run/holon/pull/4327)), and agent deliveries derive their own RuntimeInstruction authority instead of inheriting the calling turn's authority ([#4329](https://github.com/holon-run/holon/pull/4329), fixing [#4320](https://github.com/holon-run/holon/issues/4320)).
          - Read-only external trigger diagnostic endpoints list registered triggers and let operators read existing webhook tokens ([#4297](https://github.com/holon-run/holon/pull/4297), fixing [#4233](https://github.com/holon-run/holon/issues/4233)); self-enqueue follow-ups keep their subsystem in the model projection ([#4313](https://github.com/holon-run/holon/pull/4313), fixing [#4308](https://github.com/holon-run/holon/issues/4308)).
          - A dedicated GET /api/agents/{agent_id}/model read endpoint avoids the full status projection ([#4136](https://github.com/holon-run/holon/pull/4136), fixing [#4124](https://github.com/holon-run/holon/issues/4124)); versioned State read-only observation returns during commits ([#4171](https://github.com/holon-run/holon/pull/4171), addressing [#4166](https://github.com/holon-run/holon/issues/4166)); shared runtime database reader limits become configurable with bounded diagnostics ([#4001](https://github.com/holon-run/holon/pull/4001), [#4224](https://github.com/holon-run/holon/pull/4224)).
          - ListSubagents becomes a lightweight direct-supervision query ([#4256](https://github.com/holon-run/holon/pull/4256)), ApplyPatch accepts bare @@ hunk headers ([#4276](https://github.com/holon-run/holon/pull/4276), fixing [#3041](https://github.com/holon-run/holon/issues/3041)), and CreateWorktree accepts an explicit absolute path ([#4196](https://github.com/holon-run/holon/pull/4196), fixing [#4178](https://github.com/holon-run/holon/issues/4178)).

          ### Agent templates
          - New role templates arrive: research-steward ([#4026](https://github.com/holon-run/holon/pull/4026)), support-ops-steward ([#4099](https://github.com/holon-run/holon/pull/4099)), and design-steward with a pinned Mermaid docs skill ([#3937](https://github.com/holon-run/holon/pull/3937)).

          ### Test organization and CI stability
          - CI selects Rust tests by changed crate and reverse dependencies ([#4317](https://github.com/holon-run/holon/pull/4317)) and keeps root tests and RFC edits within dependency selection ([#4324](https://github.com/holon-run/holon/pull/4324)).
          - The Release E2E fairness owner gate stays active when a straggler barrier releases late ([#4315](https://github.com/holon-run/holon/pull/4315)).
          - A dedicated series moves unit and contract tests into their owning crates and dedicated files (for example [#4306](https://github.com/holon-run/holon/pull/4306), [#4301](https://github.com/holon-run/holon/pull/4301), [#4299](https://github.com/holon-run/holon/pull/4299), [#4298](https://github.com/holon-run/holon/pull/4298), [#4296](https://github.com/holon-run/holon/pull/4296), [#4293](https://github.com/holon-run/holon/pull/4293), [#4291](https://github.com/holon-run/holon/pull/4291), [#4289](https://github.com/holon-run/holon/pull/4289), [#4287](https://github.com/holon-run/holon/pull/4287), [#4283](https://github.com/holon-run/holon/pull/4283), [#4278](https://github.com/holon-run/holon/pull/4278), [#4267](https://github.com/holon-run/holon/pull/4267), [#4261](https://github.com/holon-run/holon/pull/4261), [#4259](https://github.com/holon-run/holon/pull/4259)).
          - Main push CI converges to a build-only fallback with tests on PRs and scheduled or manual checks ([#4255](https://github.com/holon-run/holon/pull/4255)); Apple platform checks move to daily and manual full runs ([#4204](https://github.com/holon-run/holon/pull/4204)); runtime libtest code generation splits ([#4129](https://github.com/holon-run/holon/pull/4129)); transient infra flakes get bounded retries ([#4108](https://github.com/holon-run/holon/pull/4108), fixing [#4098](https://github.com/holon-run/holon/issues/4098); [#4066](https://github.com/holon-run/holon/pull/4066)).
          - Long-standing flakes get deterministic settling: bounded blocked-recheck waits ([#4193](https://github.com/holon-run/holon/pull/4193), fixing [#4185](https://github.com/holon-run/holon/issues/4185)), reply linkage settling before assertions ([#4130](https://github.com/holon-run/holon/pull/4130), fixing [#4121](https://github.com/holon-run/holon/issues/4121)), wt204 completion waiting ([#4132](https://github.com/holon-run/holon/pull/4132), fixing [#4122](https://github.com/holon-run/holon/issues/4122)), deterministic reaping assertions ([#3954](https://github.com/holon-run/holon/pull/3954), fixing [#3920](https://github.com/holon-run/holon/issues/3920)), CLI model status retries ([#4140](https://github.com/holon-run/holon/pull/4140), fixing [#4137](https://github.com/holon-run/holon/issues/4137)), tolerant state reads with weak recovery baselines ([#4063](https://github.com/holon-run/holon/pull/4063), fixing [#4061](https://github.com/holon-run/holon/issues/4061)), bounded observer publication availability checks ([#4003](https://github.com/holon-run/holon/pull/4003), fixing [#3986](https://github.com/holon-run/holon/issues/3986)), and run_once settle treating missing task records as settled ([#3956](https://github.com/holon-run/holon/pull/3956), fixing [#3936](https://github.com/holon-run/holon/issues/3936)).

          ### Documentation
          - A bilingual architecture comparison positions the dual-layer model, a verify-lifecycle guide reproduces runtime proofs end to end, and the zh-CN website gains guide updates (commits [d95a185b7](https://github.com/holon-run/holon/commit/d95a185b72da7c53e1174a462f4dea158e3915a9), [a14b4d527](https://github.com/holon-run/holon/commit/a14b4d527d0eeedda1b5fe0e6b85ae7aed85a58d), [3c59d9a5e](https://github.com/holon-run/holon/commit/3c59d9a5ebe4978e9548e34736490ff3dd9fa24b), [fd31c4c1e](https://github.com/holon-run/holon/commit/fd31c4c1ef02650d8f6a1bbf47c4e40dafbff066)).
          - Bilingual guides land for Agent Inbox async events, self-hosted GlitchTip error alerts, self-hosted SearXNG web search, changedetection.io change-detection webhooks, and Casdoor OIDC single sign-on, plus rewrites of the agent memory, model configuration, delegation, workspace, scheduling, and conversation-first workflow guides, the local-model agent benchmark blog series, and a skill-bloat and role-based isolation blog and guide (direct commits).


name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release concentrates on runtime efficiency and lifecycle correctness: the deletion coordinator bounds legacy-residue rescans and decouples them from maintenance rounds, holon daemon status no longer opens the runtime database without a bound surface, agent message wait tasks admit a terminal first writer, and the same AGENTS.md is no longer injected twice across agent and workspace scopes. The provider catalog stays current: Volcanoengine M3 plan routes are retired and OpenRouter's exact effort values are preserved, with the model catalog refreshed alongside. The web GUI upgrades truncated operator-message previews to full text on copy, iOS fixes UI readiness, short-term ticket handling, and font-size fixture timing, and test stability covers status probes during the daemon restart window, per-task interruption events, and the runtime DB fd-metadata drop assertion tolerating benign fd-number reuse. A meeting coordination steward agent template arrives, and documentation gains a self-hosted Keycloak OIDC single sign-on guide, the v0.57.0 release documentation, and a team blog refreshed with 131-day metrics and dual-panel SVGs.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Runtime efficiency and lifecycle invariants
          - The deletion coordinator bounds legacy-residue rescans and decouples maintenance rounds ([#3890](https://github.com/holon-run/holon/pull/3890), fixing [#3884](https://github.com/holon-run/holon/issues/3884)), ending idle full-core burn from 1ms shared sweep resets.
          - holon daemon status no longer scans the runtime DB without a bound surface ([#3875](https://github.com/holon-run/holon/pull/3875), fixing [#3848](https://github.com/holon-run/holon/issues/3848)), so it no longer hangs over 20 seconds under lock contention while the control plane is healthy.
          - Agent message wait tasks admit a terminal first writer ([#3892](https://github.com/holon-run/holon/pull/3892), fixing [#3869](https://github.com/holon-run/holon/issues/3869)), closing the reply-before-invoke race that hit a conflicting task transition (completed -> queued).
          - The same AGENTS.md is no longer injected twice across agent and workspace scopes ([#3893](https://github.com/holon-run/holon/pull/3893)).

          ### Provider catalog
          - Volcanoengine M3 plan routes are retired with a model catalog refresh ([#3899](https://github.com/holon-run/holon/pull/3899)), and OpenRouter's exact effort values are preserved with another catalog refresh ([#3878](https://github.com/holon-run/holon/pull/3878)).

          ### Web GUI
          - Copying an operator message upgrades a truncated preview to the full text before copying ([#3894](https://github.com/holon-run/holon/pull/3894)).

          ### iOS stability
          - The iOS app fixes UI readiness, short-term ticket handling, and font-size fixture timing ([#3901](https://github.com/holon-run/holon/pull/3901), fixing [#3861](https://github.com/holon-run/holon/issues/3861)).

          ### Test stability
          - Status probes retry transport errors with bounded backoff inside the daemon restart window ([#3902](https://github.com/holon-run/holon/pull/3902), fixing [#3880](https://github.com/holon-run/holon/issues/3880)), and the task-restart test waits for each restarted task's own interruption event ([#3891](https://github.com/holon-run/holon/pull/3891), fixing [#3870](https://github.com/holon-run/holon/issues/3870)).
          - The runtime DB fd-metadata drop test only fails on a real same-WAL-path handle leak, so benign Linux fd-number reuse no longer triggers a false failure ([#3904](https://github.com/holon-run/holon/pull/3904), fixing [#3895](https://github.com/holon-run/holon/issues/3895)).

          ### Agent templates
          - A meeting coordination steward agent template arrives ([#3883](https://github.com/holon-run/holon/pull/3883)).

          ### Documentation
          - The v0.57.0 release documentation is folded in ([#3877](https://github.com/holon-run/holon/pull/3877)), and a self-hosted Keycloak OIDC single sign-on guide lands in zh-CN and en (commit [b8120793](https://github.com/holon-run/holon/commit/b8120793dde834ed274a2b170fdc2932f3d46188)).
          - The team blog post on running agents natively in a small team gains 131-day metrics, dual-panel SVGs, and team voice (commit [6860656f](https://github.com/holon-run/holon/commit/6860656f17b659ae14ba29192916bd7d36953f62)), and links to the shared team guide with IdP walkthrough links (commit [c4a1e4c0](https://github.com/holon-run/holon/commit/c4a1e4c0a6af6ae8ce4b278462be6e3c25b128fc)).

          ## Pull requests

          - [#3904](https://github.com/holon-run/holon/pull/3904) test: fd 号复用窗口内 fd metadata drop 断言仅对同 wal 路径泄漏判失败
          - [#3901](https://github.com/holon-run/holon/pull/3901) fix(ios): 修复 UI 就绪、短期票据与字号 fixture 时序
          - [#3902](https://github.com/holon-run/holon/pull/3902) test: 对 daemon restart 窗口内的 status 探测 transport 错误有界重试
          - [#3899](https://github.com/holon-run/holon/pull/3899) fix: 退役火山 M3 套餐路由并更新模型目录（11月3日）
          - [#3894](https://github.com/holon-run/holon/pull/3894) feat(web-gui): copy operator messages with full-text upgrade for truncated previews
          - [#3893](https://github.com/holon-run/holon/pull/3893) fix: 避免同一 AGENTS.md 跨 agent／workspace 重复注入
          - [#3892](https://github.com/holon-run/holon/pull/3892) fix: accept terminal first writer when admitting agent message wait task
          - [#3891](https://github.com/holon-run/holon/pull/3891) test: wait for each restarted task's own interruption event (fixes #3870 flaky)
          - [#3890](https://github.com/holon-run/holon/pull/3890) fix: 限制删除残留续扫并解耦维护轮次
          - [#3883](https://github.com/holon-run/holon/pull/3883) feat: 新增会议协调管家模板
          - [#3878](https://github.com/holon-run/holon/pull/3878) fix: 保留 OpenRouter 精确 effort 并刷新模型目录
          - [#3877](https://github.com/holon-run/holon/pull/3877) docs: update documentation for v0.57.0 release
          - [#3875](https://github.com/holon-run/holon/pull/3875) fix: daemon status no longer scans runtime DB without a bound surface

          ### Direct commits

          - [6860656f](https://github.com/holon-run/holon/commit/6860656f17b659ae14ba29192916bd7d36953f62) docs(blog): update small-team agent native post with 131-day metrics, dual-panel SVGs, and team voice
          - [c4a1e4c0](https://github.com/holon-run/holon/commit/c4a1e4c0a6af6ae8ce4b278462be6e3c25b128fc) docs: link team blog to shared team guide and add IdP walkthrough links
          - [b8120793](https://github.com/holon-run/holon/commit/b8120793dde834ed274a2b170fdc2932f3d46188) docs: add self-hosted Keycloak OIDC single sign-on guide in zh-CN and en

          ## Issues

          - [#3884](https://github.com/holon-run/holon/issues/3884) perf(daemon): 删除协调器 legacy residue 扫描以 1ms 重置共享 sweep，空闲态持续整核燃烧并放大全部协调器职责 — fixed by [#3890](https://github.com/holon-run/holon/pull/3890)
          - [#3880](https://github.com/holon-run/holon/issues/3880) Flaky: payment_required_chain_parks_within_budget_and_restart_preserves_deadline hits transport error on /api/agents/main/status during daemon restart — fixed by [#3902](https://github.com/holon-run/holon/pull/3902)
          - [#3870](https://github.com/holon-run/holon/issues/3870) Flaky: task_restart_interrupts_inflight_task_once sees Running after task_interrupted_on_restart audit event — fixed by [#3891](https://github.com/holon-run/holon/pull/3891)
          - [#3869](https://github.com/holon-run/holon/issues/3869) Flaky: agent_message_wait_for_existing_agent reply-before-invoke race hits conflicting task transition (completed -> queued) — fixed by [#3892](https://github.com/holon-run/holon/pull/3892)
          - [#3861](https://github.com/holon-run/holon/issues/3861) Flaky: iOS testRuntimeBrowserWorkflow 的 consent→Agent home 断言首次失败、重试通过 — fixed by [#3901](https://github.com/holon-run/holon/pull/3901)
          - [#3848](https://github.com/holon-run/holon/issues/3848) bug(cli): holon daemon status 同步打开本地 runtime DB 并汇总历史失败，无整体时限，锁竞争下可挂起超过 20 秒（控制面健康时同样发生）— fixed by [#3875](https://github.com/holon-run/holon/pull/3875)

          ## Install

          Android:

          Download [\`holon-android-${GITHUB_REF_NAME}.apk\`](https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-android-${GITHUB_REF_NAME}.apk) on your device and allow installation from the download source. Future official APKs use the same signing identity and upgrade in place. Existing debug-signed installations require a one-time reinstall; uninstalling removes their local sessions, drafts, and outbox.

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/*.apk
            dist-artifacts/*.aab
            dist-artifacts/*android*.json
            dist-artifacts/*android*.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version matches tag
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/test-release-crate-publish-order.sh
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          publish_if_needed() {
            crate="$1"
            version="$(awk -F '"' '/^version = / { print $2; exit }' "crates/${crate}/Cargo.toml")"
            if curl -fsS -A "holon-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            echo "Publishing ${crate} ${version}..."
            cargo publish --locked --manifest-path "crates/${crate}/Cargo.toml"
            sleep 15
          }
          publish_if_needed holon-model-client
          publish_if_needed decision-core
          publish_if_needed decision-jev
          publish_if_needed decision-clef
          publish_if_needed decision-openai
          publish_if_needed decision-openai-decisions
          publish_if_needed decision-local-onnx
          cargo publish --locked

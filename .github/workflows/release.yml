name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release hardens the task-result settlement chain across output-observation acceptance, terminal-snapshot admission locking, and atomic provider-fallback handover with bounded recovery reentry, lands bounded input batching with per-item reply routing and safe current-turn input attachment, adds direct subagent conversation access, agent tail progress observation with confirmed command receipts, hot-reloadable message attachment size limits, and web GUI message search with bidirectional chat history browsing, introduces a DeepSeek Search and Fetch web provider, a 3D producer agent template, and an agent template gallery on the website, restores Android offline sessions with list retry and manual refresh, fixes iOS long-input summaries and home refresh jitter, persists daemon serve configuration across restarts, issues macOS pairing codes over trusted Unix control, bounds memory-index maintenance writer turns, and refreshes the model catalog and models.dev snapshot while restructuring the docs.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Runtime and task lifecycle
          - Task-result settlement is hardened at the output-observation acceptance seam ([#3546](https://github.com/holon-run/holon/pull/3546)), terminal task snapshots join the result admission lock ([#3562](https://github.com/holon-run/holon/pull/3562)), and provider-fallback handover becomes atomic with bounded recovery reentry ([#3581](https://github.com/holon-run/holon/pull/3581)).
          - Conversation reads are bound to the agent incarnation ([#3561](https://github.com/holon-run/holon/pull/3561)).
          - The TaskOutput model tool and task output CLI are retired ([#3544](https://github.com/holon-run/holon/pull/3544)).

          ### Input, observation, and messaging
          - Bounded input batching with per-item reply routing ([#3542](https://github.com/holon-run/holon/pull/3542)) and bounded safe input attachment for the current turn ([#3543](https://github.com/holon-run/holon/pull/3543)) land the input UX plan from issue #3530.
          - Message attachment size limits are configurable and hot-reloadable ([#3538](https://github.com/holon-run/holon/pull/3538)).
          - Agent tail exposes progress observation and confirmed command file receipts ([#3537](https://github.com/holon-run/holon/pull/3537)); tail follow hydration accumulates truncation receipts ([#3539](https://github.com/holon-run/holon/pull/3539)).

          ### Agents and collaboration
          - Subagents get direct conversation access and operator interaction ([#3545](https://github.com/holon-run/holon/pull/3545)).
          - Agent delegation now states its concrete benefit and avoids serial re-subcontracting and duplicate exploration ([#3568](https://github.com/holon-run/holon/pull/3568)); parent-child communication noise is reduced in favor of observable progress ([#3540](https://github.com/holon-run/holon/pull/3540)).
          - Agent lineage is separated from reporting and navigation ([#3552](https://github.com/holon-run/holon/pull/3552)).
          - Cross-agent worktree cleanup is safe inside bound workspaces ([#3553](https://github.com/holon-run/holon/pull/3553)), and non-empty agent tmp directories can be cleaned safely ([#3535](https://github.com/holon-run/holon/pull/3535)).

          ### Web GUI
          - Message search pinpoints results and chat history browses in both directions ([#3529](https://github.com/holon-run/holon/pull/3529)).
          - Cached sessions get a read-only instant preview with background access verification ([#3559](https://github.com/holon-run/holon/pull/3559)), the cached access notice aligns with conversation status ([#3580](https://github.com/holon-run/holon/pull/3580)), cached presentation is restored before the online refresh ([#3569](https://github.com/holon-run/holon/pull/3569)), and session refresh keeps the overview frame with skeleton loading ([#3558](https://github.com/holon-run/holon/pull/3558)).
          - Access verification and offline waiting no longer block draft editing ([#3583](https://github.com/holon-run/holon/pull/3583)).
          - The file browser menu is no longer clipped by short previews ([#3560](https://github.com/holon-run/holon/pull/3560)).

          ### Mobile clients
          - Android recovers offline sessions with list retry and manual refresh ([#3566](https://github.com/holon-run/holon/pull/3566)) and fixes message enqueue and retry for offline cached sessions ([#3563](https://github.com/holon-run/holon/pull/3563)).
          - iOS fixes long-input summaries, home refresh jitter, and automatic read marking ([#3525](https://github.com/holon-run/holon/pull/3525)).

          ### Models and providers
          - A DeepSeek Search and Fetch web provider is added ([#3584](https://github.com/holon-run/holon/pull/3584)).
          - The reviewed model catalog is refreshed with endpoint capability checks ([#3571](https://github.com/holon-run/holon/pull/3571), [#3547](https://github.com/holon-run/holon/pull/3547), [#3541](https://github.com/holon-run/holon/pull/3541)), plan catalogs keep the three-state route restriction ([#3582](https://github.com/holon-run/holon/pull/3582)), and the models.dev snapshot is refreshed ([#3527](https://github.com/holon-run/holon/pull/3527)).
          - Daily model catalog maintenance moves to an agent ([#3536](https://github.com/holon-run/holon/pull/3536)).

          ### Templates, skills, and SDK
          - A 3D producer template with a shared production workflow ships ([#3578](https://github.com/holon-run/holon/pull/3578)).
          - The template gallery layout is refreshed ([#3557](https://github.com/holon-run/holon/pull/3557)), templates are showcased on the website ([#3549](https://github.com/holon-run/holon/pull/3549)) with Chinese names and summaries ([#3554](https://github.com/holon-run/holon/pull/3554)).
          - The reverse-engineer template organizes outputs by target and preserves analysis history ([a41037c1](https://github.com/holon-run/holon/commit/a41037c1f410d939e1153e8ade1cc55a832d4c1a)).
          - Skill archive failures preserve diagnostics and retryability ([#3565](https://github.com/holon-run/holon/pull/3565)).
          - The SDK isolates located input enrichment from canonical revisions ([#3533](https://github.com/holon-run/holon/pull/3533)).

          ### macOS and daemon
          - daemon serve configuration persists across restarts with unified menu inheritance ([#3564](https://github.com/holon-run/holon/pull/3564)).
          - macOS pairing codes are issued over trusted Unix control ([#3528](https://github.com/holon-run/holon/pull/3528)).

          ### Data, tests, and docs
          - Memory-index maintenance writer turns are bounded ([#3585](https://github.com/holon-run/holon/pull/3585)).
          - Global PAX metadata no longer breaks GitHub archive content-root validation ([#3532](https://github.com/holon-run/holon/pull/3532)).
          - Test fixtures await cache writes before corruption ([#3526](https://github.com/holon-run/holon/pull/3526)).
          - Concepts and Guides docs are restructured with synced zh-CN docs ([#3556](https://github.com/holon-run/holon/pull/3556)); a bilingual blog series covers AI delivery verification ([6dd7de8d](https://github.com/holon-run/holon/commit/6dd7de8d348812dc5ea649eea5a08e7094c83672)), and iOS demo-service and content-report privacy notes are added ([264c2f99](https://github.com/holon-run/holon/commit/264c2f99a4fc82211d4e9b0c9198714693251eeb)).

          ## Pull requests

          Merged pull requests in this release:

          - [#3585](https://github.com/holon-run/holon/pull/3585) fix: bound memory index maintenance writer turns
          - [#3584](https://github.com/holon-run/holon/pull/3584) feat: add DeepSeek Search and Fetch web provider
          - [#3583](https://github.com/holon-run/holon/pull/3583) fix(web): 访问验证和断网等待不再阻止编辑草稿
          - [#3582](https://github.com/holon-run/holon/pull/3582) fix: 更新套餐模型目录并保留路由限制三态
          - [#3581](https://github.com/holon-run/holon/pull/3581) fix: 原子交接 provider fallback 的 task-result 并限制恢复重入
          - [#3580](https://github.com/holon-run/holon/pull/3580) fix(web): align cached access notice with conversation status
          - [#3578](https://github.com/holon-run/holon/pull/3578) feat: 新增 3D 制作人模板与共享制作流程
          - [#3571](https://github.com/holon-run/holon/pull/3571) fix: refresh model catalog and review provider endpoint capabilities
          - [#3569](https://github.com/holon-run/holon/pull/3569) fix: restore cached GUI presentation before online refresh
          - [#3568](https://github.com/holon-run/holon/pull/3568) fix: 明确 agent 委派收益并避免串行转包与重复探索
          - [#3566](https://github.com/holon-run/holon/pull/3566) fix(android): 恢复离线会话并支持列表重试与手动刷新
          - [#3565](https://github.com/holon-run/holon/pull/3565) fix: preserve skill archive failure diagnostics and retryability
          - [#3564](https://github.com/holon-run/holon/pull/3564) fix: 持久化 daemon serve 配置并统一菜单继承
          - [#3563](https://github.com/holon-run/holon/pull/3563) fix(android): 修复离线缓存会话的消息入队与重试
          - [#3562](https://github.com/holon-run/holon/pull/3562) fix(runtime): 将 terminal task 快照纳入结果准入锁
          - [#3561](https://github.com/holon-run/holon/pull/3561) feat: bind conversation reads to agent incarnation
          - [#3560](https://github.com/holon-run/holon/pull/3560) fix(web): 修复文件浏览器菜单被短预览裁切
          - [#3559](https://github.com/holon-run/holon/pull/3559) fix(web): 会话缓存只读即时预览与后台访问校验
          - [#3558](https://github.com/holon-run/holon/pull/3558) fix: 刷新 Agent 会话时保留概览框架并显示骨架加载
          - [#3557](https://github.com/holon-run/holon/pull/3557) feat: refresh agent template gallery layout
          - [#3556](https://github.com/holon-run/holon/pull/3556) docs: restructure Concepts and Guides, align docs hierarchy, and sync zh-CN docs
          - [#3554](https://github.com/holon-run/holon/pull/3554) fix: 补齐官网模板中文名称和摘要
          - [#3553](https://github.com/holon-run/holon/pull/3553) fix: 开放绑定 workspace 内的跨 agent 安全 worktree 清理
          - [#3552](https://github.com/holon-run/holon/pull/3552) fix: separate agent lineage from reporting and navigation
          - [#3549](https://github.com/holon-run/holon/pull/3549) feat: showcase agent templates in the website build
          - [#3547](https://github.com/holon-run/holon/pull/3547) fix: 人工核查模型目录与特殊 endpoint 路由（2026-10-16）
          - [#3546](https://github.com/holon-run/holon/pull/3546) fix: 修复输出观察与 TaskResult 结算的验收接缝
          - [#3545](https://github.com/holon-run/holon/pull/3545) feat: subagent 会话直达与 operator 直接交互
          - [#3544](https://github.com/holon-run/holon/pull/3544) fix: 退役 TaskOutput 模型工具和 task output CLI
          - [#3543](https://github.com/holon-run/holon/pull/3543) feat: 当前 turn 的有界安全输入附着（#3530 P2）
          - [#3542](https://github.com/holon-run/holon/pull/3542) feat: #3530 P1 有界输入组批与逐项回复路由
          - [#3541](https://github.com/holon-run/holon/pull/3541) chore: refresh reviewed model catalog for 2026-10-15
          - [#3540](https://github.com/holon-run/holon/pull/3540) fix: 降低父子 agent 通信噪声并优先观测进度
          - [#3539](https://github.com/holon-run/holon/pull/3539) fix: 累积 tail follow hydration 的截断回执
          - [#3538](https://github.com/holon-run/holon/pull/3538) feat: 可配置并支持热重载的消息附件大小限制

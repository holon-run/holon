name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release hardens provider admission and recovery end to end: shared cooldowns persist with request budgets and whole-chain pre-turn admission, 402 candidates are persistently isolated with unified recovery re-admission, identity-less 429s gain cross-epoch rate limiting, provider suspension handling is persisted and reported uniformly, and same-turn tool continuation is preserved during shared cooldown so long turns are no longer terminally interrupted. Task-result recovery keeps authoritative inputs alive when the canonical turn is not runnable, releases recovery winners before loser confirmation, discovers queued-only owners during startup, and stops old provider lineages from starving new recovery roots. Agent deletion finalizes atomically with per-generation initialization, deleted agents are repaired before recreation with legacy bootstrap residue cleaned up, and stale HTTP caches no longer leak across reincarnation. Calendar timer scheduling ships with cron and timezone support alongside a readable timer overview, the TUI gains explicit agent selection, and finance-ops, customer-success, and sales-operations steward templates arrive. Request-level image budgets with multimodal preflight bound markdown image delivery, prompt-cache policy resolves by exact model route for Anthropic and gains Token Plan GLM-5.3 and DeepSeek defaults, and the reviewed model catalog is refreshed across five waves. The models endpoint caches snapshots with ETag, roster refresh is throttled, latest-brief reads gain a transactional index, and runtime DB reads gain opt-in cancellation scopes. The web GUI distinguishes agent creation feedback states, iOS gates login behind explicit data-sharing consent while keeping the composer's offline scope, and Android hides unavailable model options.
          
          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.
          
          ## Summary
          
          ### Models, providers, and caching
          - Anthropic cache control resolves by exact model route so per-model overrides work on endpoints that host both cache-capable and non-cache-capable models ([#3705](https://github.com/holon-run/holon/pull/3705), fixing [#3698](https://github.com/holon-run/holon/issues/3698)), Token Plan GLM-5.3 defaults to implicit caching ([#3706](https://github.com/holon-run/holon/pull/3706)), and Token Plan DeepSeek gains explicit cache default policy ([#3729](https://github.com/holon-run/holon/pull/3729)).
          - The reviewed model catalog is refreshed with corrected special-endpoint policies, endpoint capability and budget calibration, and Codex Terra and Go three-protocol routes ([#3709](https://github.com/holon-run/holon/pull/3709), [#3732](https://github.com/holon-run/holon/pull/3732), [#3752](https://github.com/holon-run/holon/pull/3752), [#3768](https://github.com/holon-run/holon/pull/3768), [#3783](https://github.com/holon-run/holon/pull/3783)).
          - Model field auditing lands with backfilled provider-critical metadata, and catalogued models without context no longer fall back to a 4096 budget ([#3746](https://github.com/holon-run/holon/pull/3746), fixing [#3738](https://github.com/holon-run/holon/issues/3738) and [#3740](https://github.com/holon-run/holon/issues/3740)).
          
          ### Provider admission, cooldown, and fallback resilience
          - Persistent shared cooldown, request budgets, and pre-turn whole-chain admission ship together ([#3731](https://github.com/holon-run/holon/pull/3731), fixing [#3716](https://github.com/holon-run/holon/issues/3716)), 402 candidates are persistently isolated with unified recovery re-admission ([#3781](https://github.com/holon-run/holon/pull/3781), fixing [#3766](https://github.com/holon-run/holon/issues/3766) and [#3773](https://github.com/holon-run/holon/issues/3773)), and provider suspension persistence and reporting are unified ([#3763](https://github.com/holon-run/holon/pull/3763)).
          - Same-turn tool continuation is preserved during shared cooldown instead of terminally interrupting long turns with no reselectable candidate ([#3782](https://github.com/holon-run/holon/pull/3782), fixing [#3772](https://github.com/holon-run/holon/issues/3772)), cooldown reselection recovers interrupted input ([#3756](https://github.com/holon-run/holon/pull/3756), fixing [#3753](https://github.com/holon-run/holon/issues/3753) and [#3754](https://github.com/holon-run/holon/issues/3754)), and zero-dispatch recovery pauses no longer escalate failure epochs ([#3759](https://github.com/holon-run/holon/pull/3759)).
          - Rate limiting persists for 429 responses without a quota identity ([#3757](https://github.com/holon-run/holon/pull/3757), fixing [#3748](https://github.com/holon-run/holon/issues/3748)), local provider admission rejections give clear user-facing messages ([#3771](https://github.com/holon-run/holon/pull/3771)), and local StaleExecution is isolated from provider failure so zero-dispatch fallback storms end ([#3743](https://github.com/holon-run/holon/pull/3743), fixing [#3735](https://github.com/holon-run/holon/issues/3735)).
          
          ### Task lifecycle and recovery
          - Authoritative task_result and RuntimeInstruction inputs are preserved instead of dropped when the canonical turn is not runnable ([#3774](https://github.com/holon-run/holon/pull/3774), fixing [#3773](https://github.com/holon-run/holon/issues/3773)), exact-task replay recovers from the canonical predecessor ([#3704](https://github.com/holon-run/holon/pull/3704), fixing [#3669](https://github.com/holon-run/holon/issues/3669)), and persisted command-task cancellation phases no longer regress under late Running updates ([#3694](https://github.com/holon-run/holon/pull/3694), fixing [#3690](https://github.com/holon-run/holon/issues/3690)).
          - New task-result recovery roots for the same owner are no longer starved by old provider lineages ([#3764](https://github.com/holon-run/holon/pull/3764), fixing [#3762](https://github.com/holon-run/holon/issues/3762)), recovery winners release before waiting for loser confirmation ([#3761](https://github.com/holon-run/holon/pull/3761)), queued-only owners are discovered during startup recovery ([#3765](https://github.com/holon-run/holon/pull/3765)), and exhaustion acceptance completes required restart checkpoints first ([#3769](https://github.com/holon-run/holon/pull/3769)).
          - Supervised continuation settlement and existing-agent request-bound replies are repaired ([#3742](https://github.com/holon-run/holon/pull/3742), fixing [#3678](https://github.com/holon-run/holon/issues/3678)), task transitions are fenced by owner incarnation ([#3734](https://github.com/holon-run/holon/pull/3734)), and task-result controlled recovery runs on nightly with PR-label opt-in ([#3775](https://github.com/holon-run/holon/pull/3775)).
          - Acceptance coverage lands for consumed task-rejoin backlog liveness ([#3760](https://github.com/holon-run/holon/pull/3760)), stale producer rejection and delivery recovery ([#3770](https://github.com/holon-run/holon/pull/3770)), provider cooldown recovery across daemon restart ([#3777](https://github.com/holon-run/holon/pull/3777)), and the isolated fallback storm acceptance suite is persisted (commit [705dfe63](https://github.com/holon-run/holon/commit/705dfe63a1290b6473677377db0c6e33d7d5a403)).
          
          ### Deletion and agent lifecycle
          - Deletion execution finalizes atomically with private history cleanup and per-generation initialization ([#3708](https://github.com/holon-run/holon/pull/3708), fixing [#3703](https://github.com/holon-run/holon/issues/3703)), deleted agents are repaired before recreation ([#3739](https://github.com/holon-run/holon/pull/3739), fixing [#3737](https://github.com/holon-run/holon/issues/3737)), a deleted agent's restart no longer rebuilds legacy bootstrap rows ([#3715](https://github.com/holon-run/holon/pull/3715)), agent deletion is decoupled from historical references ([#3723](https://github.com/holon-run/holon/pull/3723), fixing [#3721](https://github.com/holon-run/holon/issues/3721)), and stale agent HTTP caches are prevented across reincarnation ([#3719](https://github.com/holon-run/holon/pull/3719), fixing [#3712](https://github.com/holon-run/holon/issues/3712)).
          
          ### Context, budgets, and media
          - Pre-admission budgeting projects persistently recoverable inputs ([#3733](https://github.com/holon-run/holon/pull/3733), fixing [#3726](https://github.com/holon-run/holon/issues/3726)), context budget errors are preserved while unchanged WorkItems pause instead of failing ([#3728](https://github.com/holon-run/holon/pull/3728)), and markdown images gain a request-level budget with content deduplication and multimodal preflight so image-heavy sessions stop tripping context-window limits ([#3789](https://github.com/holon-run/holon/pull/3789), fixing [#3632](https://github.com/holon-run/holon/issues/3632)).
          
          ### Timers and scheduling
          - Calendar timer scheduling ships with cron, timezones, and a unified management contract ([#3724](https://github.com/holon-run/holon/pull/3724), fixing [#3695](https://github.com/holon-run/holon/issues/3695)), and the timer overview becomes readable and manageable in agent details ([#3744](https://github.com/holon-run/holon/pull/3744), fixing [#3587](https://github.com/holon-run/holon/issues/3587); [#3750](https://github.com/holon-run/holon/pull/3750)).
          
          ### Performance and storage
          - The models endpoint and readiness checks cache directory snapshots with ETag support ([#3778](https://github.com/holon-run/holon/pull/3778), fixing [#3776](https://github.com/holon-run/holon/issues/3776)), full roster refresh is rate-limited with recovery semantics preserved ([#3717](https://github.com/holon-run/holon/pull/3717), fixing [#3078](https://github.com/holon-run/holon/issues/3078)), latest-brief reads gain a transactional index migration ([#3720](https://github.com/holon-run/holon/pull/3720)), and child agent state summaries stop scanning the global task table ([#3751](https://github.com/holon-run/holon/pull/3751), fixing [#3745](https://github.com/holon-run/holon/issues/3745)).
          - Workspace-state Git inventory is deduplicated with staged timing ([#3730](https://github.com/holon-run/holon/pull/3730)), read-side performance attribution and brief-synthesis benchmarks land ([#3718](https://github.com/holon-run/holon/pull/3718)), HTTP projection builds are supervised as cancellable ([#3727](https://github.com/holon-run/holon/pull/3727)), and runtime DB reads gain opt-in cancellation scopes ([#3725](https://github.com/holon-run/holon/pull/3725)).
          
          ### TUI, CLI, and web
          - The TUI supports explicitly selecting an agent while preserving session isolation ([#3707](https://github.com/holon-run/holon/pull/3707), fixing [#3702](https://github.com/holon-run/holon/issues/3702)), implicit CLI targets resolve from caller context ([#3699](https://github.com/holon-run/holon/pull/3699), fixing [#3670](https://github.com/holon-run/holon/issues/3670)), safe SPA navigation serves routes for missing and wildcard Accept headers ([#3701](https://github.com/holon-run/holon/pull/3701), fixing [#2861](https://github.com/holon-run/holon/issues/2861)), and session authentication keeps infrastructure errors instead of misreporting them as 401 ([#3713](https://github.com/holon-run/holon/pull/3713), fixing [#3711](https://github.com/holon-run/holon/issues/3711)).
          - The web GUI distinguishes agent creation acceptance, initialization, and failure feedback ([#3741](https://github.com/holon-run/holon/pull/3741), fixing [#3737](https://github.com/holon-run/holon/issues/3737)) and retires the agent creation banner after a successful first turn ([#3779](https://github.com/holon-run/holon/pull/3779)).
          
          ### Mobile clients
          - iOS login is gated behind explicit data-sharing consent ([#3693](https://github.com/holon-run/holon/pull/3693)), the iOS composer keeps its offline scope when the node is unreachable ([#3692](https://github.com/holon-run/holon/pull/3692)), and Android hides unavailable model options ([#3714](https://github.com/holon-run/holon/pull/3714)).
          
          ### Agent templates
          - New long-lived steward templates ship for finance operations ([#3767](https://github.com/holon-run/holon/pull/3767)), customer success ([#3786](https://github.com/holon-run/holon/pull/3786)), and sales operations ([#3755](https://github.com/holon-run/holon/pull/3755)).
          
          ### Tests and docs
          - Deferred settlement SQL columns and due-boundary scheduling gain regression coverage ([#3700](https://github.com/holon-run/holon/pull/3700), fixing [#3149](https://github.com/holon-run/holon/issues/3149)), live-interruption cases start from the roster after restored navigation ([#3696](https://github.com/holon-run/holon/pull/3696)), search-acquisition guide sources are completed in bilingual batches (commits [6a21e3c4](https://github.com/holon-run/holon/commit/6a21e3c4e10391d668cfbc8d1bc287cce155a729) and [ba043075](https://github.com/holon-run/holon/commit/ba043075d1f5cf11885fc9bba365e7c9861c9570)), and documentation is updated for the v0.54.0 release ([#3697](https://github.com/holon-run/holon/pull/3697)).
          
          ## Pull requests
          

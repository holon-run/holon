name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["legacy", "canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.sha256
            shasum -a 256 ./*.tar.gz | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Runtime line

          Holon ${GITHUB_REF_NAME} is part of the Rust runtime line. The Rust runtime is now the main \`holon\` binary.

          This minor release lands the deterministic scheduler and WorkItem execution protocol with crash-safe settlement, re-architects runtime storage around strict revision CAS and typed runtime events, adds the DeepSeek Responses endpoint dialect with local compaction budgets and stable provider prefix fingerprints, and redesigns Web GUI event synchronization. It also introduces agent lifecycle controls across CLI, TUI, and Web GUI, publishes production Docker images behind a protected Release E2E gate, and migrates the runtime database automatically on upgrade. Seamless upgrade from v0.30.0 has been verified with real session data.

          Supported binary assets for this release are Linux amd64, macOS amd64, and macOS arm64.

          ## Changes

          - Land the deterministic scheduler and WorkItem execution protocol with typed transitions and crash-safe settlement, and complete the authoritative cutover from the legacy scheduler ([#2366](https://github.com/holon-run/holon/pull/2366), [#2484](https://github.com/holon-run/holon/pull/2484), [#2464](https://github.com/holon-run/holon/pull/2464), [#2441](https://github.com/holon-run/holon/pull/2441)).
          - Make terminal settlement, WorkItem completion, and TaskResult processing atomic, idempotent, and race-free across completion fences, execution revisions, and restart rejoins ([#2392](https://github.com/holon-run/holon/pull/2392), [#2505](https://github.com/holon-run/holon/pull/2505), [#2508](https://github.com/holon-run/holon/pull/2508), [#2562](https://github.com/holon-run/holon/pull/2562), [#2566](https://github.com/holon-run/holon/pull/2566)).
          - Recover interrupted turns, tasks, and exact lifecycle waits after daemon restart, keep work queue retries alive after provider failure, and automatically recover failed agent runtimes ([#2531](https://github.com/holon-run/holon/pull/2531), [#2520](https://github.com/holon-run/holon/pull/2520), [#2447](https://github.com/holon-run/holon/pull/2447), [#2593](https://github.com/holon-run/holon/pull/2593)).
          - Bound queue head no-progress retries and close wake-hint and completion TOCTOU races ([#2519](https://github.com/holon-run/holon/pull/2519), [#2582](https://github.com/holon-run/holon/pull/2582), [#2583](https://github.com/holon-run/holon/pull/2583)).
          - Re-architect runtime storage with strict revision CAS, database sequence allocation, a Runtime Transition Unit of Work, extracted event log and read models, and typed runtime events with schema versioning ([#2304](https://github.com/holon-run/holon/pull/2304), [#2305](https://github.com/holon-run/holon/pull/2305), [#2337](https://github.com/holon-run/holon/pull/2337), [#2315](https://github.com/holon-run/holon/pull/2315)).
          - Add a release-aware runtime database baseline with automatic schema migration, bounded SQLite retention maintenance, and duplicate sequence repair ([#2501](https://github.com/holon-run/holon/pull/2501), [#2328](https://github.com/holon-run/holon/pull/2328), [#2318](https://github.com/holon-run/holon/pull/2318)).
          - Add the DeepSeek Responses endpoint dialect with native tools, effort handling, provider-aware diagnostics, local compaction budgets for full-history routes, and stable provider prefix fingerprints ([#2569](https://github.com/holon-run/holon/pull/2569), [#2571](https://github.com/holon-run/holon/pull/2571), [#2589](https://github.com/holon-run/holon/pull/2589), [#2585](https://github.com/holon-run/holon/pull/2585)).
          - Migrate provider catalogs to sparse route policies, unify the provider capability registry, preserve OpenAI web search citations and UTF-8 streaming, and add kimi-k3, qwen3.8-max, and deepseek-v4-flash models ([#2368](https://github.com/holon-run/holon/pull/2368), [#2326](https://github.com/holon-run/holon/pull/2326), [#2517](https://github.com/holon-run/holon/pull/2517), [#2448](https://github.com/holon-run/holon/pull/2448), [#2375](https://github.com/holon-run/holon/pull/2375), [#2496](https://github.com/holon-run/holon/pull/2496)).
          - Split the OpenAI transport with separated continuation scope identity and split context building into candidate, priority, and budget planners ([#2323](https://github.com/holon-run/holon/pull/2323), [#2319](https://github.com/holon-run/holon/pull/2319)).
          - Redesign Web GUI event synchronization with a global sync coordinator, agent session repository, retryable backfill recovery, and cache-first sessions bounded by a ProjectionGate ([#2567](https://github.com/holon-run/holon/pull/2567), [#2561](https://github.com/holon-run/holon/pull/2561), [#2559](https://github.com/holon-run/holon/pull/2559), [#2560](https://github.com/holon-run/holon/pull/2560), [#2547](https://github.com/holon-run/holon/pull/2547), [#2376](https://github.com/holon-run/holon/pull/2376), [#2359](https://github.com/holon-run/holon/pull/2359)).
          - Add agent lifecycle controls (stop/start/delete) across Web GUI, TUI, and CLI, backed by a reentrant agent deletion cleanup coordinator ([#2427](https://github.com/holon-run/holon/pull/2427), [#2426](https://github.com/holon-run/holon/pull/2426), [#2423](https://github.com/holon-run/holon/pull/2423), [#2421](https://github.com/holon-run/holon/pull/2421), [#2419](https://github.com/holon-run/holon/pull/2419)).
          - Redesign the Task Detail panel, add timeline execution status, improve the file browser, and fall back to auto reasoning effort when the target model rejects the configured level ([#2370](https://github.com/holon-run/holon/pull/2370), [#2321](https://github.com/holon-run/holon/pull/2321), [#2372](https://github.com/holon-run/holon/pull/2372), [#2594](https://github.com/holon-run/holon/pull/2594)).
          - Publish production Docker images with live acceptance cases behind a protected Release E2E gate, and expand scheduler E2E tiers, nightly canary, runtime contract drift detection, and production runtime trace diagnostics ([#2355](https://github.com/holon-run/holon/pull/2355), [#2356](https://github.com/holon-run/holon/pull/2356), [#2465](https://github.com/holon-run/holon/pull/2465), [#2352](https://github.com/holon-run/holon/pull/2352), [#2378](https://github.com/holon-run/holon/pull/2378)).

          ## Install

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

          ## Install

          Android:

          Download [\`holon-android-${GITHUB_REF_NAME}.apk\`](https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-android-${GITHUB_REF_NAME}.apk) on your device and allow installation from the download source. Future official APKs use the same signing identity and upgrade in place. Existing debug-signed installations require a one-time reinstall; uninstalling removes their local sessions, drafts, and outbox.

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Prepare beta release notes
        if: ${{ contains(github.ref_name, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          {
            echo "Daily beta train build \`${GITHUB_REF_NAME}\` (candidate \`${GITHUB_SHA}\`)."
            echo
            echo "Channel contract: beta-channel machines install this prerelease only after the Release E2E attestation and the real-library smoke check both pass. The \`[smoke: ...]\` line below is that smoke marker; \`[smoke: pending]\` means do not upgrade yet."
            echo
            echo "## Commits since ${prev}"
            gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA}" \
              --jq '.commits[:40][] | "- [" + (.sha | .[0:8]) + "] " + (.commit.message | split("\n")[0])'
            echo
            echo "[smoke: pending]"
          } > beta-release-notes.md

      - name: Publish GitHub release
        if: ${{ !contains(github.ref_name, '-beta.') }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/*.apk
            dist-artifacts/*.aab
            dist-artifacts/*android*.json
            dist-artifacts/*android*.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Resume check for an existing beta prerelease
        if: ${{ contains(github.ref_name, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-dispatching Release for the same beta tag (an interrupted train)
          # must be idempotent: the publish step below updates the existing
          # prerelease in place, replacing same-named assets, instead of
          # creating a duplicate or failing the resume.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "existing prerelease for ${GITHUB_REF_NAME}; this run will update it in place (resume)"
          else
            echo "no existing prerelease for ${GITHUB_REF_NAME}; creating it"
          fi

      - name: Publish GitHub beta prerelease
        if: ${{ contains(github.ref_name, '-beta.') }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: beta-release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        if: ${{ !contains(github.ref_name, '-beta.') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    # Beta trains skip the signed app jobs upstream; a skipped `needs` job
    # would normally skip this one too, so re-gate explicitly.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    # Same re-gating as above so the beta train still publishes its image.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.e2e-gate.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          channel_tags=(latest)
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            # Beta trains update the rolling `beta` tag and never move `latest`.
            channel_tags=(beta)
          fi
          args=(--tag "${repository}:${version}")
          for channel in "${channel_tags[@]}"; do
            args+=(--tag "${repository}:${channel}")
          done
          docker buildx imagetools create "${args[@]}" "${SOURCE_IMAGE}"

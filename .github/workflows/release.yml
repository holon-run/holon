name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release adds managed Cloudflare Named Tunnel access for zero-configuration remote reachability, keeps TUI turn details stable through result delivery, and tightens the web GUI's visible-data contract: overview resources refresh behind identity fences, visible work and task details revalidate, selected-agent state and WorkItem refresh unify, and new-GUI-to-old-daemon sessions admit ordinary resources by request fence instead of trusting identity response headers. Runtime lifecycle fixes maintain cancellation revisions atomically with a persisted repair block, stop historical last_runtime_failure from blocking idle child-agent deletion, and treat zombie daemon PIDs as exited. Performance work moves brief read cursor polling off the database writer channel and debounces cursor-advance POSTs into quiet windows. Test and CI stability lands deterministic waits for cooldown-park, gate_close, and ReadingCoordinator backoff retries, parallelizes the Rust PR critical path, fails fast on stalled xcodebuild, and fails closed when the iOS UI watchdog thread cannot start. A travel itinerary planner agent template arrives, the model catalog is refreshed, and documentation gains JSON-LD structured data, unified positioning copy, SERP title rewrites, Google Workspace and self-hosted GitLab CE OIDC single sign-on guides, and a team AI-assistant sharing guide.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Remote access
          - Managed Cloudflare Named Tunnel access ([#3868](https://github.com/holon-run/holon/pull/3868), [#3865](https://github.com/holon-run/holon/issues/3865)): remote and team access can ride a managed named tunnel without manual port exposure; the zero-config automatic Quick Tunnel split remains tracked in [#3874](https://github.com/holon-run/holon/issues/3874).

          ### TUI and web GUI consistency
          - TUI turn details stay stable through result delivery ([#3866](https://github.com/holon-run/holon/pull/3866)), so turn documents no longer reshuffle when results land.
          - The web GUI refreshes visible overview resources with identity fences ([#3843](https://github.com/holon-run/holon/pull/3843)), revalidates visible work and task details ([#3839](https://github.com/holon-run/holon/pull/3839)), and unifies selected-agent state with WorkItem refresh ([#3836](https://github.com/holon-run/holon/pull/3836)).
          - New GUI sessions against old daemons admit ordinary resources by request fence instead of misreading missing identity headers as agent replacement ([#3853](https://github.com/holon-run/holon/pull/3853), fixing [#3849](https://github.com/holon-run/holon/issues/3849)).

          ### Runtime lifecycle and queue invariants
          - Cancellation revision maintenance is atomic and the repair block persists ([#3855](https://github.com/holon-run/holon/pull/3855)), so cancelled executions cannot wedge between a revision bump and its repair.
          - Historical last_runtime_failure no longer independently blocks an active execution ([#3852](https://github.com/holon-run/holon/pull/3852), fixing [#3758](https://github.com/holon-run/holon/issues/3758)), unblocking idle child-agent deletion.
          - Zombie daemon PIDs are treated as exited in pid_is_alive ([#3873](https://github.com/holon-run/holon/pull/3873), fixing [#3844](https://github.com/holon-run/holon/issues/3844)).

          ### Performance
          - Brief read cursor polling moves off the database writer channel ([#3854](https://github.com/holon-run/holon/pull/3854)) and the web GUI debounces cursor-advance POSTs into quiet windows ([#3856](https://github.com/holon-run/holon/pull/3856)), reducing writer contention during polling storms.

          ### Test and CI stability
          - The cooldown park test waits for input completion before asserting source-processed ([#3835](https://github.com/holon-run/holon/pull/3835), fixing [#3819](https://github.com/holon-run/holon/issues/3819)), gate_close queued-waiter failure becomes deterministic ([#3837](https://github.com/holon-run/holon/pull/3837), fixing [#3824](https://github.com/holon-run/holon/issues/3824)), and the ReadingCoordinator backoff retry test waits for offline settle ([#3872](https://github.com/holon-run/holon/pull/3872), fixing [#3864](https://github.com/holon-run/holon/issues/3864)).
          - CI parallelizes the Rust PR critical paths ([#3840](https://github.com/holon-run/holon/pull/3840)), the iOS UI job fails fast on stalled xcodebuild ([#3859](https://github.com/holon-run/holon/pull/3859), fixing [#3842](https://github.com/holon-run/holon/issues/3842)) and fails closed when the UI watchdog thread cannot start ([#3862](https://github.com/holon-run/holon/pull/3862)).
          - Runtime simctl ui content_size reads and writes gain bounded retries with exponential backoff ([#3845](https://github.com/holon-run/holon/pull/3845)).

          ### Agent templates and model catalog
          - A travel itinerary planner agent template arrives ([#3858](https://github.com/holon-run/holon/pull/3858)), and the model catalog is synced with the 2026-11-01 endpoint audit ([#3857](https://github.com/holon-run/holon/pull/3857)).

          ### Documentation
          - The documentation website gains JSON-LD structured data and a unified positioning title (commit [6741c551](https://github.com/holon-run/holon/commit/6741c5513ac932da380bd2127b82d9b7478f677d)) plus unified positioning copy as Open-source AI assistants (commit [7fad3623](https://github.com/holon-run/holon/commit/7fad3623637e284ac21c2353717d4389f9790b83)), SERP titles and summaries are rewritten for top templates and listing pages (commit [458b654d](https://github.com/holon-run/holon/commit/458b654d2550897aab50583dd6624fa214f3947a)), and the v0.56.0 release documentation is folded in ([#3838](https://github.com/holon-run/holon/pull/3838)).
          - Single sign-on guides land for Google Workspace (commits [2cae2603](https://github.com/holon-run/holon/commit/2cae2603d92c4c278989284b12f8f0764a09ebc9) and [3b12c262](https://github.com/holon-run/holon/commit/3b12c26222e96e80692d555a4a6ad94e4a6f4af1)) and self-hosted GitLab CE (commit [f265c972](https://github.com/holon-run/holon/commit/f265c97278b2c6409e3d948d89a1662c0109d627)), alongside a team AI-assistant sharing guide linked from getting started (commit [6fa6c34e](https://github.com/holon-run/holon/commit/6fa6c34ee5d46c32e5301483f94087786121e285)).

          ## Pull requests

          - [#3873](https://github.com/holon-run/holon/pull/3873) fix: treat zombie daemon PIDs as exited in pid_is_alive
          - [#3872](https://github.com/holon-run/holon/pull/3872) test: wait for offline settle in ReadingCoordinator backoff retry test
          - [#3868](https://github.com/holon-run/holon/pull/3868) feat: 支持受管 Cloudflare Named Tunnel 访问（#3865）
          - [#3866](https://github.com/holon-run/holon/pull/3866) feat: TUI turn 详情与结果展示一致性
          - [#3862](https://github.com/holon-run/holon/pull/3862) fix(ci): fail closed when the iOS UI watchdog thread cannot start
          - [#3859](https://github.com/holon-run/holon/pull/3859) fix(ci): fail fast on stalled xcodebuild in the iOS UI job
          - [#3858](https://github.com/holon-run/holon/pull/3858) feat: 新增旅行行程管家模板
          - [#3857](https://github.com/holon-run/holon/pull/3857) chore: 同步 2026-11-01 模型目录与端点核查
          - [#3856](https://github.com/holon-run/holon/pull/3856) perf(web-gui): debounce brief-read-cursor advance POSTs to quiet windows
          - [#3855](https://github.com/holon-run/holon/pull/3855) fix(runtime): 原子维护取消 revision 并持久化 repair block
          - [#3854](https://github.com/holon-run/holon/pull/3854) perf(runtime-db): keep brief read cursor polling off the writer channel
          - [#3853](https://github.com/holon-run/holon/pull/3853) fix(web): admit ordinary resources by request fence, not identity response headers
          - [#3852](https://github.com/holon-run/holon/pull/3852) fix(runtime-db): 历史 last_runtime_failure 不再单独构成活动执行阻塞 (#3758)
          - [#3845](https://github.com/holon-run/holon/pull/3845) fix(ios): 运行期 simctl ui content_size 读/写加有界重试与指数退避
          - [#3843](https://github.com/holon-run/holon/pull/3843) feat(web): refresh visible overview resources with identity fences
          - [#3840](https://github.com/holon-run/holon/pull/3840) ci: parallelize the Rust PR critical paths
          - [#3839](https://github.com/holon-run/holon/pull/3839) fix(web): revalidate visible work and task details
          - [#3838](https://github.com/holon-run/holon/pull/3838) docs: update documentation for v0.56.0 release
          - [#3837](https://github.com/holon-run/holon/pull/3837) test: make gate_close queued-waiter failure deterministic (#3824)
          - [#3836](https://github.com/holon-run/holon/pull/3836) fix(web): unify selected-agent state and WorkItem refresh
          - [#3835](https://github.com/holon-run/holon/pull/3835) test: wait for input completion before source-processed assertion in cooldown park test

          ### Direct commits

          - [f265c972](https://github.com/holon-run/holon/commit/f265c97278b2c6409e3d948d89a1662c0109d627) docs: add self-hosted GitLab CE OIDC single sign-on guide in zh-CN and en
          - [458b654d](https://github.com/holon-run/holon/commit/458b654d2550897aab50583dd6624fa214f3947a) docs(website): rewrite SERP titles and summaries for top templates and listing pages (OP-004)
          - [3b12c262](https://github.com/holon-run/holon/commit/3b12c26222e96e80692d555a4a6ad94e4a6f4af1) docs: 移除 Google Workspace OIDC 指南中多余的内部验证范围声明
          - [2cae2603](https://github.com/holon-run/holon/commit/2cae2603d92c4c278989284b12f8f0764a09ebc9) docs: add Google Workspace OIDC single sign-on guide in zh-CN and en
          - [6741c551](https://github.com/holon-run/holon/commit/6741c5513ac932da380bd2127b82d9b7478f677d) feat(docs-website): add JSON-LD structured data and unify positioning title
          - [7fad3623](https://github.com/holon-run/holon/commit/7fad3623637e284ac21c2353717d4389f9790b83) docs(website): unify positioning copy as Open-source AI assistants
          - [6fa6c34e](https://github.com/holon-run/holon/commit/6fa6c34ee5d46c32e5301483f94087786121e285) docs: 增加与团队共用 AI 助手指南并串联 getting-started 入口

          ## Issues

          - [#3865](https://github.com/holon-run/holon/issues/3865) feat: 支持自动创建 Cloudflare Tunnel（cloudflared）实现零配置远程与团队访问 — managed Named Tunnel access lands in [#3868](https://github.com/holon-run/holon/pull/3868); the automatic Quick Tunnel split remains open in [#3874](https://github.com/holon-run/holon/issues/3874)
          - [#3864](https://github.com/holon-run/holon/issues/3864) flake: ReadingCoordinatorTests.testOfflineRecoveryRetriesWithGrowingBackoffAndNoBound — 断言与在途重试竞态 — fixed by [#3872](https://github.com/holon-run/holon/pull/3872)
          - [#3849](https://github.com/holon-run/holon/issues/3849) bug(web): 新 GUI 连接旧 daemon 时将缺少身份响应头误判为 agent 已替换 — fixed by [#3853](https://github.com/holon-run/holon/pull/3853)
          - [#3844](https://github.com/holon-run/holon/issues/3844) Flaky: foreground_stop_start_and_restart_inherit_full_profile fails when daemon survives TERM and KILL on Rust Test (cli) — fixed by [#3873](https://github.com/holon-run/holon/pull/3873)
          - [#3842](https://github.com/holon-run/holon/issues/3842) Flaky: iOS UI gate job hangs silently during SwiftDriver test-target compilation (macOS runner stall) — fixed by [#3859](https://github.com/holon-run/holon/pull/3859)
          - [#3824](https://github.com/holon-run/holon/issues/3824) Flaky test: gate_close_fails_queued_waiters_before_any_sql panics when close() cancels the leader scope before its spawn_blocking worker starts — fixed by [#3837](https://github.com/holon-run/holon/pull/3837)
          - [#3819](https://github.com/holon-run/holon/issues/3819) Flaky test: cooldown_park_survives_sigkill_and_resumes_on_schedule_without_new_input asserts queue terminal before the write lands — fixed by [#3835](https://github.com/holon-run/holon/pull/3835)
          - [#3758](https://github.com/holon-run/holon/issues/3758) bug(agent): 历史 last_runtime_failure 被当作活动执行，阻止空闲子代理删除 — fixed by [#3852](https://github.com/holon-run/holon/pull/3852)

          ## Install

          Android:

          Download [\`holon-android-${GITHUB_REF_NAME}.apk\`](https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-android-${GITHUB_REF_NAME}.apk) on your device and allow installation from the download source. Future official APKs use the same signing identity and upgrade in place. Existing debug-signed installations require a one-time reinstall; uninstalling removes their local sessions, drafts, and outbox.

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/*.apk
            dist-artifacts/*.aab
            dist-artifacts/*android*.json
            dist-artifacts/*android*.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version matches tag
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/test-release-crate-publish-order.sh
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          publish_if_needed() {
            crate="$1"
            version="$(awk -F '"' '/^version = / { print $2; exit }' "crates/${crate}/Cargo.toml")"
            if curl -fsS -A "holon-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            echo "Publishing ${crate} ${version}..."
            cargo publish --locked --manifest-path "crates/${crate}/Cargo.toml"
            sleep 15
          }
          publish_if_needed holon-model-client
          publish_if_needed decision-core
          publish_if_needed decision-jev
          publish_if_needed decision-clef
          publish_if_needed decision-openai
          publish_if_needed decision-openai-decisions
          publish_if_needed decision-local-onnx
          cargo publish --locked

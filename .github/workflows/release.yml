name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release resolves Anthropic prompt-cache control by exact model route so per-model overrides work on endpoints that host both cache-capable and non-cache-capable models, keeps Token Plan GLM-5.3 on implicit caching, and refreshes the model catalog with corrected special-endpoint policies. Deletion execution finalizes atomically with private history cleanup and per-generation initialization so re-created agents never inherit a deleted incarnation's unfinished turn, exact-task replay recovers from the canonical predecessor, and persisted task cancellation phases no longer regress under late Running updates. The TUI gains explicit agent selection with preserved session isolation, implicit CLI targets resolve from caller context, safe SPA navigation serves missing and wildcard Accept headers, iOS login is gated behind explicit data-sharing consent while the composer keeps offline scope when the node is unreachable, and deferred settlement SQL columns and due-boundary scheduling gain regression coverage.

          ## Summary

          ### Models, providers, and caching
          - Anthropic cache control resolves by exact model route, enabling per-model prompt-cache overrides where endpoint-level cache_control cannot describe mixed endpoints ([#3705](https://github.com/holon-run/holon/pull/3705), fixing [#3698](https://github.com/holon-run/holon/issues/3698)).
          - Token Plan GLM-5.3 defaults to implicit caching, conservatively disabling explicit cache markers on that plan ([#3706](https://github.com/holon-run/holon/pull/3706)).
          - The model catalog is refreshed and special endpoint policies corrected ([#3709](https://github.com/holon-run/holon/pull/3709)).

          ### Task lifecycle and recovery
          - Exact-task replay recovers from the canonical predecessor, fixing task_rejoin aborts where the replay edge and the anchor source-turn identity disagreed ([#3704](https://github.com/holon-run/holon/pull/3704), fixing [#3669](https://github.com/holon-run/holon/issues/3669)).
          - Persisted command-task cancellation phases no longer regress when a Running update lands after stop ([#3694](https://github.com/holon-run/holon/pull/3694), fixing [#3690](https://github.com/holon-run/holon/issues/3690)).

          ### Deletion and data lifecycle
          - Deletion execution finalizes atomically, private history is cleaned up, and per-generation initialization runs, so a re-created agent no longer shows the deleted incarnation's unfinished turn as Working or skips its own initialization turn ([#3708](https://github.com/holon-run/holon/pull/3708), fixing [#3703](https://github.com/holon-run/holon/issues/3703)).

          ### TUI, CLI, and web
          - The TUI supports explicitly selecting an agent while preserving session isolation ([#3707](https://github.com/holon-run/holon/pull/3707), fixing [#3702](https://github.com/holon-run/holon/issues/3702)).
          - Implicit CLI targets resolve from caller context, fixing agent-mode events tail lookups that requested /api/ and got 404 when --agent was omitted ([#3699](https://github.com/holon-run/holon/pull/3699), fixing [#3670](https://github.com/holon-run/holon/issues/3670)).
          - Safe SPA navigation serves routes for missing and wildcard Accept headers ([#3701](https://github.com/holon-run/holon/pull/3701), fixing [#2861](https://github.com/holon-run/holon/issues/2861)).

          ### Mobile clients
          - iOS login is gated behind explicit data-sharing consent ([#3693](https://github.com/holon-run/holon/pull/3693)).
          - The iOS composer keeps its offline scope when the node is unreachable ([#3692](https://github.com/holon-run/holon/pull/3692)).

          ### Tests and docs
          - Deferred settlement SQL columns and due-boundary scheduling gain regression coverage ([#3700](https://github.com/holon-run/holon/pull/3700), fixing [#3149](https://github.com/holon-run/holon/issues/3149)).
          - Live-interruption cases start from the roster after restored navigation ([#3696](https://github.com/holon-run/holon/pull/3696)).
          - Documentation is updated for the v0.54.0 release ([#3697](https://github.com/holon-run/holon/pull/3697)).

          ## Pull requests

          - [#3709](https://github.com/holon-run/holon/pull/3709) chore(models): 更新模型目录并校正特殊端点策略
          - [#3708](https://github.com/holon-run/holon/pull/3708) fix: 删除执行原子收尾、私有历史清理与每代初始化
          - [#3707](https://github.com/holon-run/holon/pull/3707) feat: TUI 支持显式选择 Agent，保留会话隔离
          - [#3706](https://github.com/holon-run/holon/pull/3706) fix: default Token Plan GLM-5.3 to implicit caching
          - [#3705](https://github.com/holon-run/holon/pull/3705) fix: 按精确模型路由解析 Anthropic 缓存控制
          - [#3704](https://github.com/holon-run/holon/pull/3704) fix: replay exact task recovery from canonical predecessor
          - [#3701](https://github.com/holon-run/holon/pull/3701) fix: 支持安全 SPA 导航的缺失与通配 Accept
          - [#3700](https://github.com/holon-run/holon/pull/3700) test: verify deferred settlement SQL columns and due boundary
          - [#3699](https://github.com/holon-run/holon/pull/3699) fix: resolve implicit CLI targets from caller context
          - [#3697](https://github.com/holon-run/holon/pull/3697) docs: update documentation for v0.54.0 release
          - [#3696](https://github.com/holon-run/holon/pull/3696) test: start live-interruption case from the roster after restored navigation
          - [#3694](https://github.com/holon-run/holon/pull/3694) fix: prevent persisted task cancellation phase regressions
          - [#3693](https://github.com/holon-run/holon/pull/3693) feat: gate iOS login behind explicit data-sharing consent
          - [#3692](https://github.com/holon-run/holon/pull/3692) fix: keep iOS composer offline scope when node is unreachable

          ## Issues

          - [#3703](https://github.com/holon-run/holon/issues/3703) bug(runtime): a re-created agent showed the deleted incarnation's unfinished turn as Working and skipped its own initialization turn — fixed by [#3708](https://github.com/holon-run/holon/pull/3708)
          - [#3702](https://github.com/holon-run/holon/issues/3702) enhancement(tui): holon tui --agent ID opens the TUI on a given agent — fixed by [#3707](https://github.com/holon-run/holon/pull/3707)
          - [#3698](https://github.com/holon-run/holon/issues/3698) enhancement(provider): per-model prompt-cache capability override; endpoint-level cache_control cannot describe mixed endpoints — fixed by [#3705](https://github.com/holon-run/holon/pull/3705)
          - [#3690](https://github.com/holon-run/holon/issues/3690) test: stop_command_task_marks_cancelling_before_terminal_cancelled read stale Running status via task_output after stop — fixed by [#3694](https://github.com/holon-run/holon/pull/3694)
          - [#3670](https://github.com/holon-run/holon/issues/3670) bug(cli): agent-mode events tail without --agent resolved the default target lookup against /api/ and got a 404 — fixed by [#3699](https://github.com/holon-run/holon/pull/3699)
          - [#3669](https://github.com/holon-run/holon/issues/3669) bug(runtime): task_rejoin recovery aborted because the replay edge and the anchor source turn identity disagreed — fixed by [#3704](https://github.com/holon-run/holon/pull/3704)
          - [#3149](https://github.com/holon-run/holon/issues/3149) test: cover dedicated SQL columns written by narrow defer UPDATE — fixed by [#3700](https://github.com/holon-run/holon/pull/3700)
          - [#2861](https://github.com/holon-run/holon/issues/2861) enhancement(web): serve SPA routes for missing or wildcard Accept headers — fixed by [#3701](https://github.com/holon-run/holon/pull/3701)

          ## Install

          Android:

          Download [\`holon-android-${GITHUB_REF_NAME}.apk\`](https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-android-${GITHUB_REF_NAME}.apk) on your device and allow installation from the download source. Future official APKs use the same signing identity and upgrade in place. Existing debug-signed installations require a one-time reinstall; uninstalling removes their local sessions, drafts, and outbox.

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`

          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/*.apk
            dist-artifacts/*.aab
            dist-artifacts/*android*.json
            dist-artifacts/*android*.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version matches tag
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/test-release-crate-publish-order.sh
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          publish_if_needed() {
            crate="$1"
            version="$(awk -F '"' '/^version = / { print $2; exit }' "crates/${crate}/Cargo.toml")"
            if curl -fsS -A "holon-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            echo "Publishing ${crate} ${version}..."
            cargo publish --locked --manifest-path "crates/${crate}/Cargo.toml"
            sleep 15
          }
          publish_if_needed holon-model-client
          publish_if_needed decision-core
          publish_if_needed decision-jev
          publish_if_needed decision-clef
          publish_if_needed decision-openai
          publish_if_needed decision-openai-decisions
          publish_if_needed decision-local-onnx
          cargo publish --locked

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --features local-onnx --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --features local-onnx --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  android-app:
    name: Build signed Android app
    needs: e2e-gate
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - android-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg ./*.apk ./*.aab ./*android*.json | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The heredoc below becomes the published GitHub Release body verbatim.
          # Rewrite the overview and Changes sections for EVERY release in the
          # release-prep commit; never reuse the previous version's notes.
          # See docs/release.md ("Release notes").
          cat > release-notes.md <<EOF
          This release hardens deterministic provider-failure containment and core queue invariants: non-402 auth and contract failures now persist first-class cooldowns that end unbounded single-candidate defer loops, declared auth-refreshable dispatches are exempted from cooldown fencing so correctable retries go through, and cooldown replans keep their real failure cause instead of a re-selection error. WorkItem source-revision synchronization now covers every queue commit channel behind a same-transaction equality assertion, late WaitFor re-enqueues of terminal replies gain a bounded recovery obligation, timer wait admission becomes revision-atomic, and the snapshot preflight lane gains a FIFO wait queue instead of saturated 503s. Polled HTTP database reads move off tokio workers, ending the whole-process freezes found by the 2026-10-29 stall RCA. Gemini models gain native image input and ViewImage observation with image-part budget accounting, the web GUI hydrates agent detail from conversations while retiring its events API dependency, turn documents advertise only resolvable tool refs, and iOS accepts bare host addresses with an escape hatch during restore. Talent-ops, ASO, and search-visibility steward templates arrive, the video production template gains a pinned motion-prompt skill, and documentation adds a responsive navigation layout plus bilingual agent-ecosystem researcher guides.

          Supported binary assets for this release are Linux amd64, macOS amd64, macOS arm64, and Android. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer). The signed Android APK requires Android 8.0 (API 26) or newer; the AAB is for store submission, not direct installation.

          ## Summary

          ### Provider failure containment and model routing
          - Non-402 deterministic provider failure loops are bounded ([#3805](https://github.com/holon-run/holon/pull/3805), follow-up to v0.55.0's 402 isolation): 401/403 auth and persistent 400 contract failures are classified as first-class failure causes with persisted Credential and Contract cooldowns, so a dead single candidate can no longer be re-selected in every recovery epoch and defer without bound.
          - Correctable dispatch retries are admitted ([#3807](https://github.com/holon-run/holon/pull/3807)): a declared auth-refreshable dispatch settles mid-turn 401s without consuming the provider scope or writing a cooldown, so OAuth header-refresh re-sends go through in the new epoch while static credentials stay fenced.
          - Cooldown replans preserve the real failure cause ([#3799](https://github.com/holon-run/holon/pull/3799)), so scope-cooling waits are no longer replaced by candidate re-selection errors that abort turns early and lose the actual reason.
          - Model routing upkeep: supported compat routes gain coverage auditing ([#3801](https://github.com/holon-run/holon/pull/3801), [#3788](https://github.com/holon-run/holon/issues/3788)), endpoint-specific catalog routes retire ([#3794](https://github.com/holon-run/holon/pull/3794)), retired Qianfan routes are removed ([#3813](https://github.com/holon-run/holon/pull/3813)), and Go-native discovery metadata is isolated from the reviewed catalog ([#3829](https://github.com/holon-run/holon/pull/3829)).

          ### Vision and media
          - Gemini models gain native image input and ViewImage observation ([#3798](https://github.com/holon-run/holon/pull/3798)): inlineData parts keep text and image order, native observations gain JSON Schema lowering, image parts count against image budgets instead of text tokens, and fallback routes without image support reject required images before dispatch; general markdown image budgeting continues in [#3632](https://github.com/holon-run/holon/issues/3632).
          - Web GUI image-model settings only offer media-selectable routes ([#3804](https://github.com/holon-run/holon/pull/3804)).

          ### Queue, wait, and lifecycle invariants
          - WorkItem source revisions stay invariant across queue commit channels ([#3823](https://github.com/holon-run/holon/pull/3823), fixing [#3816](https://github.com/holon-run/holon/issues/3816)): wait-transition and completion writers synchronize the durable revision and execution-protocol registration in the same transaction, and a final equality assertion turns residual drift into a same-transaction rejection, closing back-to-back admission rejections and persistent settlement loops.
          - Late WaitFor re-enqueues of terminal replies gain a bounded recovery obligation ([#3830](https://github.com/holon-run/holon/pull/3830), for [#3827](https://github.com/holon-run/holon/issues/3827)): a dropped reply with complete canonical rejection evidence and a valid exact consuming wait gets a runtime-owned recovery wake without reviving the original delivery; the first-drop substate remains under investigation.
          - Timer wait admission is revision-atomic ([#3812](https://github.com/holon-run/holon/pull/3812), fixing [#3791](https://github.com/holon-run/holon/issues/3791)): TimerTick and exact-wait writers, claims, and admission snapshots stay consistent in one transaction, and terminal messages no longer strand timer pending placeholders.
          - Snapshot preflight gains a FIFO wait queue ([#3802](https://github.com/holon-run/holon/pull/3802), fixing [#3800](https://github.com/holon-run/holon/issues/3800)): the single capability-preflight worker queues up to 16 waiters with direct permit handoff to the oldest caller, keeping warm-cache /agents/snapshot polling healthy, with a new http.projection.preflight_admission_wait attribution stage.

          ### Performance and storage
          - Polled HTTP database reads move off tokio workers ([#3806](https://github.com/holon-run/holon/pull/3806)): /events page and SSE-open reads no longer block all workers in synchronous SQLite reads, ending the 8-22 second process-freeze mode found by the 2026-10-29 stall RCA, and slow-read observability covers the gap that RCA lacked.

          ### Web GUI
          - Agent detail hydrates from conversations instead of events ([#3809](https://github.com/holon-run/holon/pull/3809)), the dormant event stream transport is removed ([#3810](https://github.com/holon-run/holon/pull/3810)), and the event ledger and raw events dependencies retire ([#3811](https://github.com/holon-run/holon/pull/3811)), removing the Web GUI's dependency on the events API ([#3808](https://github.com/holon-run/holon/issues/3808)).

          ### Tools and iOS clients
          - Turn documents advertise only resolvable tool refs ([#3817](https://github.com/holon-run/holon/pull/3817), fixing [#3785](https://github.com/holon-run/holon/issues/3785)): :cmd, batch-item, and :output selectors are generated from hydrated execution records instead of being issued for tools that never supported them.
          - iOS connection input accepts bare host addresses (normalized to https) and the restore screen offers a change-address escape hatch when a saved profile is unreachable ([#3820](https://github.com/holon-run/holon/pull/3820)).
          - The iOS UI test gate is stabilized with bounded retries and scaled waits ([#3825](https://github.com/holon-run/holon/pull/3825)).

          ### Agent templates and skills
          - New long-lived steward templates arrive for talent operations ([#3796](https://github.com/holon-run/holon/pull/3796)), app store optimization ([#3803](https://github.com/holon-run/holon/pull/3803)), and search visibility ([#3815](https://github.com/holon-run/holon/pull/3815)), and the video production template gains a pinned-version motion-prompt skill ([#3832](https://github.com/holon-run/holon/pull/3832)).

          ### Documentation
          - Documentation gains a responsive navigation layout ([#3818](https://github.com/holon-run/holon/pull/3818)) and section indexes in the documentation shell (commit [639fc132](https://github.com/holon-run/holon/commit/639fc132cdd69e9ef4aa2d5bc71136ea46348ff8)), bilingual agent-ecosystem researcher guides land (commits [24638585](https://github.com/holon-run/holon/commit/24638585830e3085414731343debc175149e86c2), [3b25b2ae](https://github.com/holon-run/holon/commit/3b25b2ae37effda51a56dd3b60f7d315e81a3d41), [972f82c0](https://github.com/holon-run/holon/commit/972f82c0ad24c80245052087ffb766b14d5ef9c6), and [b3ee8eed](https://github.com/holon-run/holon/commit/b3ee8eed3de25269b6be93e3680b7be39a11c0d5)), and the v0.55.0 release documentation is folded in ([#3790](https://github.com/holon-run/holon/pull/3790), [#3792](https://github.com/holon-run/holon/pull/3792)).

          ## Pull requests

          - [#3832](https://github.com/holon-run/holon/pull/3832) feat: 为视频制作模板加入固定版本 motion-prompt 技能
          - [#3830](https://github.com/holon-run/holon/pull/3830) fix: 修复 late WaitFor 对终态 reply 的同 ID 重入队
          - [#3829](https://github.com/holon-run/holon/pull/3829) fix: 更新模型目录并隔离 Go 原生发现元数据
          - [#3825](https://github.com/holon-run/holon/pull/3825) test: stabilize the iOS UI gate with bounded retries and scaled waits
          - [#3823](https://github.com/holon-run/holon/pull/3823) fix: enforce WorkItem source revision invariant across queue commit channels (#3816)
          - [#3820](https://github.com/holon-run/holon/pull/3820) fix: accept bare host addresses and keep address entry reachable during restore
          - [#3818](https://github.com/holon-run/holon/pull/3818) docs: add responsive documentation navigation layout
          - [#3817](https://github.com/holon-run/holon/pull/3817) fix: advertise resolvable turn tool refs
          - [#3815](https://github.com/holon-run/holon/pull/3815) feat: add search visibility steward agent template
          - [#3813](https://github.com/holon-run/holon/pull/3813) chore: 更新模型目录并移除千帆退役路由
          - [#3812](https://github.com/holon-run/holon/pull/3812) fix: 原子同步 timer wait 准入 revision 并收尾终态 pending
          - [#3811](https://github.com/holon-run/holon/pull/3811) refactor(web): retire event ledger and raw events dependencies
          - [#3810](https://github.com/holon-run/holon/pull/3810) refactor(web): remove dormant event stream transport
          - [#3809](https://github.com/holon-run/holon/pull/3809) fix(web): hydrate agent detail from conversation instead of events
          - [#3807](https://github.com/holon-run/holon/pull/3807) fix: allow correctable provider dispatch retries
          - [#3806](https://github.com/holon-run/holon/pull/3806) fix: keep polled HTTP db reads off tokio workers
          - [#3805](https://github.com/holon-run/holon/pull/3805) fix: bound non-402 deterministic provider failure loops (auth/contract cooldowns)
          - [#3804](https://github.com/holon-run/holon/pull/3804) fix(web-gui): filter image model settings to media-selectable routes
          - [#3803](https://github.com/holon-run/holon/pull/3803) feat: add aso-steward agent template
          - [#3802](https://github.com/holon-run/holon/pull/3802) fix: bound snapshot preflight admission with a FIFO wait queue (#3800)
          - [#3801](https://github.com/holon-run/holon/pull/3801) fix: 补齐 models.dev 支持路由的覆盖审计
          - [#3799](https://github.com/holon-run/holon/pull/3799) fix: preserve cooldown replan failure causes
          - [#3798](https://github.com/holon-run/holon/pull/3798) feat: native Gemini image input and ViewImage observation
          - [#3796](https://github.com/holon-run/holon/pull/3796) feat: add talent-ops-steward agent template
          - [#3794](https://github.com/holon-run/holon/pull/3794) fix: retire endpoint-specific catalog routes
          - [#3792](https://github.com/holon-run/holon/pull/3792) docs: update documentation for v0.55.0 release
          - [#3790](https://github.com/holon-run/holon/pull/3790) chore: prepare v0.55.0 release

          ### Direct commits

          - [4260385c](https://github.com/holon-run/holon/commit/4260385c6a3b3640d5dcfed48013727c852ec41a) docs: 明确 Agent 自动选题与认领规则
          - [639fc132](https://github.com/holon-run/holon/commit/639fc132cdd69e9ef4aa2d5bc71136ea46348ff8) docs: include section indexes in the documentation shell
          - [24638585](https://github.com/holon-run/holon/commit/24638585830e3085414731343debc175149e86c2) docs: add English guide for building agent ecosystem researcher
          - [b3ee8eed](https://github.com/holon-run/holon/commit/b3ee8eed3de25269b6be93e3680b7be39a11c0d5) docs: refine ecosystem researcher guide per review feedback
          - [972f82c0](https://github.com/holon-run/holon/commit/972f82c0ad24c80245052087ffb766b14d5ef9c6) docs: enrich ecosystem researcher guide with Web GUI, autonomous principles, and mobile interactions
          - [3b25b2ae](https://github.com/holon-run/holon/commit/3b25b2ae37effda51a56dd3b60f7d315e81a3d41) docs: add Chinese scenario guide for building agent ecosystem researcher

          ## Issues

          - [#3827](https://github.com/holon-run/holon/issues/3827) bug(runtime): 不可重试 failed delivery 再次入队触发终态不变量，internal_followup 未送达 — late exact-wait recovery is restored by [#3830](https://github.com/holon-run/holon/pull/3830); the original first-drop substate remains under investigation
          - [#3816](https://github.com/holon-run/holon/issues/3816) enhancement(runtime): 同 WorkItem 背靠背 task_result 续接的准入 revision 过期被守卫拒绝，产生可避免的 failure brief — fixed by [#3823](https://github.com/holon-run/holon/pull/3823)
          - [#3808](https://github.com/holon-run/holon/issues/3808) refactor(web-gui): 消除 Web GUI 对 events 接口的依赖 — fixed by [#3809](https://github.com/holon-run/holon/pull/3809), [#3810](https://github.com/holon-run/holon/pull/3810), [#3811](https://github.com/holon-run/holon/pull/3811)
          - [#3800](https://github.com/holon-run/holon/issues/3800) bug: capability preflight 单槽不排队（MAX_WORKERS=1）使缓存热态的 /agents/snapshot 轮询稳定返回 503 projection_preflight_saturated — fixed by [#3802](https://github.com/holon-run/holon/pull/3802)
          - [#3797](https://github.com/holon-run/holon/issues/3797) bug(runtime): scope 冷却等待被候选重选错误顶替，turn 提前 abort 且丢失真实原因 — fixed by [#3799](https://github.com/holon-run/holon/pull/3799)
          - [#3795](https://github.com/holon-run/holon/issues/3795) feat(provider): 补齐 Gemini 原生图片输入与 ViewImage 视觉观察 — fixed by [#3798](https://github.com/holon-run/holon/pull/3798)
          - [#3791](https://github.com/holon-run/holon/issues/3791) bug(runtime): TimerTick 准入后首发因 WorkItemRevisionMismatch 被拒，后续 exact wait 恢复及 timer 去重滞留 — fixed by [#3812](https://github.com/holon-run/holon/pull/3812)
          - [#3788](https://github.com/holon-run/holon/issues/3788) models.dev 审计：受支持兼容路由未进入 coverage 枚举，原生 DeepSeek 路由缺同源比较 — fixed by [#3794](https://github.com/holon-run/holon/pull/3794), [#3801](https://github.com/holon-run/holon/pull/3801)
          - [#3785](https://github.com/holon-run/holon/issues/3785) fix(memory): turn 文档为非命令工具签发不可解析的 :cmd 引用 — fixed by [#3817](https://github.com/holon-run/holon/pull/3817)

          ## Install

          Android:

          Download [\`holon-android-${GITHUB_REF_NAME}.apk\`](https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-android-${GITHUB_REF_NAME}.apk) on your device and allow installation from the download source. Future official APKs use the same signing identity and upgrade in place. Existing debug-signed installations require a one-time reinstall; uninstalling removes their local sessions, drafts, and outbox.

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/*.apk
            dist-artifacts/*.aab
            dist-artifacts/*android*.json
            dist-artifacts/*android*.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version matches tag
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/test-release-crate-publish-order.sh
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          publish_if_needed() {
            crate="$1"
            version="$(awk -F '"' '/^version = / { print $2; exit }' "crates/${crate}/Cargo.toml")"
            if curl -fsS -A "holon-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            echo "Publishing ${crate} ${version}..."
            cargo publish --locked --manifest-path "crates/${crate}/Cargo.toml"
            sleep 15
          }
          publish_if_needed holon-model-client
          publish_if_needed decision-core
          publish_if_needed decision-jev
          publish_if_needed decision-clef
          publish_if_needed decision-openai
          publish_if_needed decision-openai-decisions
          publish_if_needed decision-local-onnx
          cargo publish --locked

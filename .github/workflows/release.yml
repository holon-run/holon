name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  e2e-gate:
    name: Verify Release E2E gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_image: ${{ steps.gate.outputs.candidate_image }}
      e2e_run_id: ${{ steps.gate.outputs.e2e_run_id }}
    steps:
      - name: Verify matching Release E2E attestation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"
          artifact_name="release-e2e-attestation-${sha}-${tag}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p release-e2e-gate

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/actions/workflows/release-e2e.yml/runs?event=workflow_dispatch&status=success&per_page=100")"

          artifact_url=""
          e2e_run_id=""
          for run_id in $(jq -r --arg sha "${sha}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${runs_json}"); do
            artifacts_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_url="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url' <<<"${artifacts_json}" | head -n1)"
            if [ -n "${artifact_url}" ]; then
              e2e_run_id="${run_id}"
              break
            fi
          done

          if [ -z "${artifact_url}" ]; then
            echo "No successful Release E2E attestation artifact named ${artifact_name} was found for ${sha}." >&2
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release-e2e-gate/attestation.zip \
            "${artifact_url}"
          unzip -p release-e2e-gate/attestation.zip release-e2e-attestation.json \
            > release-e2e-gate/release-e2e-attestation.json

          jq -e \
            --arg tag "${tag}" \
            --arg sha "${sha}" \
            --arg run_id "${e2e_run_id}" \
            '.schema_version == 1
             and .release_tag == $tag
             and .git_sha == $sha
             and (.workflow_run_id | tostring) == $run_id
             and .status == "pass"
             and (.image.ref | contains("@sha256:"))
             and (.model_route | length > 0)
             and (.previous_release.image | type == "string" and length > 0)
             and (
               (.previous_release.source == "previous_image"
                and .previous_release.ref == null)
               or
               (.previous_release.source == "previous_ref"
                and (.previous_release.ref | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
             )
             and .scheduler_acceptance.schema_version == 1
             and .scheduler_acceptance.status == "pass"
             and .scheduler_acceptance.git_sha == $sha
             and (.scheduler_acceptance.runtime_schema_revision | type == "number")
             and (.scheduler_acceptance.fixture_corpus_revision | length > 0)
             and (.scheduler_acceptance.image_digest | contains("@sha256:"))
             and ([.scheduler_acceptance.engines[] | .engine] == ["canonical"])
             and ([.scheduler_acceptance.engines[] | .status] | all(. == "pass"))' \
            release-e2e-gate/release-e2e-attestation.json >/dev/null

          candidate_image="$(jq -r '.image.ref' release-e2e-gate/release-e2e-attestation.json)"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"
          echo "e2e_run_id=${e2e_run_id}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release E2E attestation
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-e2e-attestation
          path: release-e2e-gate/release-e2e-attestation.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: e2e-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the official GNU/Linux binary compatible with glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: holon-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: holon-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: holon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tmpdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/holon" "$tmpdir/holon"
          mkdir -p "$tmpdir/agent_templates"
          cp -R agent_templates/github-solver "$tmpdir/agent_templates/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$tmpdir" holon agent_templates
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  macos-app:
    name: Build macOS menu app
    runs-on: macos-latest
    needs: e2e-gate
    env:
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      HOLON_SPARKLE_FEED_URL: ${{ vars.HOLON_SPARKLE_FEED_URL }}
      HOLON_SPARKLE_PUBLIC_KEY: ${{ secrets.HOLON_SPARKLE_PUBLIC_KEY }}
      HOLON_SPARKLE_PRIVATE_KEY: ${{ secrets.HOLON_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build web GUI
        run: make web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release credentials
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_APPLICATION
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
            HOLON_SPARKLE_FEED_URL
            HOLON_SPARKLE_PUBLIC_KEY
            HOLON_SPARKLE_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required macOS release credential is not configured: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/holon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/holon-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"

      - name: Build bundled Holon runtime
        run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Merge universal Holon runtime
        run: |
          set -euo pipefail
          mkdir -p target/universal-macos/release
          lipo -create \
            target/aarch64-apple-darwin/release/holon \
            target/x86_64-apple-darwin/release/holon \
            -output target/universal-macos/release/holon

      - name: Test macOS menu app
        run: swift test --package-path apps/macos/HolonMenu

      - name: Package macOS app and DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/package-macos-menu-app.sh \
            target/universal-macos/release/holon \
            dist \
            "$version"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          scripts/generate-macos-appcast.sh \
            dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-holon-macos-app
          path: |
            dist/Holon-*.dmg
            dist/Holon-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-app
      - e2e-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate release version
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Prepare checksums and Homebrew formula
        run: |
          set -euo pipefail
          (
            cd dist-artifacts
            rm -f ./*.tar.gz.sha256
            shasum -a 256 ./*.tar.gz ./*.dmg | sort -k2 > checksums.txt
          )
          bash scripts/generate-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist-artifacts/checksums.txt \
            homebrew-tap/Formula/holon.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula/holon.rb
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          This release introduces the conversation read model stack with its protocol SDK, change stream, and snapshot HTTP API, advances runtime observability, lifecycle recovery, memory durability, provider compatibility, and Web GUI resilience, and improves Linux runtime performance, bilingual documentation, and release validation.

          Supported binary assets for this release are Linux amd64, macOS amd64, and macOS arm64. The macOS app DMG is a universal binary supporting both x86_64 and arm64. The Linux amd64 binary supports Ubuntu 22.04 or newer (glibc 2.35 or newer).

          ## Changes

          - Add core end-to-end tracing, detailed runtime spans, sampled trace diagnostics, and exported observability signals ([#2906](https://github.com/holon-run/holon/pull/2906), [#2912](https://github.com/holon-run/holon/pull/2912), [#2924](https://github.com/holon-run/holon/pull/2924), [#2938](https://github.com/holon-run/holon/pull/2938), [#2945](https://github.com/holon-run/holon/pull/2945)).
          - Strengthen durable lifecycle behavior by bounding session catch-up, preserving timer wake fences, honoring wait-resume obligations, and recovering interrupted canonical deliveries ([#2914](https://github.com/holon-run/holon/pull/2914), [#2915](https://github.com/holon-run/holon/pull/2915), [#2919](https://github.com/holon-run/holon/pull/2919), [#2949](https://github.com/holon-run/holon/pull/2949)).
          - Make the memory index more durable and self-healing with contiguous-prefix acknowledgements, dirty/backfill recovery, paced indexing, and resumable full rebuilds ([#2920](https://github.com/holon-run/holon/pull/2920), [#2927](https://github.com/holon-run/holon/pull/2927), [#2928](https://github.com/holon-run/holon/pull/2928), [#2940](https://github.com/holon-run/holon/pull/2940), [#2954](https://github.com/holon-run/holon/pull/2954)).
          - Improve provider and control-plane reliability with Gemini-compatible tool schemas, transport-aware control auth, SQLite lock preservation, and protection against provider fallback storms ([#2917](https://github.com/holon-run/holon/pull/2917), [#2918](https://github.com/holon-run/holon/pull/2918), [#2921](https://github.com/holon-run/holon/pull/2921), [#2922](https://github.com/holon-run/holon/pull/2922)).
          - Improve Web GUI resilience and performance with endpoint-level timeout classification, retryable abort handling, reconnecting agent details, and stale-marker recovery ([#2925](https://github.com/holon-run/holon/pull/2925), [#2943](https://github.com/holon-run/holon/pull/2943), [#2950](https://github.com/holon-run/holon/pull/2950)).
          - Improve runtime performance with jemalloc on Linux, capped Tokio workers, and read-side attribution ([#2889](https://github.com/holon-run/holon/pull/2889), [#2935](https://github.com/holon-run/holon/pull/2935)).
          - Normalize agent template names and update the bilingual website and demonstration materials ([#2932](https://github.com/holon-run/holon/pull/2932), [#2946](https://github.com/holon-run/holon/pull/2946)).
          - Tighten CI and release validation by regenerating web transport types, skipping unnecessary Rust jobs, adding timing baselines, and protecting runtime database WAL sidecars ([#2929](https://github.com/holon-run/holon/pull/2929), [#2934](https://github.com/holon-run/holon/pull/2934), [#2955](https://github.com/holon-run/holon/pull/2955), [#2957](https://github.com/holon-run/holon/pull/2957), [#2958](https://github.com/holon-run/holon/pull/2958)).
          - Add the conversation read model phase 1 with the protocol SDK, change stream, snapshot HTTP read API, and the frozen v1 contract ([#2961](https://github.com/holon-run/holon/pull/2961), [#2965](https://github.com/holon-run/holon/pull/2965), [#2966](https://github.com/holon-run/holon/pull/2966), [#2971](https://github.com/holon-run/holon/pull/2971), [#2976](https://github.com/holon-run/holon/pull/2976)).
          - Harden task result delivery by preserving concurrent task results, avoiding duplicate detached completion tool results, and covering pending task result recovery ([#2979](https://github.com/holon-run/holon/pull/2979), [#2980](https://github.com/holon-run/holon/pull/2980), [#2981](https://github.com/holon-run/holon/pull/2981)).
          - Make the memory index more robust under concurrency with per-database writer coordination, bounded index transaction retries, and FTS scan avoidance during rebuilds ([#2962](https://github.com/holon-run/holon/pull/2962), [#2968](https://github.com/holon-run/holon/pull/2968), [#2974](https://github.com/holon-run/holon/pull/2974)).
          - Improve provider compatibility by preserving Gemini thought signatures across tool turns and avoiding cross-transport local client retries ([#2960](https://github.com/holon-run/holon/pull/2960), [#2975](https://github.com/holon-run/holon/pull/2975)).
          - Add the video-producer agent template with a local media production skill ([#2973](https://github.com/holon-run/holon/pull/2973)).
          - Ship bilingual documentation by translating the website to zh-CN, deduplicating bilingual navigation, and upgrading the docs site with locale detection ([#2959](https://github.com/holon-run/holon/pull/2959), [#2972](https://github.com/holon-run/holon/pull/2972), [#2963](https://github.com/holon-run/holon/pull/2963)).
          - Streamline CI with isolated Rust build target caching and reduced duplicate test work, and refresh the models.dev snapshot, artifact, and supplements ([#2970](https://github.com/holon-run/holon/pull/2970), [#2978](https://github.com/holon-run/holon/pull/2978), [#2982](https://github.com/holon-run/holon/pull/2982)).

          ## Install

          Homebrew:

          \`\`\`bash
          brew tap holon-run/tap
          brew install holon
          \`\`\`

          Direct binary:

          \`\`\`bash
          curl -L "https://github.com/holon-run/holon/releases/download/${GITHUB_REF_NAME}/holon-linux-amd64.tar.gz" | tar -xz
          chmod +x holon
          ./holon --help
          \`\`\`

          Replace \`holon-linux-amd64.tar.gz\` with \`holon-darwin-amd64.tar.gz\` or \`holon-darwin-arm64.tar.gz\` on macOS.

          Docker:

          \`\`\`bash
          docker pull ghcr.io/holon-run/holon:${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.dmg
            dist-artifacts/*.dmg.sha256
            dist-artifacts/appcast.xml
            dist-artifacts/checksums.txt

      - name: Push Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; formula was generated as an artifact only."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/holon-run/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp homebrew-tap/Formula/holon.rb "$tap_dir/Formula/holon.rb"

          cd "$tap_dir"
          git config user.name "holon-bot"
          git config user.email "holon-bot@holon.run"
          git add Formula/holon.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update Holon formula for ${GITHUB_REF_NAME}"
          git push origin main

  smoke:
    name: Smoke published release
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - release
      - e2e-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate image
        env:
          SOURCE_IMAGE: ${{ needs.e2e-gate.outputs.candidate_image }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${repository}:${version}" \
            --tag "${repository}:latest" \
            "${SOURCE_IMAGE}"

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version matches tag
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($crate_version) must match tag version ($tag_version)." >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked

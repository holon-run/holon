name: models.dev validate

on:
  pull_request:
    branches: [main]
    paths:
      - "models.dev/**"
      - "src/model_catalog.rs"
      - "src/model_catalog/**"
      - "src/config/models.rs"
      - "src/context/**"
      - "src/provider/registry/providers.rs"
      - "tests/models_dev*.rs"
      - "tests/fixtures/models_dev/**"
      - ".github/workflows/models-dev-validate.yml"
      - "Cargo.toml"
      - "build.rs"

permissions:
  contents: read

jobs:
  validate:
    name: Validate models.dev mapping and artifact

    # Compile under the 16 GB runner budget; see docs/implementation-decisions/ci-rust-memory-budget.md.
    runs-on: ubuntu-latest
    env:
      # All models_dev library tests belong to this compile group.
      HOLON_LIB_TEST_SHARD: c
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo check --all-targets --locked

      - name: Validate checked-in artifact (if present)
        run: |
          if [ -f models.dev/snapshot.json ] && [ -f models.dev/artifact.json ]; then
            cargo run --locked -- models-dev validate --input-dir models.dev
          else
            echo "No checked-in snapshot/artifact; skipping validate."
          fi

      - name: Run models.dev tests
        run: |
          cargo test --locked --lib --no-run
          cargo test --locked models_dev

      - name: Check reviewed route metadata and runtime budget policies (offline)
        run: cargo run --locked -- models-dev coverage --check

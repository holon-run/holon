name: Publish decision crates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref containing the crates/ sources to publish'
        required: false
        default: 'v0.45.0'

permissions:
  contents: read

jobs:
  publish:
    name: Publish decision-* crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish decision-* crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; cannot publish."
            exit 1
          fi
          publish_if_needed() {
            crate="$1"
            version="$(awk -F '"' '/^version = / { print $2; exit }' "crates/${crate}/Cargo.toml")"
            if curl -fsS -A "holon-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi
            echo "Publishing ${crate} ${version}..."
            cargo publish --locked --manifest-path "crates/${crate}/Cargo.toml"
            sleep 15
          }
          publish_if_needed decision-core
          publish_if_needed decision-jev
          publish_if_needed decision-openai
          publish_if_needed decision-local-onnx

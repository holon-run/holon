<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">WorkItem: save and resume work</title>
<desc id="desc">Decisions and execution happen in rounds; work records persist across rounds.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#285fa7" stroke-width="1.4"/></marker></defs>
<rect width="800" height="430" rx="8" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="40" y="45" font-size="22" fill="#183457" font-weight="600" text-anchor="start">WorkItem: save and resume work</text>
<rect x="40" y="82" width="300" height="68" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="60" y="109" font-size="18" fill="#183457" font-weight="600" text-anchor="start">Agent reasoning</text>
<text x="60" y="133" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">Choose the next step</text>
<rect x="460" y="82" width="300" height="68" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="480" y="109" font-size="18" fill="#183457" font-weight="600" text-anchor="start">Runtime</text>
<text x="480" y="133" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">Save state · Schedule execution</text>
<path d="M340 116H458" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M610 150V189" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="720" height="102" rx="6" fill="#eef4ff" stroke="#c4d6ec"/>
<text x="60" y="220" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">WorkItem</text>
<text x="182" y="220" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">Persistent work record</text>
<path d="M60 236H740" fill="none" stroke="#d4e0ee" stroke-width="1.3"/>
<text x="60" y="267" font-size="18" fill="#183457" font-weight="400" text-anchor="start">Goals &amp; delivery</text>
<text x="300" y="267" font-size="18" fill="#183457" font-weight="400" text-anchor="start">Progress &amp; evidence</text>
<text x="540" y="267" font-size="18" fill="#183457" font-weight="400" text-anchor="start">Wait &amp; resume</text>
<path d="M400 292V343" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 7"/>
<text x="414" y="321" font-size="14" fill="#53677d" font-weight="400" text-anchor="start">Read work record</text>
<rect x="40" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="140" y="370" font-size="18" fill="#183457" font-weight="600" text-anchor="middle">Signal arrives</text>
<text x="140" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">Check resume conditions</text>
<path d="M240 375H298" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="300" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="400" y="370" font-size="18" fill="#183457" font-weight="600" text-anchor="middle">Restore context</text>
<text x="400" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">Pick up this work</text>
<path d="M500 375H558" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="560" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="660" y="370" font-size="18" fill="#183457" font-weight="600" text-anchor="middle">Continue work</text>
<text x="660" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">Review and update record</text>
</g></svg>
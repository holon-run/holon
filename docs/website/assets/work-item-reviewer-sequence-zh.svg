<svg xmlns="http://www.w3.org/2000/svg" width="800" height="438" viewBox="0 0 800 438" role="img" aria-labelledby="title desc">
<title id="title">一个 Agent 如何交错推进两项工作</title>
<desc id="desc">同一个 reviewer 依次审阅 A、审阅 B、恢复 A、恢复 B。外部事件满足恢复条件后，由运行时安排执行；等待期间工作记录保留。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#285fa7" stroke-width="1.4"/></marker></defs>
<rect width="800" height="438" rx="8" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="40" y="45" font-size="22" fill="#183457" font-weight="600" text-anchor="start">一个 Agent 如何交错推进两项工作</text>
<text x="40" y="80" font-size="14" fill="#53677d" font-weight="400" text-anchor="start">一种处理顺序 · 横向为时间</text>
<text x="40" y="135" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">外部事件</text>
<rect x="322" y="108" width="136" height="40" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="390.0" y="133" font-size="15" fill="#183457" font-weight="400" text-anchor="middle">作者提交修订</text>
<rect x="628" y="108" width="124" height="40" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="690.0" y="133" font-size="15" fill="#183457" font-weight="400" text-anchor="middle">CI 完成</text>
<path d="M390 148V168H530V206" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 7"/>
<path d="M690 148V206" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 7"/>
<text x="40" y="182" font-size="13" fill="#53677d" font-weight="400" text-anchor="start">满足恢复条件后，由运行时安排执行</text>
<text x="40" y="233" font-size="15" fill="#183457" font-weight="600" text-anchor="start">同一个 Agent</text>
<text x="40" y="256" font-size="14" fill="#53677d" font-weight="400" text-anchor="start">reviewer</text>
<rect x="148" y="208" width="124" height="62" rx="6" fill="#eef4ff" stroke="#eef4ff"/>
<text x="210" y="233" font-size="17" fill="#285fa7" font-weight="600" text-anchor="middle">审阅 A</text>
<text x="210" y="256" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">记录问题</text>
<path d="M272 239H306" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="308" y="208" width="124" height="62" rx="6" fill="#edf6f3" stroke="#edf6f3"/>
<text x="370" y="233" font-size="17" fill="#34746d" font-weight="600" text-anchor="middle">审阅 B</text>
<text x="370" y="256" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">检查测试</text>
<path d="M432 239H466" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="468" y="208" width="124" height="62" rx="6" fill="#eef4ff" stroke="#eef4ff"/>
<text x="530" y="233" font-size="17" fill="#285fa7" font-weight="600" text-anchor="middle">恢复 A</text>
<text x="530" y="256" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">复查并交付</text>
<path d="M592 239H626" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="628" y="208" width="124" height="62" rx="6" fill="#edf6f3" stroke="#edf6f3"/>
<text x="690" y="233" font-size="17" fill="#34746d" font-weight="600" text-anchor="middle">恢复 B</text>
<text x="690" y="256" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">接着检查</text>
<text x="40" y="319" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">保留工作记录</text>
<text x="40" y="341" font-size="13" fill="#53677d" font-weight="400" text-anchor="start">等待不占执行线</text>
<path d="M210 270V324H362M386 324H530" fill="none" stroke="#285fa7" stroke-width="1.3"/>
<path d="M530 318V330" fill="none" stroke="#285fa7" stroke-width="1.3"/>
<text x="226" y="312" font-size="15" fill="#285fa7" font-weight="400" text-anchor="start">A 等待修订</text>
<path d="M370 270V317Q382 324 370 331V374H690" fill="none" stroke="#34746d" stroke-width="1.3"/>
<path d="M690 368V380" fill="none" stroke="#34746d" stroke-width="1.3"/>
<text x="386" y="362" font-size="15" fill="#34746d" font-weight="400" text-anchor="start">B 等待测试</text>
<text x="40" y="412" font-size="13" fill="#53677d" font-weight="400" text-anchor="start">中间实线：执行顺序    虚线：事件触发恢复条件，不表示立即抢占</text>
</g></svg>
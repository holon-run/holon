<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">从客户端上报到 GitHub Issue</title><desc id="desc">客户端生成诊断report并上报服务器；webhook通知Holon内的trace report Agent，读取获准trace、整理现场和证据，创建或补充GitHub Issue，再交开发者定位修复。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#285fa7" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="690" rx="16" fill="#f7faff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#183457">
<text x="28" y="48" font-size="27" fill="#183457" font-weight="600" text-anchor="start">从客户端上报到 GitHub Issue</text>
<text x="28" y="84" font-size="20" fill="#536b87" font-weight="400" text-anchor="start">日志进入调查，调查留下可接手的记录</text>
<g transform="translate(75,145)">
<rect x="8" y="0" width="40" height="64" rx="7" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M20 8 H36 M23 56 H33" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M17 35 L25 43 L40 23" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="105" y="252" font-size="25" fill="#183457" font-weight="600" text-anchor="middle">客户端</text>
<text x="105" y="288" font-size="20" fill="#536b87" font-weight="400" text-anchor="middle">记录操作与响应</text>
<g transform="translate(305,145)">
<path d="M6 0 H40 L58 18 V64 H6 Z M40 0 V18 H58" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M17 29 H46" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M17 40 H38" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M17 51 H46" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="335" y="252" font-size="25" fill="#183457" font-weight="600" text-anchor="middle">诊断 report</text>
<text x="335" y="288" font-size="20" fill="#536b87" font-weight="400" text-anchor="middle">现场描述 + trace 线索</text>
<g transform="translate(555,145)">
<rect x="0" y="0" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 8 H12 M20 8 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
<rect x="0" y="23" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 31 H12 M20 31 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
<rect x="0" y="46" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 54 H12 M20 54 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="585" y="252" font-size="25" fill="#183457" font-weight="600" text-anchor="middle">服务器</text>
<text x="585" y="288" font-size="20" fill="#536b87" font-weight="400" text-anchor="middle">接收上报 / 保存现场</text>
<path d="M146 177 H284" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="215.0" y="151" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">生成报告</text>
<path d="M378 177 H534" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="456.0" y="151" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">上传 report</text>
<rect x="758" y="120" width="410" height="286" rx="10" fill="#e8f0fb" stroke="#90afd4" stroke-width="1.5"/>
<text x="786" y="159" font-size="24" fill="#183457" font-weight="600" text-anchor="start">Holon · 常驻 Runtime</text>
<text x="786" y="197" font-size="27" fill="#285fa7" font-weight="600" text-anchor="start">trace report Agent</text>
<text x="786" y="252" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">01</text>
<text x="824" y="252" font-size="20" fill="#183457" font-weight="400" text-anchor="start">读取获准 trace，还原操作过程</text>
<text x="786" y="304" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">02</text>
<text x="824" y="304" font-size="20" fill="#183457" font-weight="400" text-anchor="start">整理卡住位置与取消 / 恢复线索</text>
<text x="786" y="356" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">03</text>
<text x="824" y="356" font-size="20" fill="#183457" font-weight="400" text-anchor="start">注明日志缺口，保留待确认点</text>
<path d="M630 177 H746" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="692" y="147" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">webhook</text>
<text x="692" y="208" font-size="18" fill="#536b87" font-weight="400" text-anchor="middle">通知调查</text>
<path d="M590 302 V380 H746" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
<text x="600" y="344" font-size="19" fill="#536b87" font-weight="400" text-anchor="start">获准 trace</text>
<text x="600" y="370" font-size="18" fill="#536b87" font-weight="400" text-anchor="start">供 Agent 读取</text>
<path d="M961 406 V456" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="985" y="440" font-size="20" fill="#536b87" font-weight="400" text-anchor="start">创建 / 补充</text>
<rect x="550" y="470" width="618" height="116" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<g transform="translate(574,493)">
<rect x="0" y="0" width="64" height="64" rx="10" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<circle cx="17" cy="18" r="6" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M31 18 H53 M12 36 H51 M12 48 H43" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="664" y="510" font-size="26" fill="#183457" font-weight="600" text-anchor="start">GitHub Issue</text>
<text x="664" y="548" font-size="21" fill="#183457" font-weight="400" text-anchor="start">场景 · 证据 · 待确认点 · 标签 · 负责人</text>
<path d="M550 528 H435" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="492" y="506" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">交接</text>
<text x="72" y="510" font-size="26" fill="#183457" font-weight="600" text-anchor="start">开发者继续定位与修复</text>
<text x="72" y="548" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">不用重新下载日志、整理现场</text>
<path d="M28 622 H1172" fill="none" stroke="#c4d3e6" stroke-width="2"/>
<text x="28" y="658" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">调查线索 ≠ 已确认根因；已有 Issue 的结果补回原记录。</text>
</g></svg>

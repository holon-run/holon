<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1018" viewBox="0 0 480 1018" role="img" aria-labelledby="title desc">
<title id="title">一轮结束，工作仍在</title>
<desc id="desc">执行暂停，工作记录仍然保留</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#285fa7" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1018" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="32" y="49" font-size="29" fill="#183457" font-weight="600" text-anchor="start">一轮结束，工作仍在</text>
<text x="32" y="84" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">执行暂停，工作记录仍然保留</text>
<rect x="32" y="117" width="416" height="108" rx="10" fill="#fff" stroke="#d9e2eb"/>
<text x="56" y="158" font-size="27" fill="#183457" font-weight="600" text-anchor="start">Agent 判断</text>
<text x="56" y="197" font-size="24" fill="#53677d" font-weight="400" text-anchor="start">分析证据，决定下一步</text>
<path d="M240 225V260" fill="none" stroke="#285fa7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="261" width="416" height="108" rx="10" fill="#fff" stroke="#d9e2eb"/>
<text x="56" y="302" font-size="27" fill="#183457" font-weight="600" text-anchor="start">运行时登记</text>
<text x="56" y="341" font-size="24" fill="#53677d" font-weight="400" text-anchor="start">保存状态，安排后续执行</text>
<path d="M240 369V404" fill="none" stroke="#285fa7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="405" width="416" height="267" rx="10" fill="#eef4ff" stroke="#b6cbe7"/>
<text x="56" y="450" font-size="27" fill="#285fa7" font-weight="600" text-anchor="start">WorkItem / 持久工作记录</text>
<text x="56" y="496" font-size="24" fill="#183457" font-weight="600" text-anchor="start">目标与交付</text>
<text x="56" y="525" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">做到什么算完成</text>
<text x="56" y="559" font-size="24" fill="#183457" font-weight="600" text-anchor="start">进度与证据</text>
<text x="56" y="588" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">已经确认了什么</text>
<text x="56" y="622" font-size="24" fill="#183457" font-weight="600" text-anchor="start">等待与恢复</text>
<text x="56" y="651" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">何时回来查什么</text>
<text x="32" y="722" font-size="26" fill="#183457" font-weight="600" text-anchor="start">等待之后，接着做</text>
<text x="48" y="777" font-size="24" fill="#285fa7" font-weight="600" text-anchor="start">1</text>
<text x="86" y="777" font-size="25" fill="#183457" font-weight="600" text-anchor="start">信号到达</text>
<text x="86" y="807" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">检查恢复条件</text>
<path d="M55 788V824" fill="none" stroke="#d9e2eb" stroke-width="1.8"/>
<text x="48" y="849" font-size="24" fill="#285fa7" font-weight="600" text-anchor="start">2</text>
<text x="86" y="849" font-size="25" fill="#183457" font-weight="600" text-anchor="start">恢复上下文</text>
<text x="86" y="879" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">读取工作记录</text>
<path d="M55 860V896" fill="none" stroke="#d9e2eb" stroke-width="1.8"/>
<text x="48" y="921" font-size="24" fill="#285fa7" font-weight="600" text-anchor="start">3</text>
<text x="86" y="921" font-size="25" fill="#183457" font-weight="600" text-anchor="start">下一轮判断</text>
<text x="86" y="951" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">复查并更新记录</text>
<text x="32" y="997" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">信号不等于验收通过。</text>
</g></svg>
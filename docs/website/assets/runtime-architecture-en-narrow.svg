<rect x="32" y="200" width="416" height="216" rx="6" fill="#fff" stroke="#9ab1cd" stroke-width="1"/>
<text x="54" y="234" font-size="25" fill="#183457" font-weight="500" text-anchor="start">Holon Runtime</text>

<title id="title">131 天累计 Token 用量、角色占比与运行轮次唤醒结构</title><desc id="desc">2026年6月25日至11月2日，六类共享Agent累计204.31亿Token（含缓存输入），共运行39,809轮：外部Webhook事件唤醒占59.16%，内部续跑与调度占36.98%，人工直接发消息占2.88%，定时任务占0.99%。</desc>

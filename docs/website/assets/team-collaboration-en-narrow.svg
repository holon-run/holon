<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1700" viewBox="0 0 480 1700" role="img" aria-labelledby="title desc">
<title id="title">Track acceptance by release after Issue closure</title><desc id="desc">Merged PRs and closed Issues do not mean deployment, release, or acceptance is complete. The test Agent waits for deployment and release events, checks each change against its dependencies and the delivered version, and builds a checklist of changes and linked closed Issues. Fixes not yet included keep waiting. After automated or manual checks, version, scope, and evidence source are recorded in the Issue and release acceptance record.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#285fa7" stroke-width="1.5"/></marker></defs>
<rect width="480" height="1700" rx="16" fill="#f7faff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#183457">
<text x="28" y="48" font-size="24.42798353909465" fill="#183457" font-weight="600" text-anchor="start">Issue closed. Acceptance still open.</text>
<text x="28" y="84" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Follow a release cycle, not just a merge</text>
<rect x="28" y="116" width="424" height="118" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="48" y="153" font-size="22.231362467866322" fill="#183457" font-weight="600" text-anchor="start">PRs merged → linked Issues closed</text>
<text x="48" y="190" font-size="19.059907834101384" fill="#183457" font-weight="400" text-anchor="start">Merged, but not yet deployed or released</text>
<path d="M240 234 V274" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="280" width="424" height="426" rx="10" fill="#edf4ff" stroke="#285fa7" stroke-width="1.5"/>
<text x="48" y="319" font-size="25" fill="#285fa7" font-weight="600" text-anchor="start">Test Agent keeps tracking</text>
<text x="48" y="355" font-size="19.192575406032482" fill="#183457" font-weight="400" text-anchor="start">Wait for deploy / release; retain the work</text>
<rect x="48" y="378" width="384" height="88" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="68" y="413" font-size="24" fill="#183457" font-weight="600" text-anchor="start">Server deployed</text>
<text x="68" y="447" font-size="20.252054794520546" fill="#536b87" font-weight="400" text-anchor="start">Server changes: verify deployment</text>
<rect x="48" y="482" width="384" height="88" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="68" y="517" font-size="24" fill="#183457" font-weight="600" text-anchor="start">Client version released</text>
<text x="68" y="551" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Client changes: verify release</text>
<text x="48" y="611" font-size="20.93946731234867" fill="#285fa7" font-weight="600" text-anchor="start">Wait on each change's dependencies</text>
<text x="48" y="647" font-size="21.654450261780106" fill="#183457" font-weight="400" text-anchor="start">Not every change needs both events</text>
<text x="48" y="681" font-size="20.475247524752476" fill="#536b87" font-weight="400" text-anchor="start">Cross-platform fixes: check both sides</text>
<path d="M240 706 V744" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="750" width="424" height="180" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="48" y="790" font-size="18.323586744639375" fill="#183457" font-weight="600" text-anchor="start">Verify version; build acceptance checklist</text>
<text x="48" y="830" font-size="18.972477064220186" fill="#183457" font-weight="400" text-anchor="start">Changes actually delivered in this release</text>
<text x="48" y="864" font-size="22" fill="#183457" font-weight="400" text-anchor="start">+ their linked closed Issues</text>
<text x="48" y="904" font-size="19.01609195402299" fill="#536b87" font-weight="400" text-anchor="start">Do not group solely by Issue closure date</text>
<text x="28" y="966" font-size="23" fill="#285fa7" font-weight="600" text-anchor="start">Checklist items in a testable version</text>
<path d="M240 986 V1030" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="1068" font-size="24.88262910798122" fill="#183457" font-weight="600" text-anchor="start">Two ways to verify checklist items</text>
<rect x="28" y="1092" width="424" height="140" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="48" y="1130" font-size="24" fill="#285fa7" font-weight="600" text-anchor="start">Agent automated checks</text>
<text x="48" y="1168" font-size="18.30088495575221" fill="#183457" font-weight="400" text-anchor="start">E.g. redirects: 4 request types → responses</text>
<text x="48" y="1203" font-size="18.75736961451247" fill="#536b87" font-weight="400" text-anchor="start">Record scope; do not infer other coverage</text>
<rect x="28" y="1250" width="424" height="140" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="48" y="1288" font-size="20.840646651270205" fill="#936022" font-weight="600" text-anchor="start">Human testing; Agent records results</text>
<text x="48" y="1326" font-size="18.714932126696834" fill="#183457" font-weight="400" text-anchor="start">E.g. piano sound: patched app + firmware</text>
<text x="48" y="1361" font-size="17.6" fill="#536b87" font-weight="400" text-anchor="start">Reuse prior human results; no duplicate test</text>
<path d="M240 1390 V1430" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="1436" width="424" height="144" rx="10" fill="#edf4ff" stroke="#285fa7" stroke-width="1.5"/>
<text x="48" y="1477" font-size="17.556420233463033" fill="#285fa7" font-weight="600" text-anchor="start">Update Issue and release acceptance record</text>
<text x="48" y="1516" font-size="18.799999999999997" fill="#183457" font-weight="400" text-anchor="start">Version · check scope · evidence source</text>
<text x="48" y="1552" font-size="17.305439330543933" fill="#183457" font-weight="400" text-anchor="start">Separate automated and human conclusions</text>
<text x="28" y="1624" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Fixes not yet testable keep waiting;</text>
<text x="28" y="1660" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">without required feedback, do not pass.</text>
</g></svg>

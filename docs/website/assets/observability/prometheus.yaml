global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/holon-alerts.yaml

scrape_configs:
  - job_name: holon
    metrics_path: /api/control/runtime/metrics
    authorization:
      credentials_file: /run/secrets/holon-control-token
    static_configs:
      - targets:
          - 127.0.0.1:7878

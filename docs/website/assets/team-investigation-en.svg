<text x="786" y="159" font-size="24" fill="#183457" font-weight="600" text-anchor="start">Holon · Persistent runtime</text>
<text x="786" y="197" font-size="27" fill="#285fa7" font-weight="600" text-anchor="start">trace report Agent</text>
<text x="786" y="252" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">01</text>
<text x="824" y="252" font-size="15.635491606714629" fill="#183457" font-weight="400" text-anchor="start">Read authorized traces; reconstruct actions</text>
<text x="786" y="304" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">02</text>
<text x="824" y="304" font-size="18.628571428571426" fill="#183457" font-weight="400" text-anchor="start">Find stalls and cancel / resume clues</text>
<text x="786" y="356" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">03</text>
<text x="824" y="356" font-size="19.938837920489295" fill="#183457" font-weight="400" text-anchor="start">Note log gaps and open questions</text>

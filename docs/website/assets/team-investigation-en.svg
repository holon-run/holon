<text x="600" y="370" font-size="18" fill="#536b87" font-weight="400" text-anchor="start">For Agent access</text>
<path d="M961 406 V456" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="985" y="440" font-size="20" fill="#536b87" font-weight="400" text-anchor="start">Create / update</text>
<rect x="550" y="470" width="618" height="116" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<g transform="translate(574,493)">
<rect x="0" y="0" width="64" height="64" rx="10" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<circle cx="17" cy="18" r="6" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M31 18 H53 M12 36 H51 M12 48 H43" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="664" y="510" font-size="26" fill="#183457" font-weight="600" text-anchor="start">GitHub Issue</text>
<text x="664" y="548" font-size="17.53684210526316" fill="#183457" font-weight="400" text-anchor="start">Context · evidence · open questions · labels · owner</text>
<path d="M550 528 H435" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="492" y="506" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">Handoff</text>
<text x="72" y="510" font-size="23.587628865979383" fill="#183457" font-weight="600" text-anchor="start">Developers investigate and fix</text>
<text x="72" y="548" font-size="18.029268292682925" fill="#536b87" font-weight="400" text-anchor="start">No need to gather logs and context again</text>
<path d="M28 622 H1172" fill="none" stroke="#c4d3e6" stroke-width="2"/>
<text x="28" y="658" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Clues ≠ confirmed root cause; append findings to an existing Issue.</text>
</g></svg>

<rect x="0" y="46" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 54 H12 M20 54 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="585" y="252" font-size="25" fill="#183457" font-weight="600" text-anchor="middle">Server</text>
<text x="585" y="288" font-size="14.482758620689655" fill="#536b87" font-weight="400" text-anchor="middle">Receive report / retain context</text>
<path d="M146 177 H284" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="215.0" y="151" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">Create report</text>
<path d="M378 177 H534" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="456.0" y="151" font-size="19" fill="#536b87" font-weight="400" text-anchor="middle">Upload report</text>

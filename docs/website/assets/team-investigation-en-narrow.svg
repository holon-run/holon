<text x="88" y="398" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Upload report</text>
<path d="M65 560 V608" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="88" y="592" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Webhook notification</text>

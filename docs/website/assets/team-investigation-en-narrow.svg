<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1150" viewBox="0 0 480 1150" role="img" aria-labelledby="title desc">
<title id="title">From client report to GitHub Issue</title><desc id="desc">The client uploads a diagnostic report to the server. A webhook notifies the trace report Agent in Holon, which reads authorized traces, organizes context and evidence, and creates or updates a GitHub Issue for developers to investigate and fix.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#285fa7" stroke-width="1.5"/></marker></defs>
<rect width="480" height="1150" rx="16" fill="#f7faff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#183457">
<text x="28" y="48" font-size="25.49665924276169" fill="#183457" font-weight="600" text-anchor="start">From client report to GitHub Issue</text>
<text x="28" y="84" font-size="21.948235294117648" fill="#536b87" font-weight="400" text-anchor="start">Logs become evidence others can act on</text>
<g transform="translate(35,126)">
<rect x="8" y="0" width="40" height="64" rx="7" fill="white" stroke="#285fa7" stroke-width="1.5"/>

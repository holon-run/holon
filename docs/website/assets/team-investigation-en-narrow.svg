<text x="50" y="662" font-size="24" fill="#183457" font-weight="600" text-anchor="start">Holon · Persistent runtime</text>
<text x="50" y="698" font-size="25" fill="#285fa7" font-weight="600" text-anchor="start">trace report Agent</text>
<text x="50" y="747" font-size="16.522088353413654" fill="#183457" font-weight="400" text-anchor="start">01  Read authorized traces; reconstruct actions</text>
<text x="50" y="789" font-size="16.791836734693877" fill="#183457" font-weight="400" text-anchor="start">02  Find stalls, cancellation and recovery clues</text>
<text x="50" y="831" font-size="17.506382978723405" fill="#183457" font-weight="400" text-anchor="start">03  Note server-log gaps and open questions</text>

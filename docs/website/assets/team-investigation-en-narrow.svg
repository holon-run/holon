<rect x="0" y="46" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 54 H12 M20 54 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="130" y="468" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Server</text>
<text x="130" y="502" font-size="22" fill="#183457" font-weight="400" text-anchor="start">Receive reports</text>
<text x="130" y="538" font-size="22" fill="#183457" font-weight="400" text-anchor="start">Provide authorized traces</text>
<path d="M65 206 V254" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="88" y="238" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Create report</text>

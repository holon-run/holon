<text x="130" y="979" font-size="25" fill="#183457" font-weight="600" text-anchor="start">GitHub Issue</text>
<text x="130" y="1014" font-size="20.593023255813954" fill="#183457" font-weight="400" text-anchor="start">Context, evidence, labels, owner</text>
<text x="28" y="1074" font-size="24" fill="#285fa7" font-weight="600" text-anchor="start">→ Developers investigate and fix</text>
<text x="28" y="1120" font-size="20.366812227074238" fill="#536b87" font-weight="400" text-anchor="start">Investigation clues ≠ confirmed root cause</text>
</g></svg>

<path d="M17 51 H46" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="130" y="308" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Diagnostic report</text>
<text x="130" y="343" font-size="22" fill="#183457" font-weight="400" text-anchor="start">Context and trace clues</text>
<g transform="translate(35,446)">
<rect x="0" y="0" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 8 H12 M20 8 H52" fill="none" stroke="#285fa7" stroke-width="2"/>

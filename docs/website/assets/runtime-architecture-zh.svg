<text x="550.0" y="72" font-size="18" fill="#183457" font-weight="500" text-anchor="middle">Web UI</text>
<text x="550.0" y="94" font-size="14" fill="#536b87" font-weight="400" text-anchor="middle">浏览器</text>
<path d="M550.0 106V133" fill="none" stroke="#285fa7" stroke-width="1.2"/>
<rect x="725" y="48" width="190" height="58" rx="5" fill="#fff" stroke="#b8c6d6" stroke-width="1" stroke-dasharray="6 5"/>
<text x="820.0" y="72" font-size="18" fill="#536b87" font-weight="500" text-anchor="middle">Mobile UI</text>
<text x="820.0" y="94" font-size="14" fill="#536b87" font-weight="400" text-anchor="middle">未来构想</text>
<path d="M820.0 106V133" fill="none" stroke="#285fa7" stroke-width="1.2" stroke-dasharray="6 5"/>
<path d="M280.0 133H550.0" fill="none" stroke="#285fa7" stroke-width="1.2"/>

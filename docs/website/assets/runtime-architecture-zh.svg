<text x="142" y="273" font-size="16" fill="#536b87" font-weight="400" text-anchor="start">常驻后台 · daemon 模式</text>
<text x="143" y="319" font-size="20" fill="#285fa7" font-weight="500" text-anchor="start">Agents</text>

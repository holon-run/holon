<path d="M200 146H230V226H200" fill="none" stroke="#285fa7" stroke-width="1.2"/>
<path d="M230 186H330" fill="none" stroke="#285fa7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="238" y="174" font-size="14" fill="#285fa7" font-weight="400" text-anchor="start">连接</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img">
<title>Holon Runtime · 常驻后台与多端连接</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#285fa7" stroke-width="1.3"/></marker></defs>
<rect width="1100" height="520" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif">

<text x="352" y="265" font-size="18" fill="#285fa7" font-weight="500" text-anchor="start">Wait / Wake</text>
<text x="484" y="265" font-size="16" fill="#536b87" font-weight="400" text-anchor="start">等待条件与工作续接</text>

<path d="M370 266V319Q382 326 370 333V376H690" fill="none" stroke="#34746d" stroke-width="1.3"/>
<path d="M690 370V382" fill="none" stroke="#34746d" stroke-width="1.3"/>
<text x="386" y="364" font-size="14" fill="#34746d" font-weight="400" text-anchor="start">B · Await CI</text>
</g></svg>
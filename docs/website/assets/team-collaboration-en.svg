<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Track acceptance by release after Issue closure</title><desc id="desc">Merged PRs and closed Issues do not mean deployment, release, or acceptance is complete. The test Agent waits for deployment and release events, checks each change against its dependencies and the delivered version, and builds a checklist of changes and linked closed Issues. Fixes not yet included keep waiting. After automated or manual checks, version, scope, and evidence source are recorded in the Issue and release acceptance record.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#285fa7" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1080" rx="16" fill="#f7faff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#183457">
<text x="28" y="48" font-size="28" fill="#183457" font-weight="600" text-anchor="start">Issue closed. Acceptance still open.</text>
<text x="28" y="84" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">Follow a release cycle, not just a merge</text>
<rect x="28" y="116" width="1144" height="102" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="52" y="157" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Multiple PRs merged</text>
<text x="52" y="193" font-size="19.155405405405407" fill="#536b87" font-weight="400" text-anchor="start">Fixes within one release cycle</text>
<path d="M330 164 H392" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="157" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Linked Issues closed</text>
<text x="420" y="193" font-size="18.56353591160221" fill="#536b87" font-weight="400" text-anchor="start">Code done; acceptance still pending</text>
<path d="M760 134 V199" fill="none" stroke="#c4d3e6" stroke-width="2"/>
<text x="792" y="157" font-size="25" fill="#936022" font-weight="600" text-anchor="start">Not deployed / not released</text>
<text x="792" y="193" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">This does not establish acceptance</text>
<path d="M600 218 V255" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="262" width="1144" height="266" rx="10" fill="#edf4ff" stroke="#285fa7" stroke-width="1.5"/>
<text x="52" y="306" font-size="27" fill="#285fa7" font-weight="600" text-anchor="start">Test Agent tracks deployment / release events</text>
<rect x="52" y="330" width="524" height="100" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<g transform="translate(72,348)">
<rect x="0" y="0" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 8 H12 M20 8 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
<rect x="0" y="23" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 31 H12 M20 31 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
<rect x="0" y="46" width="64" height="17" rx="3" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M8 54 H12 M20 54 H52" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="159" y="370" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Server deployed</text>
<text x="159" y="407" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Server changes: verify deployment</text>
<rect x="624" y="330" width="524" height="100" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<g transform="translate(645,348)">
<rect x="8" y="0" width="40" height="64" rx="7" fill="white" stroke="#285fa7" stroke-width="1.5"/>
<path d="M20 8 H36 M23 56 H33" fill="none" stroke="#285fa7" stroke-width="2"/>
<path d="M17 35 L25 43 L40 23" fill="none" stroke="#285fa7" stroke-width="2"/>
</g>
<text x="730" y="370" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Client version released</text>
<text x="730" y="407" font-size="22" fill="#536b87" font-weight="400" text-anchor="start">Client changes: verify release</text>
<text x="52" y="470" font-size="21.93972602739726" fill="#183457" font-weight="400" text-anchor="start">Wait on each change's dependencies, not always both events; check both sides for cross-platform fixes.</text>
<text x="52" y="506" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">Pending acceptance work persists while waiting.</text>
<path d="M600 528 V565" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="572" width="1144" height="130" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="52" y="615" font-size="26" fill="#183457" font-weight="600" text-anchor="start">Verify version; build acceptance checklist</text>
<text x="52" y="655" font-size="23" fill="#183457" font-weight="400" text-anchor="start">Delivered changes + linked closed Issues</text>
<text x="52" y="684" font-size="20" fill="#536b87" font-weight="400" text-anchor="start">Do not group solely by Issue closure date</text>
<path d="M730 591 V682" fill="none" stroke="#c4d3e6" stroke-width="2"/>
<text x="760" y="618" font-size="23" fill="#285fa7" font-weight="600" text-anchor="start">Fixes not yet in a testable version</text>
<text x="760" y="658" font-size="20.455205811138015" fill="#536b87" font-weight="400" text-anchor="start">Keep waiting; not accepted this release</text>
<path d="M600 702 V739" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="779" font-size="25" fill="#183457" font-weight="600" text-anchor="start">Two ways to verify the acceptance checklist</text>
<rect x="28" y="802" width="548" height="130" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<rect x="624" y="802" width="548" height="130" rx="10" fill="white" stroke="#c4d3e6" stroke-width="1.5"/>
<text x="52" y="841" font-size="25" fill="#285fa7" font-weight="600" text-anchor="start">Agent automated checks</text>
<text x="52" y="878" font-size="21.065637065637066" fill="#183457" font-weight="400" text-anchor="start">E.g. redirects: 4 request types → check responses</text>
<text x="52" y="912" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">Record scope; do not infer other coverage</text>
<text x="648" y="841" font-size="25" fill="#936022" font-weight="600" text-anchor="start">Human testing; Agent records results</text>
<text x="648" y="878" font-size="22" fill="#183457" font-weight="400" text-anchor="start">E.g. piano sound: patched app + firmware</text>
<text x="648" y="912" font-size="21" fill="#536b87" font-weight="400" text-anchor="start">Reuse prior human results; no duplicate test</text>
<path d="M302 932 V952 H600 V971" fill="none" stroke="#285fa7" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M898 932 V952 H600" fill="none" stroke="#285fa7" stroke-width="2"/>
<rect x="28" y="978" width="1144" height="74" rx="10" fill="#edf4ff" stroke="#285fa7" stroke-width="1.5"/>
<text x="52" y="1024" font-size="25" fill="#285fa7" font-weight="600" text-anchor="start">Update Issue and release acceptance record</text>
<text x="680" y="1024" font-size="19.91044776119403" fill="#183457" font-weight="400" text-anchor="start">Record version, check scope and evidence source</text>
</g></svg>

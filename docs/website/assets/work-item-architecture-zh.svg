<text x="424" y="155" font-size="26" fill="#183457" font-weight="600" text-anchor="start">运行时登记</text>
<text x="424" y="198" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">保存进度与等待</text>
<text x="424" y="234" font-size="23" fill="#53677d" font-weight="400" text-anchor="start">安排后续执行</text>

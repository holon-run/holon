<path d="M56 369H664" fill="none" stroke="#c4d6ec" stroke-width="1.8"/>
<text x="56" y="412" font-size="25" fill="#183457" font-weight="600" text-anchor="start">目标与交付</text>
<text x="56" y="455" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">做到什么算完成</text>
<text x="262" y="412" font-size="25" fill="#183457" font-weight="600" text-anchor="start">进度与证据</text>
<text x="262" y="455" font-size="22" fill="#53677d" font-weight="400" text-anchor="start">已经确认了什么</text>
<text x="468" y="412" font-size="25" fill="#183457" font-weight="600" text-anchor="start">等待与恢复</text>

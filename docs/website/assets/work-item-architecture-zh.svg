<text x="400" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">接回这项工作</text>
<path d="M500 375H558" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="560" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="660" y="370" font-size="18" fill="#183457" font-weight="600" text-anchor="middle">继续推进</text>
<text x="660" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">复查并更新记录</text>

<text x="480" y="133" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">保存状态 · 安排执行</text>
<path d="M340 116H458" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M610 150V189" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="720" height="102" rx="6" fill="#eef4ff" stroke="#c4d6ec"/>
<text x="60" y="220" font-size="20" fill="#285fa7" font-weight="600" text-anchor="start">WorkItem</text>
<text x="182" y="220" font-size="15" fill="#53677d" font-weight="400" text-anchor="start">持久工作记录</text>
<path d="M60 236H740" fill="none" stroke="#d4e0ee" stroke-width="1.3"/>
<text x="60" y="267" font-size="18" fill="#183457" font-weight="400" text-anchor="start">目标与交付</text>

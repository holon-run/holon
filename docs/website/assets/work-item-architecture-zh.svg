<text x="540" y="267" font-size="18" fill="#183457" font-weight="400" text-anchor="start">等待与恢复</text>
<path d="M400 292V343" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 7"/>
<text x="414" y="321" font-size="14" fill="#53677d" font-weight="400" text-anchor="start">读取工作记录</text>
<rect x="40" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>
<text x="140" y="370" font-size="18" fill="#183457" font-weight="600" text-anchor="middle">信号到达</text>
<text x="140" y="392" font-size="14" fill="#53677d" font-weight="400" text-anchor="middle">检查恢复条件</text>
<path d="M240 375H298" fill="none" stroke="#285fa7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="300" y="344" width="200" height="62" rx="6" fill="#fff" stroke="#d9e2eb"/>

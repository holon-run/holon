<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
<title id="title">同一个 PR，随新进展继续审阅。</title><desc id="description">三个事件沿时间推进同一个 PR：新 PR 触发审阅，等待修改；新提交触发复审，等待 CI；CI 结果触发核对，条件满足后交付。同一个工作项保留全过程。</desc>
<defs><style>text { font-family: "Heiti SC", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #142E36; }</style>
<marker id="teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#087F77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#B5792B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#4C68A7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#587078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1800" height="1080" rx="0" fill="#F7F7F2"/>
<text x="62" y="76" font-size="44" style="fill:#142E36" font-weight="600">同一个 PR，随新进展继续审阅。</text>
<text x="62" y="124" font-size="23" style="fill:#587078">收到新修改或检查结果后，审阅 Agent 对照已有问题继续复核。</text>
<text x="1740" y="68" font-size="16" style="fill:#087F77" text-anchor="end">HOLON / CONTINUOUS REVIEW</text>

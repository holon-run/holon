<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
<title id="title">共享 Agent，持续跟进交接中的工作。</title><desc id="description">三条泳道展示系统与共享记录、Holon 团队共享 Agent、团队成员。调查 Agent 从日志整理 Issue，开发者修复合并；测试 Agent 保留待验收工作，部署或发布事件到来后核对版本，自动检查并汇总已有或新补充的真机结果，更新验收记录。</desc>

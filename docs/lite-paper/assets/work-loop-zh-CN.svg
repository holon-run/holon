<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
  <title id="title">事件触发行动，工作循环推进</title>
  <desc id="description">外部事件、时间触发和人的输入进入 Holon。Agent 顺时针循环查看进度、判断下一步、执行验证和更新进度。有下一步时继续，需要条件时保存进度并等待，条件满足后恢复，达到验收条件后交付结果。Holon 提供角色与技能、工作状态、工作区与工具、等待与唤醒。</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#087F77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7A9298" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#B5792B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Heiti SC", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #142E36; }
      .title { font-size: 44px; font-weight: 600; }
      .subtitle { font-size: 22px; fill: #587078; }
      .label { font-size: 20px; font-weight: 600; }
      .detail { font-size: 17px; fill: #587078; }
      .small { font-size: 16px; fill: #587078; }
      .number { font-size: 16px; fill: #087F77; font-weight: 600; }
      .loop { fill: none; stroke: #087F77; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
      .input { fill: none; stroke: #7A9298; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .wait { fill: none; stroke: #B5792B; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-gold); }
      .delivery { fill: none; stroke: #087F77; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#F7F7F2"/>
  <text x="62" y="76" class="title">响应变化，一步步推进工作。</text>
  <text x="62" y="124" class="subtitle">Agent 理解目标并执行；Holon 保存进度、管理工作环境，并在需要时唤醒它。</text>
  <text x="1740" y="68" text-anchor="end" class="small" style="letter-spacing: 2px; fill: #087F77;">HOLON / WORK MODEL</text>

  <!-- Runtime boundary. All work, wait and completion state live in this environment. -->
  <rect x="426" y="176" width="1314" height="790" rx="24" fill="#FFFFFF" stroke="#D5DFDC" stroke-width="1.5"/>
  <rect x="454" y="202" width="8" height="25" rx="4" fill="#087F77"/>
  <text x="476" y="222" class="label">Holon · 持续工作的运行环境</text>

  <!-- Three explicit entry points. -->
  <text x="62" y="282" class="label" style="fill: #587078;">工作从这里进入</text>
  <rect x="62" y="332" width="282" height="96" rx="14" fill="#E5F1EB"/>
  <circle cx="87" cy="360" r="5" fill="#087F77"/>
  <text x="104" y="368" class="label">外部事件</text>
  <text x="86" y="401" class="detail">邮件 / 订单 / CI / 日志</text>
  <text x="356" y="367" class="small">webhook</text>

  <rect x="62" y="476" width="282" height="96" rx="14" fill="#FBF0DC"/>
  <circle cx="87" cy="504" r="5" fill="#B5792B"/>
  <text x="104" y="512" class="label">时间触发</text>
  <text x="86" y="545" class="detail">定时回查 / 周期巡检</text>

  <rect x="62" y="620" width="282" height="96" rx="14" fill="#EBEFF8"/>
  <circle cx="87" cy="648" r="5" fill="#4C68A7"/>
  <text x="104" y="656" class="label">任务安排与反馈</text>
  <text x="86" y="689" class="detail">网页 / 终端 / API</text>

  <path class="input" d="M344 380 H392 V668 H344 M344 524 H392"/>
  <circle cx="392" cy="524" r="4" fill="#7A9298"/>
  <path class="input" d="M392 524 H470 V310 H855" marker-end="url(#arrow-muted)"/>
  <text x="558" y="296" class="small">新工作 / 新信号</text>

  <!-- Clockwise Agent loop. -->
  <path class="loop" d="M1155 332 C1222 332 1260 370 1260 462"/>
  <path class="loop" d="M1260 550 C1260 632 1214 676 1155 676"/>
  <path class="loop" d="M855 676 C788 676 750 630 750 550"/>
  <path class="loop" d="M750 462 C750 390 787 354 855 354"/>
  <text x="680" y="396" class="small" style="fill: #087F77;">继续推进</text>

  <circle cx="1005" cy="507" r="86" fill="#F0F7F3"/>
  <text x="1005" y="498" text-anchor="middle" class="label" style="fill: #087F77;">Agent 工作循环</text>
  <text x="1005" y="530" text-anchor="middle" class="small">有下一步，继续做</text>

  <rect x="855" y="288" width="300" height="88" rx="14" fill="#E5F1EB" stroke="#C6DDD3"/>
  <text x="873" y="321" class="number">01</text>
  <text x="906" y="321" class="label">查看新消息与工作进度</text>
  <text x="906" y="350" class="detail">查看已有进度与待办</text>

  <rect x="1110" y="462" width="300" height="88" rx="14" fill="#E5F1EB" stroke="#C6DDD3"/>
  <text x="1128" y="495" class="number">02</text>
  <text x="1161" y="495" class="label">理解目标，判断下一步</text>
  <text x="1161" y="524" class="detail">结合已有信息与权限</text>

  <rect x="855" y="632" width="300" height="88" rx="14" fill="#E5F1EB" stroke="#C6DDD3"/>
  <text x="873" y="665" class="number">03</text>
  <text x="906" y="665" class="label">使用工具，执行并检查</text>
  <text x="906" y="694" class="detail">处理项目文件与资料</text>

  <rect x="600" y="462" width="300" height="88" rx="14" fill="#E5F1EB" stroke="#C6DDD3"/>
  <text x="618" y="495" class="number">04</text>
  <text x="651" y="495" class="label">更新进度与结果</text>
  <text x="651" y="524" class="detail">记录发现、结果与下一步</text>

  <!-- Waiting suspends the loop; a signal re-enters the read step. -->
  <path class="wait" d="M1410 506 H1480"/>
  <text x="1426" y="481" class="small" style="fill: #B5792B;">需等待</text>
  <rect x="1480" y="422" width="232" height="124" rx="14" fill="#FBF0DC" stroke="#E8D2AB"/>
  <text x="1497" y="455" class="label" style="fill: #936325;">保存进度，进入等待</text>
  <text x="1497" y="490" class="detail">任务结果 / 外部事件</text>
  <text x="1497" y="519" class="detail">或人的决定</text>
  <path class="wait" stroke-dasharray="7 7" d="M1596 422 V252 H1005 V288"/>
  <rect x="1197" y="232" width="240" height="32" rx="7" fill="#FFFFFF"/>
  <text x="1317" y="254" text-anchor="middle" class="small" style="fill: #B5792B;">条件满足，恢复原工作</text>

  <!-- Completion leaves the current work loop. -->
  <path class="delivery" d="M600 506 H550 V802 H1596 V754"/>
  <rect x="1010" y="785" width="190" height="34" rx="7" fill="#FFFFFF"/>
  <text x="1105" y="808" text-anchor="middle" class="small" style="fill: #087F77;">达到验收条件</text>
  <rect x="1480" y="646" width="232" height="108" rx="14" fill="#142E36"/>
  <text x="1499" y="684" class="label" style="fill: #FFFFFF; font-size: 24px;">交付结果</text>
  <text x="1499" y="722" class="small" style="fill: #C3D9D3; font-size: 14px;">结果 · 检查依据 · 完成报告</text>

  <!-- Holon support layer; the Agent authors progress, the runtime persists it. -->
  <rect x="454" y="872" width="1258" height="67" rx="12" fill="#F2F5F2"/>
  <text x="476" y="913" class="detail" style="fill: #087F77;">Holon 提供</text>
  <text x="665" y="913" class="label" style="font-size: 18px;">角色与技能</text>
  <text x="909" y="913" class="label" style="font-size: 18px;">工作状态</text>
  <text x="1145" y="913" class="label" style="font-size: 18px;">工作区与工具</text>
  <text x="1443" y="913" class="label" style="font-size: 18px;">等待与唤醒</text>

  <text x="62" y="1019" class="subtitle" style="font-size: 23px;">有下一步就继续；需要回复或结果时等待；达到要求后交付。</text>
  <text x="1740" y="1020" text-anchor="end" class="small">中文图示草稿 · 2026-09-18</text>
</svg>
